<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TopRate v2 — week</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ink:#F7F6F3; --panel:#FFFFFF; --panel2:#EDEBE5; --rule:#DCD7CD;
  --text:#1A1F24; --dim:#586269; --faint:#8A939A;
  --pos:#2E7150; --neg:#A63350; --brass:#8A6A12; --flat:#C2BEB5; --cond:#27608C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.an{font-family:"Archivo Narrow",Arial Narrow,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
header{border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:10px}
.meet{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:34px;letter-spacing:-.01em;margin:0;line-height:1}
.date{color:var(--dim);font-size:14px}
.conds{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-self:center}

.days{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:14px;overflow-x:auto}
.days button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:var(--dim);padding:8px 14px 9px;cursor:pointer;font-family:inherit;text-align:left;white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.days button .d{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:17px;color:inherit}
.days button .s{font-size:11px;color:var(--faint)}
.days button:hover{color:var(--text)}
.days button[aria-selected=true]{color:var(--text);border-bottom-color:var(--brass)}
.days button[aria-selected=true] .s{color:var(--dim)}
.days button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}

.mtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.mtabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--rule);border-radius:3px;color:var(--dim);padding:8px 13px;cursor:pointer;white-space:nowrap;text-align:left;font-family:inherit;font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:118px}
.mtabs button:hover{border-color:var(--dim);color:var(--text)}
.mtabs button[aria-selected=true]{border-color:var(--brass);background:var(--panel2);color:var(--text)}
.mtabs button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.mtabs .tk{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:14.5px}
.mtabs .sb{color:var(--faint);font-size:10.5px;display:flex;gap:7px}
.mtabs .sb .w{color:var(--cond)}

nav{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--rule)}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:8px 13px 7px;cursor:pointer;font-family:"Archivo Narrow",sans-serif;font-size:15px;font-weight:600;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
nav button .rt{font-size:11.5px;font-weight:500;color:var(--faint)}
nav button[aria-selected=true] .rt{color:var(--brass)}
nav button .cd{font-size:11px;font-weight:600;color:var(--pos);font-variant-numeric:tabular-nums}
nav button .cd.soon{color:var(--brass)}
nav button .cd.gone{color:var(--faint);font-weight:500}
nav button:hover{color:var(--text)}
nav button[aria-selected=true]{color:var(--text);border-bottom-color:var(--brass)}
nav button.sum{color:var(--brass)}
nav button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}

.mnote{margin:0 0 14px;padding:9px 13px;border-left:3px solid var(--cond);background:var(--panel);color:var(--dim);font-size:12.5px;line-height:1.5}
.surf{background:var(--panel2);color:var(--text);border:1px solid var(--brass);border-radius:3px;padding:2px 6px;font:inherit;font-size:12.5px}
.surfall{background:none;color:var(--dim);border:1px solid var(--rule);border-radius:3px;padding:2px 8px;font:inherit;font-size:12px;cursor:pointer;margin-left:4px}
.surfall:hover{color:var(--text);border-color:var(--brass)}
.rerated{color:var(--cond);font-size:12px;margin-left:6px}
.rnote{margin:0 0 14px;padding:10px 13px;border-left:3px solid var(--brass);background:var(--panel);color:var(--text);font-size:13px;line-height:1.5}
.rnote b{color:var(--brass);font-family:"Archivo Narrow",sans-serif;font-size:14px}



.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font-weight:500;font-size:11.5px;color:var(--faint);padding:0 8px 7px;border-bottom:1px solid var(--rule);line-height:1.25;vertical-align:bottom}
th.r{text-align:right}
tbody tr{border-bottom:1px solid var(--panel2)}
td{padding:9px 8px;vertical-align:middle}
tbody tr.run,tbody tr.srow{cursor:pointer}
tbody tr.run:hover,tbody tr.srow:hover{background:var(--panel)}
tbody tr.run:focus-visible,tbody tr.srow:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.tab{font-family:"Archivo Narrow",sans-serif;font-weight:600;color:var(--dim);font-size:15px;width:30px}
.silk{width:26px;height:26px;border-radius:2px;background:var(--panel2);flex:0 0 26px;object-fit:contain}
.silk.ph{display:inline-block}
.horse{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:9px}
.jock{color:var(--dim);font-size:12.5px;margin-top:1px;padding-left:35px}
.res{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:10.5px;border-radius:2px;padding:1px 5px;letter-spacing:.03em;white-space:nowrap;line-height:1.3}
.res.r1{background:var(--brass);color:var(--ink)}
.res.r2,.res.r3,.res.r4{border:1px solid var(--dim);color:var(--dim)}
.replay{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--cond);color:var(--cond);
  border-radius:3px;padding:4px 11px;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.replay span{font-size:10px}
.replay:hover{background:var(--cond);color:var(--ink)}
@media(max-width:720px){.replay{margin-left:0}}
nav button .cd.st{text-transform:uppercase;letter-spacing:.04em;font-size:10px}
.tagu{border:1px solid var(--brass);color:var(--brass);border-radius:2px;font-size:9.5px;font-family:"Archivo Narrow",sans-serif;font-weight:600;padding:1px 4px;letter-spacing:.03em;white-space:nowrap}
.tagv.gold{border-color:var(--brass);color:var(--brass)}
.tagv{border:1px solid var(--pos);color:var(--pos);border-radius:2px;font-size:9.5px;font-family:"Archivo Narrow",sans-serif;font-weight:600;padding:1px 4px;white-space:nowrap}
.bar{color:var(--dim);font-size:13px;width:44px}
.l5{font-family:"Archivo Narrow",sans-serif;font-size:15px;letter-spacing:.14em;color:var(--dim);white-space:nowrap;width:86px;font-variant-numeric:tabular-nums}
.l5 b{color:var(--text);font-weight:600}
.l5 i{font-style:normal;color:var(--faint)}
.l5 .none{color:var(--faint);letter-spacing:0}
.l5{width:136px}
.l5:has(.l5b){letter-spacing:0;display:flex;flex-wrap:nowrap;align-items:flex-start;gap:2px 5px}
/* last-5 tokens: bare numbers, no box. A small play mark sits under any start that
   has a replay. Colour says one thing only: --text for a real race, --dim for a trial
   or jump-out. A win is not singled out here -- the placing digit already says it, and
   .w stays on the element as a hook if that ever changes. */
.l5b{display:inline-flex;flex-direction:column;align-items:center;flex:0 0 auto;
  color:var(--text);font-size:14.5px;font-weight:600;line-height:1.05;text-decoration:none;
  font-variant-numeric:tabular-nums}
.l5b.jo{color:var(--dim);font-weight:500}
/* the mark reserves its box on every token, so the numbers stay on one baseline
   whether or not there is a replay; only a link paints the triangle in */
.l5b:after{content:"";display:block;margin-top:3px;width:0;height:0;
  border-left:5px solid transparent;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
a.l5b:after{border-left-color:currentColor;opacity:.7}
a.l5b:hover,a.l5b:focus{color:var(--brass);outline:none}
a.l5b:hover:after,a.l5b:focus:after{opacity:1}
.l5 em{font-style:normal;color:var(--faint);font-size:12px;line-height:1.05;align-self:flex-start}
.mtabs button.today{border-color:var(--brass);border-style:dashed}
.mtabs button.today[aria-selected=true]{border-style:solid}
.mtabs button.today .tk{color:var(--brass)}
.mtabs button.more{min-width:0;color:var(--faint);border-style:dashed;justify-content:center;align-self:stretch}
.mtabs button.more:hover{color:var(--text);border-color:var(--dim)}
.mtabs button.more[aria-expanded=true]{color:var(--text);border-color:var(--dim)}
/* the other meetings of the day, kept out of the way until asked for */
.mtabs.sub{margin-top:-8px;align-items:center}
.mtabs.sub:empty{display:none}
.mtabs.sub .lbl{color:var(--faint);font-size:10.5px;white-space:nowrap;padding-right:2px;letter-spacing:.02em}
.mtabs.sub button{min-width:0;padding:5px 10px;background:none}
.mtabs.sub .tk{font-size:13px}
.mtabs.sub .sb{font-size:10px}
.dayhead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:2px 0 12px;justify-content:flex-end}
.daysort{color:var(--faint);font-size:11.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;border-left:1px solid var(--rule);color:var(--dim);font:inherit;font-size:11.5px;
  padding:3px 10px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--brass);font-weight:600}
.daytab .why{color:var(--dim);font-size:12.5px;line-height:1.45;max-width:480px}
.res.un{border:1px solid var(--faint);color:var(--faint);font-weight:500}
.abil{font-family:"Archivo Narrow",sans-serif;font-size:17px;text-align:right;width:56px;color:var(--dim)}
.abil.est{color:var(--faint);font-style:italic}
.rate{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:23px;text-align:right;width:64px;letter-spacing:-.01em}
tbody tr.run.top .rate{color:var(--brass)}
.pct{font-family:"Archivo Narrow",sans-serif;font-size:15px;width:52px;text-align:right;color:var(--dim)}
/* key column: adjusted rating */
/* key band: adjusted + lengths */
td.key,th.key,td.key2,th.key2{background:rgba(154,122,26,.10)}
td.key,th.key{box-shadow:inset 1px 0 0 rgba(154,122,26,.42)}
td.key2,th.key2{box-shadow:inset -1px 0 0 rgba(154,122,26,.42)}
th.key,th.key2{color:var(--brass)}
tbody tr.run:hover td.key,tbody tr.run:hover td.key2{background:rgba(154,122,26,.16)}
tbody tr.run.top td.key,tbody tr.run.top td.key2{background:rgba(154,122,26,.20)}
.lens{font-family:"Archivo Narrow",sans-serif;font-size:17px;font-weight:600;width:66px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums;padding-left:10px;padding-right:12px}
/* adjustments: the net move off the base. What made it is in the opened row. */
.adj{width:62px;text-align:right}
.adjn{font-family:"Archivo Narrow",sans-serif;font-variant-numeric:tabular-nums;font-size:16.5px;font-weight:600}
.adjn.p{color:var(--pos)} .adjn.g{color:var(--neg)} .adjn.f{color:var(--faint)}
th.bk small{display:block;font-size:10px;color:var(--faint);font-family:"Archivo Narrow",sans-serif;font-variant-numeric:tabular-nums;line-height:1.2}
.price{font-family:"Archivo Narrow",sans-serif;font-size:15px;width:64px;text-align:right;color:var(--cond);font-variant-numeric:tabular-nums}
.price.mk{color:var(--faint)}
.price.mk.up{color:var(--pos)} .price.mk.dn{color:var(--neg)}
.price .arw{font-size:10px;margin-right:2px;vertical-align:1px}
.edge{font-family:"Archivo Narrow",sans-serif;font-size:14px;text-align:right;width:52px;color:var(--faint)}
.edge.p{color:var(--pos)} .edge.g{color:var(--neg)}
.detail td{background:var(--panel);padding:14px 16px 18px}
/* opened row: base, every adjustment biggest first, then the total. Numbers in one column. */
.adjsum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px;font-size:12.5px;color:var(--dim)}
.adjsum b{font-family:"Archivo Narrow",sans-serif;font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;color:var(--text)}
.adjsum b.tot{color:var(--brass)}
.adjsum .ar{color:var(--faint)}
.adjsum .net.p{color:var(--pos)} .adjsum .net.g{color:var(--neg)} .adjsum .net.f{color:var(--faint)}
/* the seven, left to right, biggest first */
.adjr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0 14px}
.adjr>div{border-top:1px solid var(--rule);padding:7px 0 0;min-width:0}
.adjr .n{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adjr .v{font-family:"Archivo Narrow",sans-serif;font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;line-height:1.2}
.adjr .v.p{color:var(--pos)} .adjr .v.g{color:var(--neg)} .adjr .v.f{color:var(--faint)}
.adjr .w{color:var(--faint);font-size:10.5px;line-height:1.35;margin-top:2px}
@media(max-width:1000px){.adjr{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}}
@media(max-width:680px){.adjr{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:4px}
.rhead h2{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:23px;margin:0}
.rhead .meta{color:var(--dim);font-size:13px;flex:1 1 0;min-width:0}
.flag{margin:0 0 14px;padding:10px 13px;background:var(--panel);border-left:2px solid var(--brass);border-radius:0 3px 3px 0;font-size:12.5px;color:var(--dim)}
.flag b{color:var(--brass);font-family:"Archivo Narrow",sans-serif;font-size:14px}
.stop{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:14.5px}
.sname{color:var(--dim);font-size:12px}
.stime{font-family:"Archivo Narrow",sans-serif;font-weight:500;color:var(--brass);font-size:13px;margin-left:4px}
.rhead .meta b.stime{font-size:14px;margin-left:0}
/* speed map: a one-line read on the page, the field itself behind a click.
   Columns are where a horse is projected to settle; inside a column the fence
   is at the bottom and the wider gates stack above it. */
.smap{margin:0 0 12px;background:var(--panel);border:1px solid var(--rule);border-radius:3px}
.smh{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 11px;width:100%;background:none;border:0;
     color:inherit;font:inherit;text-align:left;cursor:pointer;padding:8px 12px}
.smap.open .smh{border-bottom:1px solid var(--rule);margin-bottom:10px}
.smh:hover .tog{color:var(--text)}
.smh:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.smh b{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:13.5px;color:var(--text);flex:0 0 auto}
.smh .ctx{font-size:12px;color:var(--brass);font-family:"Archivo Narrow",sans-serif;font-weight:600;flex:0 0 auto}
.smh .sub{font-size:12px;color:var(--dim);flex:1 1 220px;min-width:0}
.smh .sub u{text-decoration:none;color:var(--pos)} .smh .sub s{text-decoration:none;color:var(--neg)}
.smh .tog{font-size:11px;color:var(--faint);flex:0 0 auto;font-family:"Archivo Narrow",sans-serif;letter-spacing:.04em;text-transform:uppercase}
.smbody{padding:0 12px 11px}
.smgrid{display:flex;gap:7px;align-items:stretch;padding-left:15px;position:relative}
.smoff{position:absolute;left:0;top:0;bottom:0;width:13px;color:var(--faint);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:flex-start;justify-content:center;font-family:"Archivo Narrow",sans-serif}
.smcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.smcol>.hd{font-family:"Archivo Narrow",sans-serif;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);text-align:center;padding-bottom:5px;border-bottom:1px solid var(--rule);margin-bottom:6px}
.smcol.empty>.hd{opacity:.45}
.smstack{display:flex;flex-direction:column-reverse;gap:3px;justify-content:flex-start;min-height:24px}
.smc{display:flex;align-items:center;gap:5px;padding:3px 5px 3px 4px;border-radius:2px;background:var(--panel2);border-left:3px solid var(--flat);min-width:0}
.smc.p{border-left-color:var(--pos)} .smc.g{border-left-color:var(--neg)}
.smc.led{background:#E4E9EF}
.smc b{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text);flex:0 0 auto;min-width:13px;text-align:right}
.smc span{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0}
.smc.led span{color:var(--text)}
.smc i{font-style:normal;font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 auto}
.smc em{font-style:normal;font-size:9.5px;color:var(--brass);font-variant-numeric:tabular-nums;flex:0 0 auto}
.smrail{margin:7px 0 0 15px;height:2px;background:linear-gradient(90deg,var(--brass),rgba(154,122,26,.28));position:relative}
.smrail em{position:absolute;left:0;top:3px;font-style:normal;color:var(--faint);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
.smnone{margin-top:14px;color:var(--faint);font-size:11.5px}
.legend{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);color:var(--faint);font-size:12px;display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:1px;margin-right:6px;vertical-align:-1px}
._off{margin-top:20px;color:var(--faint);font-size:12.5px;line-height:1.75;max-width:80ch}
._off b{color:var(--dim);font-weight:600}
._off h3{font-family:"Archivo Narrow",sans-serif;font-size:16px;color:var(--text);margin:18px 0 4px;font-weight:600}
@media(max-width:720px){h1{font-size:28px}.conds{margin-left:0;width:100%}.rate{font-size:21px}.jock{padding-left:0}}
@media(prefers-reduced-motion:no-preference){tbody tr.run,tbody tr.srow{transition:background .12s ease}}
/* status strip */
body{padding-bottom:38px}
.trs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:6px 20px;background:var(--panel);border-top:1px solid var(--rule);color:var(--dim);font-size:12.5px;line-height:1.4}
.trs .dot{width:8px;height:8px;border-radius:50%;background:var(--flat);flex:0 0 8px}
.trs.ok .dot{background:var(--pos)} .trs.prelim .dot{background:var(--brass)} .trs.fail .dot{background:var(--neg)}
.trs b{color:var(--text);font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:13.5px}
.trs .ago{color:var(--faint)}
.trs .m{color:var(--faint);margin-left:auto;display:flex;gap:12px;flex-wrap:wrap}
.trs .m span{white-space:nowrap}
.trs .m i{font-style:normal;color:var(--dim);font-family:"Archivo Narrow",sans-serif;font-variant-numeric:tabular-nums}
.trs .why{color:var(--dim)}
.trs .m i.warn{color:var(--brass)} .trs .m i.bad{color:var(--neg)}
.trs .tag{border:1px solid var(--brass);color:var(--brass);border-radius:2px;font-size:9.5px;font-family:"Archivo Narrow",sans-serif;
  font-weight:600;padding:1px 5px;letter-spacing:.04em;text-transform:uppercase}
.trs.fail .tag{border-color:var(--neg);color:var(--neg)}
.trs .reload{background:var(--brass);color:var(--ink);border:0;border-radius:3px;padding:3px 10px;font:inherit;font-weight:600;
  font-size:12px;cursor:pointer}
.trs .reload:hover{filter:brightness(1.1)}
.trs[hidden]{display:none}
/* pipeline's own banner: shown only if status.json is unreachable, restyled to the page */
#tr-updated{position:fixed!important;left:0!important;right:0!important;bottom:0!important;z-index:50!important;
  font:12.5px/1.4 Inter,system-ui,sans-serif!important;padding:8px 20px!important;background:var(--panel)!important;
  color:var(--dim)!important;border-top:1px solid var(--rule)!important;text-align:left!important}
#tr-updated b{color:var(--text);font-family:"Archivo Narrow",sans-serif;font-weight:600}
#tr-updated+div{display:none}
@media(max-width:720px){.trs{padding:6px 12px;gap:8px 10px}.trs .t{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trs .m{margin-left:0;width:100%;gap:10px}.trs .reload{width:100%}body{padding-bottom:64px}}
.bspc{font-family:"Archivo Narrow",sans-serif;font-size:10.5px;font-weight:400;color:var(--faint);white-space:nowrap;margin-top:1px}
.mkt-fresh{display:inline-block;font-size:9.5px;font-weight:400;color:var(--faint);margin-left:2px;white-space:nowrap}
th:has(.mkt-fresh){white-space:nowrap}
.mkt-fresh.warn{color:var(--brass)} .mkt-fresh.bad{color:var(--neg)}
/* Inline replay dock.  Sky race replays are plain MP4s on mediatabs.skyracing.com.au
   and play in a <video>; racing.com jump-outs are Brightcove player pages and need the
   iframe.  The dock sits outside #race on purpose: the live feed rebuilds that element
   every time a price moves, which would stop playback mid-run. */
.vdock{position:fixed;right:16px;bottom:46px;z-index:60;width:min(460px,92vw);
  background:var(--panel);border:1px solid var(--rule);border-radius:4px;box-shadow:0 8px 28px rgba(30,26,18,.18)}
.vdock .vh{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 11px;border-bottom:1px solid var(--rule)}
.vdock .vt{flex:1 1 auto;min-width:0;color:var(--dim);font-size:11.5px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vdock .vx{background:none;border:0;color:var(--faint);cursor:pointer;font-family:inherit;font-size:14px;line-height:1;padding:3px 6px}
.vdock .vx:hover{color:var(--text)}
.vdock .vb{position:relative;aspect-ratio:16/9;background:#000}
.vdock .vb video,.vdock .vb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
@media(max-width:720px){.vdock{right:0;left:0;bottom:34px;width:auto;border-radius:0;border-left:0;border-right:0}}
/* Watch live opens racing.com's own page in its own window.  Not framed in ours:
   this dashboard is a public page, and framing their vision is re-transmission. */
.wlive{border:1px solid var(--cond);border-radius:3px;background:var(--panel);color:var(--cond);
  font-family:inherit;font-size:12.5px;font-weight:600;padding:5px 11px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.wlive span{font-size:10px}
.vdock.wide{width:min(680px,94vw)}          /* live vision is a whole page, not a clip */
.vdock .vt a{color:var(--cond);text-decoration:none}
.vdock .vt a:hover{text-decoration:underline}
.vdock .vmsg{color:var(--dim);font-size:12.5px;padding:14px;text-align:center}
.wlive .rcl{height:10px;width:auto;display:block;flex:0 0 auto}
.wlive .skl{height:19px;width:auto;display:block;flex:0 0 auto}   /* their wordmark, monochrome, takes the button's colour */
.wlive:hover{background:var(--cond);color:var(--ink)}

/* ---- narrow screens -------------------------------------------------------
   The field table IS the page: reading a race means comparing a column straight
   down the field, so a phone drops columns rather than re-flowing each runner
   into a card. Nothing dropped is lost -- base, every adjustment and the total
   are all in the opened row, one tap away. Order of sacrifice, least useful
   first: Base and Lengths (both read straight off Adjusted), then the barrier,
   then the net Adjust, then the silks. Tab number, runner, last 5, adjusted
   rating, our price and the market survive to the narrowest width. */
@media(max-width:860px){
  .wrap{padding:14px 14px 60px}
  table{min-width:640px}
  .rtab th:nth-child(5),.rtab td.abil,
  .rtab th:nth-child(8),.rtab td.lens{display:none}
  /* the gold key band loses its right-hand edge with Lengths gone: put it back on Adjusted */
  .rtab td.key,.rtab th.key{box-shadow:inset 1px 0 0 rgba(154,122,26,.42),inset -1px 0 0 rgba(154,122,26,.42)}
  .sumtab th:nth-child(5),.sumtab td.edge{display:none}
}
@media(max-width:720px){
  table{min-width:0}
  th{padding:0 6px 6px} td{padding:8px 6px}
  .rtab th:nth-child(3),.rtab td.bar{display:none}
  .sumtab th:nth-child(2),.sumtab td:nth-child(2),
  .sumtab th:nth-child(8),.sumtab td:nth-child(8){display:none}
  .daytab th:nth-child(1),.daytab td:nth-child(1){display:none}
  .daytab .why{font-size:12px;line-height:1.4}
  .horse{flex-wrap:wrap;gap:3px 8px;min-width:0}
  .detail td{padding:12px 10px 14px}
  .rhead h2{font-size:20px}
  .adjsum b{font-size:16px}
  /* the speed map is a grid of settling bands with horse names in them: it does not
     compress, so let it scroll sideways inside its own panel */
  .smbody{overflow-x:auto}
  .smgrid{min-width:548px} .smrail{min-width:533px}
  .vdock{bottom:64px}          /* clear the two-line status strip, not the one-line one */
}
@media(max-width:560px){
  .rtab th:nth-child(6),.rtab td.adj{display:none}
  .daytab th:nth-child(4),.daytab td.why{display:none}
  .horse{font-size:13.5px}
  .l5{width:auto} .l5b{font-size:13px}
  .rate{font-size:19px;width:52px}
  .abil{font-size:15px;width:48px}
  .price{font-size:13.5px;width:52px}
  .lens{padding-left:6px;padding-right:6px}
  .rhead h2{font-size:18px} .rhead .meta{font-size:12px}
  .mtabs button{min-width:104px;padding:7px 11px}
  /* The market column's freshness stamp wraps "122% / Mkt / . 6m ago" onto a third
     line and drags the whole header row down with it. It is the same tabAgeInfo()
     the status strip prints as "TAB 6m ago", same text and same warn/bad colour,
     and that strip is fixed to the bottom of the screen -- so drop the duplicate
     here and let Mkt sit level with Model. */
  .mkt-fresh{display:none}
  /* One line per runner, so a field scrolls in one screen instead of three.
     Clamped, NOT nowrap: in an auto-layout table a nowrap line sets the column's
     minimum width and shoves the market price off the screen. Clamping leaves the
     text breakable -- the column is still sized by the horse's name -- and hides
     the overflow. table-layout:fixed is not the alternative: the opened row's
     colspan=10 outruns the five columns a phone shows and collapses the header. */
  .jock{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
}
@media(max-width:420px){
  .wrap{padding:12px 10px 60px}
  .silk{display:none}
  th{font-size:10.5px;padding:0 4px 6px} td{padding:8px 4px}
  .tab{font-size:13.5px;width:22px}
  .horse{font-size:13px}
  .jock{font-size:11.5px}
  .rate{font-size:18px;width:46px}
  .price{font-size:12.5px;width:46px}
  .l5b{font-size:12px}
  .l5{letter-spacing:0}
  h1{font-size:24px}
}

// --- barrier factor (see barrier.py) --------------------------------------
// -0.1589 logits per unit of relative barrier, z=-4.9, on 87,382 runs;
// /0.0766 logits-per-WPR-point = 2.07 points across the inside-to-outside span.
const BAR_SPAN=2.07;
function barAdj(bar,n){
  if(bar==null||!(n>1))return 0;
  const b=+bar; if(!(b>=1)||b>n)return 0;
  return +((0.5-(b-1)/(n-1))*BAR_SPAN).toFixed(2);
}
DATA.days.forEach(d=>d.meetings.forEach(m=>m.races.forEach(r=>{
  // If rate_day.py is ever patched to emit bar_adj itself, it is already in
  // x.rating -- leave the race alone rather than counting barrier twice.
  if(r.runners.some(x=>x.bar_adj!=null))return;
  const n=r.runners.length;
  r.runners.forEach(x=>{x.bar_adj=barAdj(x.bar,n);});
  r.runners.forEach(x=>{x.rating=+(x.rating+x.bar_adj).toFixed(1);});
  const e=r.runners.map(x=>Math.exp(d.k*x.rating)), z=e.reduce((a,b)=>a+b,0);
  r.runners.forEach((x,i)=>{x.pct=+(100*e[i]/z).toFixed(1); x.fair=+(z/e[i]).toFixed(2);});
  r.runners.sort((a,b)=>b.rating-a.rating);
})));

DATA.days.forEach(d=>d.meetings.sort((a,b)=>{                       // stable: keeps builder order within a state
  const ia=STATE_ORDER.indexOf(a.state), ib=STATE_ORDER.indexOf(b.state);
  return (ia<0?9:ia)-(ib<0?9:ib);}));

// NT is never carried. "all" puts the secondary meetings back; they are still rated either way.
const METRO={VIC:['flemington','caulfield','moonee valley','the valley','sandown'],
             NSW:['randwick','royal randwick','rosehill','warwick farm','canterbury','kembla grange'],
             QLD:['eagle farm','doomben','sunshine coast','gold coast'],
             SA:['morphettville'],
             WA:['ascot','belmont'],
             TAS:['hobart','launceston'],
             ACT:['canberra']};
const DROP_STATE=['NT'];
function classRank(c){                                   // fallback only: rough strength of a race's class
  const t=String(c||'');
  if(/group\s*1/i.test(t))return 100; if(/group\s*2/i.test(t))return 92; if(/group\s*3/i.test(t))return 84;
  if(/listed/i.test(t))return 76;                       // black type is the only class label that travels;
  const bm=t.match(/(?:benchmark|bm)\s*(\d+)/i); if(bm)return 20+ +bm[1]/5;   // a country "Open" or "Cup" says
  const cl=t.match(/class\s*(\d+)/i); if(cl)return 22+ +cl[1];                //   nothing about the card's strength
  if(/maiden|mdn/i.test(t))return 5;
  return 14;
}
function meetScore(m){
  const t=String(m.track).toLowerCase();          // prefix, so Belmont Park, Rosehill Gardens,
  const metro=(METRO[m.state]||[]).some(x=>t.startsWith(x));   // Morphettville Parks and Sandown Hillside all land
  const prize=m.races.map(r=>r.prize).filter(v=>v>0);
  if(prize.length)                                      // what the meeting is worth: the feature, then the card
    return (metro?1e12:0)+Math.max(...prize)*1e4+prize.reduce((a,b)=>a+b,0);
  const best=Math.max(...m.races.map(r=>classRank(r.cls)));   // day files built before rate_day.py carried prize
  return (metro?1e12:0)+best*1e4+m.races.length*20+(m.n||0);

// Every meeting we will ever show: NT is dropped outright and never appears, in the strip,

function liveMeets(d){ return d.meetings.map((m,i)=>i).filter(i=>!DROP_STATE.includes(d.meetings[i].state)); }

function mainMeets(d){                                   // -> Set of indices into d.meetings
  const win={};
  d.meetings.forEach((m,i)=>{
    if(DROP_STATE.includes(m.state)) return;
    const sc=meetScore(m);
    if(!win[m.state]||sc>win[m.state].sc) win[m.state]={i,sc};
  });
  return new Set(Object.values(win).map(v=>v.i));

const SURF={dry:'Good / Firm',soft:'Soft 5–6',wet:'Soft 7 / Heavy 8',heavy:'Heavy 9+',synth:'Synthetic'};

  if(!r.runners[0].condc || !SURF[cls]) return;      // '' = the "going not posted" placeholder

  if(r.runners[0].barc){const wet=(cls==='wet'||cls==='heavy'); r.runners.forEach(x=>{x.bar_adj=wet?x.barc.wet:x.barc.dry;});}   // the draw fades on wet ground (15 Sep 2026)
  const raw=r.runners.map(x=>x.condc[cls]??0); const mean=raw.reduce((a,b)=>a+b,0)/raw.length;

// rating -> chance as rate_day.py does it: the sum of the adjustments, centred within the race, times each runner's own
// fair-price slope (fairprice.py). Pages without pslope fall back to 1, which is the old flat softmax.
function reprice(r,k){
  r.runners.forEach(x=>{x.rating=+(x.wprbase+x.form+x.firstup+x.conn+x.cond+(x.bar_adj||0)+(x.shape||0)+(x.spell||0)+(x.arc||0)+(x.track||0)+(x.debmkt||0)).toFixed(1);});
  const mean=r.runners.reduce((a,x)=>a+x.rating,0)/r.runners.length;
  const e=r.runners.map(x=>Math.exp(k*(x.pslope??1)*(x.rating-mean))); const z=e.reduce((a,b)=>a+b,0);
  r.runners.forEach((x,i)=>{x.pct=+(100*e[i]/z).toFixed(1); x.fair=+(z/e[i]).toFixed(2);});
  r.runners.sort((a,b)=>b.rating-a.rating);
}
// Debutants take the market into the rating (Simon 15 Sep 2026, items 17 and 18). A debutant with a TAB price, in a race three
// quarters priced, adds debut.with_price.mk_pts per unit of -log price against the priced runners' mean, and its debut point and
// stable weight switch to the priced set; otherwise the unpriced set. live.json lists priced runners only, so a scratched runner
// simply drops out of the mean. Re-read on every live.json poll, the same rule rate_day.py applies at 03:00.
function debutPrice(r,d){
  if(!d.debut||!r.runners.some(x=>x.dfu)) return;
  const pr=r.runners.filter(x=>x.sp>1); const ok=pr.length>=0.75*r.runners.length;
  const mean=ok?pr.reduce((a,x)=>a-Math.log(x.sp),0)/pr.length:0;
  r.runners.forEach(x=>{ if(!x.dfu) return; const on=ok&&x.sp>1;
    x.firstup=on?x.dfu.wp:x.dfu.np; x.conn=on?x.dcx.wp:x.dcx.np;
    x.debmkt=on?+(d.debut.with_price.mk_pts*(-Math.log(x.sp)-mean)).toFixed(2):0; });

// it will be run, going and distance about today's conditions, then spell, exposure,
// trials and the stable. Fixed, not sorted by size -- the same factor sits in the same place every
// time, so the eye learns the row instead of re-reading it.
// Exposure joined on 12 Sep 2026: where the horse sits on its own career -- how many
// starts it has had, and how it went last time -- which a weighted mean of past ratings
// cannot know. Next to Spell because both are about the horse rather than the race.
// Track joined on 14 Sep 2026, beside Distance: both are about today's race. Its figures at this track

const FXK=['bar_adj','shape','cond','form','track','spell','arc','firstup','debmkt','conn'];
const FXT={bar_adj:'Barrier', shape:'Shape', cond:'Going', form:'Distance', track:'Track',

const fxv=x=>FXK.filter(k=>k!=='debmkt'||x.dfu).map(k=>[k,x[k]??0]);
const fxsign=v=>(v>0?'+':'−')+Math.abs(v).toFixed(1);

// last-5 form string: oldest -> newest, 'x' = spell, trailing 'x' = first-up today
function last5(s){

// last-5 as replay buttons; falls back to the plain string when tokens are absent
// The column is headed Last 5 but the feed carries every run it has, up to twelve, so the
// cell was wrapping onto a second line for most of the field. Keep the most recent five
// runs and whatever spell marks fall among them, and let it be one line.
function last5of(t, n=5){
  let runs=0, i=t.length;
  while(i>0 && runs<n){ if(!t[i-1].x) runs++; i--; }
  while(i>0 && t[i-1].x) i--;                 // a spell mark reads as leading into the run after it
  return t.slice(i);
}
function l5cell(x){

// market chance with the book removed.
// Until 12 Sep 2026 this divided every runner by the book, which assumes the
// bookmaker's margin is spread evenly across the field. It is not: it sits on the
// long prices. Measured against ten years of Betfair SP, that assumption made the
// market chance 40% too high on a 1-in-50 shot and 8% too low on a favourite
// (docs/NOTE_2026-09-12_calibration_bsp.md).
// MKT_K is the power-method exponent, fitted on 2019-23 by log loss and confirmed
// on 2024-25, and it lands between 1.11 and 1.14 at every field size, so one number
// does the job. k=1 is the old behaviour. Betfair SP cannot be used here: it does
// not exist until the race has been run.
// Since 1b7ef1c took the value rule off the page this has exactly ONE live caller,
// the whyPick wording, and flags nothing. It stays correct anyway, and it stays in
// step with ledger.py's MKT_K, so that a value rule coming back finds them agreeing.
const MKT_K=1.12;
function mktp(r){
  const priced=r.runners.filter(x=>x.sp);
  const ov=priced.reduce((a,x)=>a+Math.pow(1/x.sp,MKT_K),0);
  const m={}; priced.forEach(x=>m[x.no]=ov?Math.pow(1/x.sp,MKT_K)/ov:null); return m;
}
function resBadge(track,r,x){
  const lv=LIVE[`${track}|${r.no}`]; if(!lv) return '';
  const p=placeOf(lv,x.no);
  if(p!==null) return ` <span class="res r${p+1}">${ORD[p]}</span>`;
  return (lv.status==='Paying'&&lv.results&&lv.results.length)?' <span class="res un">unpl</span>':'';
}
const ordn=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][Math.min(n%10,4)]||'th');
function dayPicks(){
  const items=[], d=D(), inView=new Set(shownMeets(d));
  d.meetings.forEach((m,mi)=>{ if(!inView.has(mi)) return; m.races.forEach((r,ri)=>{
    const a=analyse(r); if(!a.top||!r.runners[1]) return;
    const put=(x,kind,sc)=>{const it=items.find(i=>i.r===r&&i.x===x);
      if(it){it.kinds.push(kind);it.score+=sc;} else items.push({m,mi,r,ri,x,a,kinds:[kind],score:sc});};
    if(a.gap>=GAP_STANDOUT) put(a.top,'standout',100+a.gap);              // standouts first, by margin
  });});
  const top=items.sort((p,q)=>q.score-p.score).slice(0,15);     // which 15: always on strength
  const run=it=>{const lv=LIVE[`${it.m.track}|${it.r.no}`]; return lv&&(lv.status==='Paying'||lv.status==='Abandoned')?1:0;};
  if(daySort==='time') return top.sort((p,q)=>run(p)-run(q)||String(p.r.start_utc||'').localeCompare(String(q.r.start_utc||'')));
  if(daySort==='rating') return top;
  return top.sort((p,q)=>p.mi-q.mi||p.r.no-q.r.no);             // meeting, then race
}

function whyPick(it){
  const {x,r,a}=it, top=a.top, sec=r.runners[1], out=[];
  if(x===top) out.push(`${a.gap>=GAP_STANDOUT?'Best on ratings':'Top rated'}, ${(a.gap/2).toFixed(1)}L clear of ${sec.name}`);
  else out.push(`Rated ${ordn(r.runners.indexOf(x)+1)}, ${((top.rating-x.rating)/2).toFixed(1)}L behind ${top.name}`);
  if(x.sp){
    const q=mktp(r)[x.no], e=q?(x.pct/100)/q:null;
    if(e>=1.3) out.push(`$${x.sp.toFixed(2)} against a $${x.fair.toFixed(2)} model — ${e.toFixed(1)}× the market's chance, which on measurement predicts nothing`);
    else if(e>=1.1) out.push(`$${x.sp.toFixed(2)} is a little over the $${x.fair.toFixed(2)} model`);
    else if(e!==null&&e<0.9) out.push(`model $${x.fair.toFixed(2)} but the market has it shorter at $${x.sp.toFixed(2)}`);
    else out.push(`model $${x.fair.toFixed(2)}, market $${x.sp.toFixed(2)} — priced about right`);

}
function analyse(r){

// Every flag on the page comes from here, so a runner cannot be called one thing in the
// summary and another in the race. Simon, 12 Sep: standout stays at 3 points clear, value
// is the 1.15-1.3 band and anything above 1.3 is best v price. Nothing else is flagged.
// EDGE_VALUE null = no second tier. Measured 12 Sep over 2,187 value picks: the size of
// the edge does not predict the return -- every band from 1.3 up sits between -12% and
// -21% with no trend -- so a second label below the first would rank races by how much we
// disagree with the market, not by how likely we are to be right. Set it to a number to

DATA.days.forEach(d=>{ if(d.priced==='tab') return;

// ---- speed map -------------------------------------------------------------
// The overview is on the page every race; the field itself is one click away.
// Open, it is a column per settling band from the race shape projection
// (rs_pos_raw), with the fence at the bottom of a column and the wider gates
// stacked above it -- the heuristic every hand-drawn map uses until we can
// project width off the rail properly. Colour is the Shape adjustment.
let smap=false;
function toggleMap(){ smap=!smap; draw(); }
const SMB=[[0.15,'Lead'],[0.30,'On-pace'],[0.50,'Handy'],[0.70,'Midfield'],[1.01,'Back']];
const SMCTX={'lone speed':'one horse clearly wants the lead — expect it cheap in front',
             'contested':'more than one wants the lead — expect pressure early',
             'open lead':'nobody is committed to the lead — the least predictable tempo of the four',
             'ordinary':'no strong lead pattern'};
function speedMap(r){
  const on=r.runners.filter(x=>x.rspos!=null);
  if(on.length<3) return '';
  const off=r.runners.filter(x=>x.rspos==null);
  const top=on.reduce((m,x)=>(x.plead!=null&&(m===null||x.plead>m.plead))?x:m,null);
  const hi=on.filter(x=>(x.shape??0)>=0.3).sort((a,b)=>b.shape-a.shape).slice(0,2);
  const lo=on.filter(x=>(x.shape??0)<=-0.3).sort((a,b)=>a.shape-b.shape).slice(0,2);
  const nm=a=>a.map(x=>`${x.no} ${x.name}`).join(', ');

  // the one-line read that sits on the page
  const bits=[];
  if(r.ncont) bits.push(`${r.ncont} want the lead`);
  if(top&&top.plead>=0.25) bits.push(`likely leader <b>${top.no} ${top.name}</b> ${(100*top.plead).toFixed(0)}%`);
  if(hi.length) bits.push(`helps <u>${nm(hi)}</u>`);
  if(lo.length) bits.push(`hurts <s>${nm(lo)}</s>`);
  const head=`<button class="smh" onclick="toggleMap()" aria-expanded="${smap}"><b>Speed map</b>`+
    `${r.ctx?`<span class="ctx">${r.ctx}</span>`:''}<span class="sub">${bits.join(' &nbsp;·&nbsp; ')}</span>`+
    `<span class="tog">${smap?'hide map':'show map'}</span></button>`;
  if(!smap) return `<div class="smap">${head}</div>`;

  const cols=SMB.map(()=>[]);
  on.forEach(x=>{ const i=SMB.findIndex(b=>x.rspos<b[0]); cols[i<0?4:i].push(x); });
  const grid=cols.map((c,i)=>{
    // Stacked on the gate, inside at the foot. Not on where the horse will
    // actually be running: a projection of width from the draw and the map
    // orders a field 0.95 to 0.99 like the gate, while realised width at the
    // turn orders only 0.43 like it (NOTE_2026-09-11_caught_wide_tracking 4.6).
    // The re-sorting is real and we cannot forecast it, so do not imply we can.
    c.sort((a,b)=>(a.bar??99)-(b.bar??99));
    const chips=c.map(x=>{
      const sh=x.shape??0;
      const cls=(Math.abs(sh)<0.3?'':(sh>0?'p':'g'))+((top&&top.no===x.no&&top.plead>=0.25)?' led':'');
      const pl=(x.plead!=null&&x.plead>=0.20)?`<em>${(100*x.plead).toFixed(0)}%</em>`:'';
      const tip=`${x.name} — maps ${x.rslab}, gate ${x.bar??'?'}`+
                (x.plead!=null?`, ${(100*x.plead).toFixed(0)}% to lead`:'')+
                `, shape ${sh>0?'+':'−'}${Math.abs(sh).toFixed(2)}`;
      return `<div class="smc ${cls}" title="${tip.replace(/"/g,'&quot;')}"><b>${x.no}</b><span>${x.name}</span><i>${x.bar??'?'}</i>${pl}</div>`;
    }).join('');
    return `<div class="smcol${c.length?'':' empty'}"><div class="hd">${SMB[i][1]}</div><div class="smstack">${chips}</div></div>`;
  }).join('');
  const sgn=a=>a.map(x=>`${x.name} ${x.shape>0?'+':'−'}${Math.abs(x.shape).toFixed(2)}`).join(', ');
  return `<div class="smap open">${head}<div class="smbody">
    <div class="smgrid"><div class="smoff">gate, inside at the foot</div>${grid}</div>
    <div class="smrail"><em>rail</em></div>
    <div class="smnone">${SMCTX[r.ctx]||''}${(hi.length||lo.length)?`${SMCTX[r.ctx]?' · ':''}shape helps ${hi.length?sgn(hi):'nobody by 0.3'}${lo.length?`, hurts ${sgn(lo)}`:''}`:''}</div>
    ${off.length?`<div class="smnone">Not mapped (no settling history): ${off.map(x=>`${x.no} ${x.name}`).join(', ')}</div>`:''}</div></div>`;
}

function drawRace(){
  const r=M().races[active], a=analyse(r);
  const book=r.runners.filter(x=>x.sp).reduce((a,x)=>a+100/x.sp,0);   // market percentage
  const lvh=liveOf(r), replay=(lvh&&lvh.status==='Paying'&&lvh.replay)?`<a class="replay" href="${lvh.replay}" target="_blank" rel="noopener" data-vlabel="${M().track} R${r.no} — replay">Replay <span>▶</span></a>`:'';
  let h=`<div class="rhead"><h2>${r.name}</h2><div class="meta">${r.dist}m &nbsp;·&nbsp; ${r.cls} &nbsp;·&nbsp; ${r.n} runners &nbsp;·&nbsp; ${r.going||'going TBA'}
    ${r.surf?`&nbsp;·&nbsp; rate as <select class="surf" onchange="setSurf(this.value)">${(SURF[r.surf_now||r.surf]?'':'<option value="" selected>going not posted — no conditions factor</option>')}${Object.keys(SURF).map(c=>`<option value="${c}" ${(r.surf_now||r.surf)===c?'selected':''}>${SURF[c]}</option>`).join('')}</select><button class="surfall" onclick="setSurfMeet(document.querySelector('select.surf').value)" title="apply this surface to every race at the meeting">all races</button>${(r.surf_now&&r.surf_now!==r.surf)?'<span class="rerated">re-rated</span>':''}`:''}</div>${replay}</div>`;
  if(r.note) h+=`<p class="rnote"><b>Read:</b> ${r.note}</p>`;
  if(r.unrated) h+=`<p class="flag"><b>${r.unrated}</b> of ${r.n} runners have no rated runs. They start from the field average of
    ${r.fieldmean.toFixed(1)}, then take the debut mark-down plus whatever their most recent trial says. Treat those ratings as an estimate.</p>`;
  h+=speedMap(r);
  h+=`<div class="scroll"><table class="rtab"><thead><tr><th></th><th>Runner</th><th>Bar</th><th class="l5h">Last 5</th><th class="r" title="our base: last 10 runs weighted to recent, shockers forgiven, wide runs credited">Base</th>
    <th class="r" title="How far today's factors move the horse off its base. Click a runner for the seven that make it up.">Adjust</th>
    <th class="r key">Adjusted</th><th class="r key2">Lengths</th><th class="r bk"><small>100%</small>Model</th><th class="r bk"><small>${book?book.toFixed(0)+'%':'&nbsp;'} <span class="mkt-fresh"></span></small>Mkt</th></tr></thead><tbody>`;
  const topR=r.runners[0].rating, lv=liveOf(r);
  r.runners.forEach((x,i)=>{
    const lens=(topR-x.rating)/2;
    const ov=x.sp?(x.sp>=x.fair*1.15?' up':(x.sp<=x.fair/1.15?' dn':'')):'';   // overlay: market vs fair
    h+=`<tr class="run${i===0?' top':''}" tabindex="0" data-i="${i}">
      <td class="tab">${x.no}</td>
      <td><div class="horse">${silk(x)}${x.name}${(()=>{const p=placeOf(lv,x.no);return p===null?'':` <span class="res r${p+1}">${ORD[p]}</span>`;})()}${x.unrated?' <span class="tagu">NO RATING</span>':''}</div>
        <div class="jock">${x.jockey||'jockey TBA'} &nbsp;·&nbsp; ${x.trainer}</div></td>
      <td class="bar an">${x.bar??'—'}</td>
      <td class="l5">${l5cell(x)}</td>
      <td class="abil${x.unrated?' est':''}">${x.wprbase.toFixed(1)}</td>
      ${adjCell(x)}
      <td class="rate key">${x.rating.toFixed(1)}</td>
      <td class="lens key2${i===0?' top':''}">${i===0?'':'−'+lens.toFixed(1)+'L'}</td>
      <td class="price">$${x.fair.toFixed(2)}</td>
      <td class="price mk${ov}">${x.sp?(ov?`<span class="arw">${ov===' up'?'▲':'▼'}</span>`:'')+'$'+x.sp.toFixed(2):'—'}${x.bsp?`<div class="bspc" title="Betfair SP: the price money actually changed hands at. Known only after the race.">BSP $${x.bsp.toFixed(2)}</div>`:''}</td></tr>`;
    if(open===i){
      h+=`<tr class="detail"><td colspan="10">${fxLedger(x,r)}</td></tr>`;
    }
  });
  $("race").innerHTML=h+"</tbody></table></div>";
  document.querySelectorAll("tr.run").forEach(tr=>{
    const go=()=>{const i=+tr.dataset.i; open=open===i?null:i; draw();};
    tr.onclick=go; tr.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};
  });
}

function draw(){
  drawDays(); drawMeets();
  $("tabs").style.display=meet<0?'none':'';
  if(meet<0){ $("tabs").innerHTML=''; drawDay(); refreshTabAge(); return; }
  const races=M().races;
  $("tabs").innerHTML=`<button role="tab" class="sum" aria-selected="${active===-1}" onclick="pick(-1)"><span class="rn">Summary</span><span class="rt">&nbsp;</span><span class="cd">&nbsp;</span></button>`+
    races.map((r,i)=>`<button role="tab" aria-selected="${i===active}" onclick="pick(${i})"><span class="rn">R${r.no}</span><span class="rt">${r.time||'&nbsp;'}</span><span class="cd" data-t="${r.start_utc||''}" data-k="${M().track}|${r.no}">&nbsp;</span></button>`).join("");
  if(active===-1) drawSummary(); else drawRace();
  countdown(); refreshTabAge();
}

function countdown(){
  const now=Date.now();
  document.querySelectorAll("nav .cd[data-t]").forEach(el=>{
    const lv=LIVE[el.dataset.k]; const st=lv&&lv.status;
    if(st&&st!=='Normal'){ const m={Closed:['closed','soon'],Interim:['interim','soon'],Paying:['paying','gone'],Abandoned:['abnd','gone']}[st];
      if(m){el.textContent=m[0]; el.className='cd '+m[1]+' st'; return;} }
    const t=el.dataset.t; if(!t){el.innerHTML="&nbsp;";return;}
    let s=Math.round((new Date(t).getTime()-now)/1000), cls="";
    let txt;
    if(s<=-1800){txt="ran";cls="gone";}
    else if(s<=0){txt="jumping";cls="soon";}
    else if(s>=86400){txt=Math.floor(s/86400)+"d";}
    else if(s>=3600){txt=Math.floor(s/3600)+"h "+Math.floor((s%3600)/60)+"m";}
    else{txt=Math.max(1,Math.ceil(s/60))+"m";cls="soon";}
    el.textContent=txt; el.className="cd"+(cls?" "+cls:"");
  });
}
setInterval(countdown,30000);
window.pick=i=>{active=i;open=null;draw();};
window.pickMeet=i=>{meet=i;active=-1;open=null;draw();$("tabs").scrollIntoView({behavior:'smooth',block:'nearest'});};
window.pickDay=i=>{day=i;meet=-1;active=-1;open=null;draw();};
draw();

// ---- TAB feed freshness: "generated" from live.json -> "Nm ago", coloured
// warn/bad only inside the feed's own 08:00-22:30 Melbourne polling window.
function tabAgeInfo(){
  if(!window.TAB_GENERATED) return null;
  const gen=new Date(window.TAB_GENERATED); if(isNaN(gen)) return null;
  const mins=Math.round((Date.now()-gen)/60000);
  const now=new Date(), mod=now.getHours()*60+now.getMinutes();
  const inWindow=mod>=480&&mod<=1350;
  let cls='';
  if(inWindow){ if(mins>=45) cls='bad'; else if(mins>=16) cls='warn'; }
  const txt=mins<1?'just now':mins<60?`${mins}m ago`:`${Math.floor(mins/60)}h ${mins%60}m ago`;
  return {txt,cls};
}
function refreshTabAge(){
  const info=tabAgeInfo();
  document.querySelectorAll('.tab-age').forEach(el=>{
    el.textContent=info?info.txt:'—'; el.className='tab-age'+(info&&info.cls?' '+info.cls:'');
  });
  document.querySelectorAll('.mkt-fresh').forEach(el=>{
    el.textContent=info?'· '+info.txt:''; el.className='mkt-fresh'+(info&&info.cls?' '+info.cls:'');
  });
}
setInterval(refreshTabAge,30000);

// ---- live overlay: reads live.json beside the page, polls every 60 s -------
(function(){
  let last='';
  async function tick(){
    let j; try{const r=await fetch('live.json',{cache:'no-store'}); if(!r.ok) throw 0; j=await r.json();}catch(e){return;}
    window.TAB_GENERATED=j&&j.generated||null; refreshTabAge();
    const races=j&&j.races||{}; const sig=JSON.stringify(races); if(sig===last) return;
    last=sig; window.LIVE=races; applyLivePrices(races,j.date); draw();
  }
  tick(); setInterval(tick,60000); window._liveTick=tick;
})();

// ---- replay dock: a replay plays on the page, not in a new tab -------------
// Two kinds of link land here. TAB's Sky replays (mediatabs.skyracing.com.au) are
// plain MP4s -- open Akamai files, no referer check -- and play in a <video>.
// racing.com jump-outs are Brightcove player pages, so they go in an iframe.
// Anything else returns false and the click falls through to the old new-tab
// behaviour, so an unrecognised link is never swallowed.
function playVid(url,label){
  const b=$("vdb"); if(!b||!url) return false;
  let inner;
  if(/\.mp4(\?|$)/i.test(url))
    inner=`<video src="${url}" controls autoplay playsinline preload="metadata"></video>`;
  else if(/^https:\/\/players\.brightcove\.net\//i.test(url))
    inner=`<iframe src="${url}${url.includes('?')?'&':'?'}autoplay=true" allowfullscreen
             allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  else return false;
  $("vdt").textContent=label||'Replay';
  b.innerHTML=inner;
  killHls();
  $("vdock").classList.remove('wide');
  $("vdock").hidden=false;
  return true;
}
window.closeVid=()=>{ killHls(); const b=$("vdb"); if(b) b.innerHTML='';
  const d=$("vdock"); if(d){ d.hidden=true; d.classList.remove('wide'); } };
// Delegated: the live feed rebuilds #race under us every time a price moves, so a
// handler bound to the links themselves would not survive the first redraw.
document.addEventListener('click',e=>{
  if(e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;   // ctrl/cmd-click still opens a tab
  const a=e.target.closest('a.l5b[href], a.replay[href]');
  if(!a) return;
  const label=a.dataset.vlabel||(a.getAttribute('title')||'').trim()||'Replay';
  if(playVid(a.href,label)) e.preventDefault();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeVid(); });

// ---- watch live: racing.com's vision, in the dock --------------------------
// They serve watch-live with no X-Frame-Options and no CSP frame-ancestors, so it
// frames. th=true is their own thin-header variant, the one config.js points the
// site at. Free vision is Victorian racing and the stream is Australia-only, both
// checked against whoever is viewing this page, not against the box that built it.
// The pop-out stays in the dock header for a bigger screen.
const WATCH_LIVE="https://www.racing.com/live-vision.aspx?th=true";
window.watchLive=()=>{
  const b=$("vdb"), d=$("vdock"); if(!b||!d) return;
  killHls();
  $("vdt").innerHTML='racing.com live vision &nbsp;\u00b7&nbsp; '+
    `<a href="${WATCH_LIVE}" target="_blank" rel="noopener">pop out &#8599;</a>`;
  b.innerHTML=`<iframe src="${WATCH_LIVE}" allowfullscreen
                 allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  d.classList.add('wide');
  d.hidden=false;
};

// ---- Sky Thoroughbred Central, straight off the HLS ------------------------
// Racing NSW publish this channel on their own homepage as a plain JW Player
// with an unauthenticated Akamai URL: no login, no token, no EXT-X-KEY. Five
// bitrates to 1280x720, 3-second segments. It is the channel feed, thoroughbreds
// nationally -- whatever is jumping next -- not the vision for the meeting on
// screen, which is why its button does not wait for a meeting to be picked.
const SKY_STC="https://skylivernsw.akamaized.net/hls/live/2036965/stc/index.m3u8";
const HLSJS="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.6.15/hls.min.js";
const HLSJS_SRI="sha512-CSVqc4a7tn+tizDNt+eDoVn2fXYAwMDpCLrwGlWrOktNfZQ9gp4dKKScElMeRlrIifhliXs0a06BLaUgmMlCUw==";
let _hls=null;

// 150 KB, fetched the first time live vision is asked for and never on a plain
// page load. Safari plays HLS natively and skips this entirely.
function loadHls(){
  if(window.Hls) return Promise.resolve();
  if(!loadHls._p) loadHls._p=new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src=HLSJS; el.integrity=HLSJS_SRI; el.crossOrigin="anonymous";
    el.onload=res; el.onerror=()=>{ loadHls._p=null; rej(new Error('hls.js did not load')); };
    document.head.appendChild(el);
  });
  return loadHls._p;
}
function killHls(){ if(_hls){ try{ _hls.destroy(); }catch(e){} _hls=null; } }

window.skyLive=async ()=>{
  const b=$("vdb"), d=$("vdock"); if(!b||!d) return;
  killHls();
  $("vdt").innerHTML='Sky Thoroughbred Central &nbsp;\u00b7&nbsp; live &nbsp;\u00b7&nbsp; '+
    '<a href="#" onclick="watchLive();return false;">racing.com instead</a>';
  b.innerHTML='<video id="skyv" controls autoplay playsinline></video>';
  d.classList.add('wide'); d.hidden=false;
  const v=document.getElementById("skyv");
  if(v.canPlayType('application/vnd.apple.mpegurl')){ v.src=SKY_STC; return; }
  try{ await loadHls(); }
  catch(e){ b.innerHTML='<p class="vmsg">Live vision needs hls.js and it did not load. '+
            '<a href="'+SKY_STC+'" target="_blank" rel="noopener">Open the stream</a></p>'; return; }
  if(!document.getElementById("skyv")) return;           // closed while the script loaded
  _hls=new Hls({liveDurationInfinity:true});
  _hls.loadSource(SKY_STC);
  _hls.attachMedia(v);
  _hls.on(Hls.Events.ERROR,(_e,data)=>{
    if(!data.fatal) return;                              // hls.js retries these itself
    if(data.type===Hls.ErrorTypes.NETWORK_ERROR) _hls.startLoad();
    else if(data.type===Hls.ErrorTypes.MEDIA_ERROR) _hls.recoverMediaError();
    else { killHls(); b.innerHTML='<p class="vmsg">The Sky feed dropped out. Close and try again.</p>'; }
  });
};

// ---- status strip: reads status.json beside the page, polls every 60 s ----
(function(){
  const el=$("trs"); if(!el) return;
  let seen=null, pageStamp=null;   // pageStamp = 'Fri 04 Sep 23:21' from the injected banner
  const asDate=s=>{if(!s) return null; const d=new Date(s.length<=19?s+(s.includes('T')?'':'T00:00:00'):s); return isNaN(d)?null:d;};
  const hm=d=>d?d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:false}):'—';
  const wd=d=>d?d.toLocaleDateString('en-AU',{weekday:'short'}):'';
  const ago=d=>{if(!d) return ''; const m=Math.round((Date.now()-d)/60000);
    return m<1?'just now':m<60?`${m}m ago`:m<1440?`${Math.floor(m/60)}h ${m%60}m ago`:`${Math.floor(m/1440)}d ago`;};
  async function tick(){
    let j;
    try{const r=await fetch('status.json',{cache:'no-store'}); if(!r.ok) throw 0; j=await r.json();}
    catch(e){ return; }                                   // leave the injected banner as-is
    const old=document.getElementById('tr-updated');
    if(old){ pageStamp=(old.querySelector('b')||{}).textContent||null;
      if(old.nextElementSibling&&old.nextElementSibling.style.height) old.nextElementSibling.remove(); old.remove(); }
    const failed=j.status&&j.status!=='ok';
    const fin=asDate(j.finished||j.started), ext=asDate(j.extract);
    const rs=j.rider_share, prelim=!!j.preliminary||(rs!=null&&rs<0.6);
    const state=failed?'fail':(prelim?'prelim':'ok');
    const sameDay=fin&&new Date().toDateString()===fin.toDateString();
    const stamp=fin?`${wd(fin)} ${String(fin.getDate()).padStart(2,'0')} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][fin.getMonth()]} ${hm(fin)}`:null;
    let h=`<span class="dot"></span>
      <span class="t">${failed?'Last run <b>failed</b>':'Rated'} <b>${sameDay?'':wd(fin)+' '}${hm(fin)}</b> <span class="ago">${ago(fin)}</span>${j.reason?` · <span class="why">${j.reason}</span>`:''}</span>`;
    if(prelim&&!failed) h+=`<span class="tag" title="rider share below 60% — connections are unreliable until riders are declared">preliminary</span>`;
    if(failed) h+=`<span class="tag" title="${(j.error||'').replace(/"/g,'&quot;')}">${/publish/i.test(j.error||'')?'publish failed':'rating failed'}</span>`;
    const m=[];
    if(j.acceptors!=null) m.push(`<span><i>${j.acceptors}</i> acceptors</span>`);
    if(rs!=null) m.push(`<span>riders <i class="${rs<0.6?'bad':(rs<0.9?'warn':'')}">${Math.round(rs*100)}%</i></span>`);
    if(j.scratchings!=null) m.push(`<span><i>${j.scratchings}</i> scr</span>`);
    if(ext) m.push(`<span>extract <i>${hm(ext)}</i></span>`);
    m.push(`<span>TAB <i class="tab-age">—</i></span>`);
    h+=`<span class="m">${m.join('')}</span>`;
    // newer rating than this page?  (status.json changed since first poll, or page banner stamp differs from status)
    const stale=!failed&&((seen&&j.finished&&j.finished!==seen)||(pageStamp&&stamp&&pageStamp!==stamp&&fin>new Date(pageStamp.replace(/^[A-Za-z]+ /,'')+' '+fin.getFullYear())));
    if(stale) h+=`<button class="reload" onclick="location.reload()">Re-rated ${hm(fin)} — reload</button>`;
    if(!seen) seen=j.finished||null;
    el.className='trs '+state; el.innerHTML=h; el.hidden=false;
    refreshTabAge();
    document.body.style.paddingBottom=(el.offsetHeight+6)+'px';
  }
  function readBanner(){
    const old=document.getElementById('tr-updated'); if(!old) return;
    pageStamp=(old.querySelector('b')||{}).textContent||null;   // read for the stale check in tick()
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>{readBanner();tick();});
  else {readBanner();tick();}
  setInterval(tick,60000); window._trsTick=tick;
})();
</script><div id="tr-updated" style="position:fixed;left:0;right:0;bottom:0;z-index:9999;font:12.5px/1.4 system-ui,sans-serif;padding:6px 12px;background:#111;color:#ddd;border-top:2px solid #2e7d32;text-align:center">Rated <b>Tue 15 Sep 05:12</b> AEST &middot; manual rerun after 03:00 harvest guard</div><div style="height:34px"></div></body></html>
