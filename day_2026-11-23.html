<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- the home-screen tile and the browser tab: SPM, Simon's Punting Model.  Built and pushed
     by dash_icon.py; without the manifest Chrome can only make a badged bookmark shortcut. -->
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#006DA6">
<meta name="application-name" content="SPM">
<meta name="apple-mobile-web-app-title" content="SPM">
<title>SPM — week</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  /* SPM palette, blue (Simon, 3 Nov 2026: "more blue ... blue, light blue, grey ... no pink or purple", from the
     Racing Victoria style guide: RV blue #006DA6, process blue #0085CA, cool grey #6D6E71). The token names keep
     their old colour words so nothing else moves: --green is the brand blue, --brass the deep blue-grey accent,
     --warm the cool grey fill. Red stays for negatives only. Before 3 Nov: dark green #005C42 / brown #592414. */
  --green:#006DA6; --green2:#0085CA; --brown:#2E5570; --warm:#D9DCE0; --brick:#A52210;
  --sblue:#9CD3F0; --dblue:#003F6B; --syellow:#FCE070; --teal:#4FA3D1; --porange:#8FA3B5;
  --keyrgb:0,133,202;   /* the rating column's tint, rgba(var(--keyrgb),a) */
  --ink:#F2F4F6; --panel:#FFFFFF; --panel2:#E4E7EA; --rule:#D0D4D8;
  --text:#1A2733; --dim:#4E5A66; --faint:#868C92;
  --hk:#4E5A66; --hkbg:#EEF1F4;
  --pos:#006DA6; --neg:#A52210; --amber:#B8741A; --brass:#2E5570; --flat:#D9DCE0; --cond:#003F6B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:Gotham,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.an{font-family:"Archivo Narrow",Arial Narrow,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1480px;margin:0 auto;padding:18px 20px 60px}
header{border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:10px}
.meet{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:34px;letter-spacing:-.01em;margin:0;line-height:1}
.brand{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:21px;line-height:1;color:var(--text);align-self:baseline;padding-right:11px;border-right:1px solid var(--rule);white-space:nowrap}
.brand .d{color:var(--brass)}
.date{color:var(--dim);font-size:14px}
.conds{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;align-self:center}
/* the top bar condensed (Simon, 16 Nov 2026): short labels, the four live channels one joined group */
header .wlive{padding:4px 8px;font-size:12px}
/* the channels as their own logos on white chips (Simon, 16 Nov 2026); the files are dash_assets/vision/, from skyracing.com.au and racing.com */
.wgrp{display:inline-flex;background:#fff;border-radius:3px}
header .wgrp .wlive{background:#fff;border-color:#fff;border-right-color:#d6dde3;padding:3px 8px}
header .wgrp .wlive:last-child{border-right-color:#fff}
header .wgrp .wlive:hover{background:#e6f1f8}
.wgrp img.vlg{display:block;height:18px;width:auto} .wgrp img.vlg.tc{height:22px;margin:-2px 0} .wgrp img.vlg.rdc{height:12px} .wgrp .wlive{border-radius:0;margin-left:0} .wgrp .wlive:first-child{border-radius:3px 0 0 3px;margin-left:0} .wgrp .wlive:last-child{border-radius:0 3px 3px 0}

.daysrow{display:flex;align-items:stretch;border-bottom:1px solid var(--rule);margin-bottom:14px}
.days{display:flex;gap:0;overflow-x:auto;flex:0 1 auto;min-width:0}
.days button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:var(--dim);padding:8px 14px 9px;cursor:pointer;font-family:inherit;text-align:left;white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.days button .d{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:17px;color:inherit}
.days button .s{font-size:11px;color:var(--faint)}
.days button:hover{color:var(--text)}
.days button[aria-selected=true]{color:var(--text);border-bottom-color:var(--brass)}
.days button[aria-selected=true] .s{color:var(--dim)}
.days button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
/* earlier days (Simon, 4 Nov 2026): a date picker on the right of the days bar opens that day's page, day_<date>.html, the
   page as it was last rated that day with the day's closing prices and results frozen beside it (dash_history.py) */
.hist{display:flex;align-items:center;gap:7px;padding:4px 14px 4px 10px;flex:0 0 auto;white-space:nowrap;border-left:1px solid var(--rule);align-self:center}
.hist label{color:var(--dim);font-size:11.5px}
.hist input{font-family:inherit;font-size:12.5px;color:var(--text);background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:3px 6px}
.hist .hmsg{color:var(--brick);font-size:11.5px}
.hist a{color:var(--green);font-size:12.5px;font-weight:600;text-decoration:none}.hist a:hover{text-decoration:underline}
.pastbar{background:#FFF4D6;border:1px solid #E8C96A;border-radius:4px;padding:8px 12px;margin:0 0 12px;font-size:13px;color:#5a4a1a;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.pastbar b{font-weight:700}.pastbar a{color:var(--green);font-weight:600;text-decoration:none;margin-left:auto}.pastbar a:hover{text-decoration:underline}
/* find a horse (Simon, 4 Nov 2026): the search box in the header reads hidx/<letter>.json as the name is typed and opens
   h/<id>.json, the same form guide as the runner's panel, built for every horse in the archive (horsecard.py) */
.hs{position:relative;flex:0 1 260px;min-width:150px;margin-left:auto;align-self:center;padding:4px 0}
.hs input{width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:5px 9px}
.hs input::placeholder{color:var(--faint)}
.hsres{position:absolute;top:calc(100% + 3px);right:0;width:max(100%,340px);z-index:65;background:var(--panel);border:1px solid var(--rule);border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-height:min(60vh,420px);overflow:auto;min-width:260px}
.hsres button{display:block;width:100%;background:none;border:0;border-top:1px solid var(--panel2);color:var(--text);font-family:inherit;font-size:13px;text-align:left;padding:6px 10px;cursor:pointer}
.hsres button:first-child{border-top:0}.hsres button:hover,.hsres button.on{background:var(--warm)}
.hsres button b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hsres button .s{display:block;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsres .hsmsg{color:var(--faint);font-size:12.5px;padding:8px 10px}
.hpan{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45);overflow:auto;padding:28px 12px 60px}
.hpan .hpi{background:var(--bg,#fff);max-width:1400px;margin:0 auto;border-radius:6px;padding:12px 14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.hpan .hph{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:8px}
.hpan .hph h2{font-family:Gotham,"Archivo Narrow",sans-serif;font-size:22px;font-weight:600;margin:0}
.hpan .hph .m{color:var(--dim);font-size:12.5px}.hpan .hph .l20{font-family:"Archivo Narrow",sans-serif;letter-spacing:.08em;font-size:13px}
.hpan .hph .l20 b{color:var(--green)}.hpan .hph .l20 i{color:var(--faint);font-style:normal}
.hpan .hpx{margin-left:auto;background:none;border:0;color:var(--faint);cursor:pointer;font-family:inherit;font-size:18px;line-height:1;padding:2px 6px}.hpan .hpx:hover{color:var(--text)}
.hpan .fcp{width:auto;min-width:0}
@media(max-width:720px){.daysrow{flex-wrap:wrap}.hs{flex:1 1 100%;order:3;padding:6px 0 8px}.hpan{padding:10px 6px 60px}.hpan .hpi{padding:10px 8px 14px}.hist{padding:4px 8px}.hist label{display:none}}

.mtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.ntgbar{display:flex;align-items:stretch;gap:6px;overflow-x:auto;margin:-6px 0 14px;padding-bottom:2px}
.ntgbar[hidden]{display:none}
.ntgbar .nl{flex:0 0 auto;align-self:center;color:var(--dim);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-right:2px;white-space:nowrap}
.ntgbar button{flex:0 0 auto;background:var(--panel);border:1px solid var(--rule);border-radius:4px;color:var(--text);padding:4px 10px;cursor:pointer;
  font-family:inherit;font-size:12.5px;line-height:1.25;display:flex;flex-direction:column;align-items:flex-start;gap:1px;white-space:nowrap}
.ntgbar button:hover{border-color:var(--green)}
.ntgbar button .t{font-weight:600} .ntgbar button .s{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
.ntgbar button .cd.soon{color:var(--brick);font-weight:600}
.ntgbar button[aria-selected="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.ntgbar button .pkn{color:var(--cond);font-style:normal;margin-left:3px}
.mtabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--rule);border-radius:3px;color:var(--dim);padding:8px 13px;cursor:pointer;white-space:nowrap;text-align:left;font-family:inherit;font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:118px}
.mtabs button:hover{border-color:var(--dim);color:var(--text)}
.mtabs button[aria-selected=true]{border-color:var(--brass);background:var(--panel2);color:var(--text)}
.mtabs button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.mtabs .tk{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:14.5px}
.mtabs .sb{color:var(--faint);font-size:10.5px;display:flex;gap:7px}
.mtabs .sb .w{color:var(--cond)}

nav{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--rule)}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:8px 13px 7px;cursor:pointer;font-family:"Archivo Narrow",sans-serif;font-size:15px;font-weight:600;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
nav button .rt{font-size:11.5px;font-weight:500;color:var(--faint)}
nav button[aria-selected=true] .rt{color:var(--brass)}
nav button .cd{font-size:11px;font-weight:600;color:var(--pos);font-variant-numeric:tabular-nums}
nav button .cd.soon{color:var(--brass)}
nav button .rdc{font-size:11px;font-weight:500;color:var(--dim)} nav button .rdc b{color:var(--text);font-weight:600}   /* trip and class on each tab (16 Nov 2026) */
nav button .cd.gone{color:var(--faint);font-weight:500}
nav button:hover{color:var(--text)}
nav button[aria-selected=true]{color:var(--text);border-bottom-color:var(--brass)}
nav button.sum{color:var(--brass)}
nav button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}

.mnote{margin:0 0 14px;padding:9px 13px;border-left:3px solid var(--cond);background:var(--panel);color:var(--dim);font-size:12.5px;line-height:1.5}
.surf{background:var(--panel2);color:var(--text);border:1px solid var(--brass);border-radius:3px;padding:2px 6px;font:inherit;font-size:12.5px}
.surfall{background:none;color:var(--dim);border:1px solid var(--rule);border-radius:3px;padding:2px 8px;font:inherit;font-size:12px;cursor:pointer;margin-left:4px}
.surfall:hover{color:var(--text);border-color:var(--brass)}
.rerated{color:var(--cond);font-size:12px;margin-left:6px}
.mgo{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:-8px 0 14px;font-size:12.5px}
.mgo label{display:flex;align-items:center;gap:6px}.mgo .lbl{color:var(--faint);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.mwx{color:var(--dim);gap:2px 10px}.mgo+.mwx{margin-top:-10px}.mwx b{color:var(--text);font-weight:600}.mwx .src{color:var(--faint);font-size:11px}
.rhead .meta .wxr{white-space:nowrap;cursor:pointer;text-decoration:underline dotted var(--faint);text-underline-offset:3px}
.mwl{color:var(--dim);gap:2px 10px;cursor:default}.mwl b{color:var(--text);font-weight:600}.mwl .src{color:var(--faint);font-size:11px}
.mwl.hot{background:rgba(var(--keyrgb),.10);border-radius:4px;padding:4px 6px}.mwl .gauge{display:inline-block;width:110px;height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--rule);position:relative;vertical-align:middle}
.mwl .gauge i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--green);margin-left:-6px}.mwl .gauge u{position:absolute;left:50%;top:-3px;width:1px;height:12px;background:var(--rule)}
.sbar,.psb{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.sbar .sbt,.psb .sbt{position:relative;display:inline-block;flex:0 0 92px;width:92px;height:8px;border-radius:4px;background:var(--rule)}
.sbar .sbb,.psb .sbb{position:absolute;top:0;bottom:0;border-radius:4px;opacity:.32}
.sbar .sbd,.psb .sbd{position:absolute;top:-3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;box-shadow:0 0 0 2px var(--panel)}
.sbar .sbl,.psb .sbl{font-size:11.5px;font-weight:600;min-width:52px}
.psb{display:none}
@media(max-width:720px){.rtab th.sth,.rtab td.stcl{display:none} .rtab:not(.hk) .psb{display:flex;margin-top:6px} .psb .sbt{width:72px;flex-basis:72px} .psb .sbl{min-width:0;font-size:11px}}
.hsl{color:inherit;text-decoration:underline dotted var(--faint);text-underline-offset:3px;cursor:pointer}.hsl:hover{color:var(--green)}.hsl.hsno{text-decoration:none;cursor:default;color:inherit}
.wxc{background:var(--panel);border:1px solid var(--rule);border-radius:3px;color:var(--green);font:inherit;font-size:12.5px;font-weight:500;padding:2px 9px;cursor:pointer;margin-left:4px}
.wxc:hover{border-color:var(--green)} .wxc span{color:var(--faint);font-size:11px}
.wxc.hot{background:rgba(var(--keyrgb),.14);border-color:var(--brass);color:var(--text)}
.mgo+.mwl{margin-top:-10px}
.mwx{cursor:pointer;border-radius:4px}.mwx:hover,.mwx:focus-visible{background:var(--panel2);outline:none}.mwx .more{color:var(--green);font-weight:600;font-size:12px}
dialog.wxpop{border:0;border-radius:8px;padding:0;width:min(720px,96vw);max-height:92vh;overflow:hidden;background:var(--panel);color:var(--text);box-shadow:0 12px 40px rgba(0,0,0,.35)}
dialog.wxpop::backdrop{background:rgba(22,33,28,.45)}
.wxpop .wxh{display:flex;align-items:baseline;gap:10px;padding:14px 16px 6px;border-bottom:1px solid var(--rule)}
.wxpop .wxh h3{margin:0;font-size:18px;text-transform:uppercase;letter-spacing:.03em;color:var(--green)}
.wxpop .wxh .sub{color:var(--faint);font-size:11.5px;flex:1}
.wxpop .wxx{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--dim);padding:0 4px}
.wxpop .wxb{padding:10px 16px 14px;overflow:auto;max-height:calc(92vh - 52px)}
.wxpop table{border-collapse:collapse;width:100%;font-size:12.5px;margin-bottom:12px}
.wxpop th{color:var(--faint);font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:3px 6px;border-bottom:1px solid var(--rule)}
.wxpop td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel2);white-space:nowrap}
.wxpop th:first-child,.wxpop td:first-child,.wxpop th:nth-child(2),.wxpop td:nth-child(2){text-align:left}
.wxpop tr.nx td{background:rgba(var(--keyrgb),.14);font-weight:600}.wxpop tr.gone td{color:var(--faint)}
.wxpop .arr{display:inline-block;width:12px;text-align:center;color:var(--green)}
.wxpop .hd{color:var(--neg)}.wxpop .tl{color:var(--pos)}
.wxpop .seg{display:flex;gap:4px;margin:4px 0 6px;flex-wrap:wrap}
.wxpop .seg button{border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text)}
.wxpop .seg button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.wxpop iframe{width:100%;height:min(420px,55vh);border:0;border-radius:6px;background:var(--panel2)}
.wxpop .lnk{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:8px}.wxpop .lnk a{color:var(--green)}
.wxpop .note{color:var(--faint);font-size:11px;margin-top:8px}
@media(max-width:560px){.wxpop .wxh{padding:12px 12px 6px}.wxpop .wxb{padding:8px 10px 12px}.wxpop td,.wxpop th{padding:3px 3px}.wxpop .c-st{display:none}}
.mgo .rerated{margin-left:0}.mgo .surfall{margin-left:0}.mgo .gonote{color:var(--faint);font-size:11.5px;flex-basis:100%}
.rnote{margin:0 0 14px;padding:10px 13px;border-left:3px solid var(--brass);background:var(--panel);color:var(--text);font-size:13px;line-height:1.5}
.rnote b{color:var(--brass);font-family:"Archivo Narrow",sans-serif;font-size:14px}
/* item 47, the head-to-head cue: the market's top two have met each other before. Display only --
   gating the RATING to these races was tested 17 Sep and is worse on all five tests. */
.h2hc{margin:0 0 14px;padding:10px 13px;border-left:3px solid var(--cond);background:var(--panel);color:var(--text);font-size:13px;line-height:1.5}
.h2hc b.lbl{color:var(--cond);font-family:"Archivo Narrow",sans-serif;font-size:14px}
.h2hc .beat{font-weight:600}
.h2hc .upset{color:var(--neg);font-weight:600}
.h2hc .swing{color:var(--brass)}   /* not .sw: that is the legend's 10px swatch, and the swing wrapped one word a line inside it (20 Sep 2026) */
.h2hc .fv{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:400;vertical-align:.35em;margin-left:2px}
.h2hc .qual{color:var(--dim)}
/* the quaddie selector (19 Oct 2026): on each leg's race page, one line for each quaddie it is in, opening to
   the ticket; green edge for a bet, grey for a sit-out */
.quads{margin:0 0 14px}
.qapx{margin:0 0 10px}.qaps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.qap{border:1px solid var(--line,#d9dde3);border-radius:6px;padding:3px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qap.in{border-color:#006DA6;background:rgba(0,109,166,.08)}.qap small{color:#006DA6}
.quad{padding:7px 13px;border-left:3px solid var(--pos);background:var(--panel);color:var(--text);font-size:13px;line-height:1.5}
.quad+.quad{margin-top:4px}
.quad.no{border-left-color:var(--flat)}
.quad summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.quad summary::-webkit-details-marker{display:none}
.quad summary::before{content:"\25B8";color:var(--faint);font-size:11px;width:9px}
.quad[open] summary::before{content:"\25BE"}
.quad b.lbl{font-family:"Archivo Narrow",sans-serif;font-size:14px}
.quad .vd{margin-left:auto;font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em}   /* the verdict at the bar's right-hand end (Simon) */
.quad .vd.y{color:var(--pos)} .quad .vd.n{color:var(--faint)}
.quad table{width:auto;min-width:0;border-collapse:collapse;margin:6px 0 4px 19px;font-variant-numeric:tabular-nums}
.quad tr,.quad td{border:0} .quad td{padding:1px 12px 1px 0;vertical-align:top}
.quad td.lg{color:var(--dim);white-space:nowrap} .quad td.cv{color:var(--faint);white-space:nowrap}
.quad .myq{margin:9px 0 2px;padding-top:8px;border-top:1px solid var(--rule)}   /* My ticket, from the stars (6 Nov 2026) */
.quad .myq .mh{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:14px;margin-left:19px}
/* the model's own legs, named as SPM's (Simon, 7 Nov 2026: "make it clear that the top quaddie selections are 'SPM Auto Generated Selections'") */
.quad .auh{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:14px;margin:2px 0 2px 19px}
.quad .auh span{font-weight:400;color:var(--faint);font-size:12px;margin-left:7px}
.quad .myq .mh span{font-weight:400;color:var(--faint);font-size:12px;margin-left:7px}
.quad .myq td.need{color:var(--faint);font-style:italic} .quad .myq .scrn{color:var(--neg)}
.quad .myq .ft{margin-left:19px}
.quad .mys{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:4px 0 4px 19px}

.quad .mys input{width:68px;font:inherit;padding:4px 6px;border:1px solid var(--rule);border-radius:4px;background:var(--panel);color:var(--text)}

/* ---- SPM restyle, 23 Oct 2026: Gotham and the green palette ---- */

th.key,th.key2{color:var(--green)}
td.key,th.key,td.key2,th.key2{background:rgba(var(--keyrgb),.12)}

/* ---- second pass, 23 Oct 2026 (Simon: "do all of those things") ---- */
/* 1. the masthead: a dark green band, edge to edge, white type, the live buttons outlined in white */
header{background:var(--green);color:#fff;border-bottom:0;margin:-18px 0 12px;padding:14px 0 13px;
  box-shadow:0 0 0 100vmax var(--green);clip-path:inset(0 -100vmax)}

   into purple and a touch of pink at the right, edge to edge: a layer exactly the screen's width behind the centred header */
header{box-shadow:none;position:relative;z-index:0}
header::before{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 50vw);right:calc(50% - 50vw);z-index:-1;
  background:linear-gradient(90deg,#006DA6 0%,#006DA6 40%,#4A47A3 75%,#9B3D9E 100%)}

.cqm{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;font-size:10.5px;font-weight:600;line-height:15px;color:var(--green);border:1px solid var(--green);vertical-align:1px;cursor:help}
.dbody.dcq{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:10px 12px 8px}
.dbody.dcq .cqh{margin:0 0 8px;color:var(--dim);font-size:12.5px}.dbody.dcq .cqh b{color:var(--text)}
.dbody.dcq table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.dbody.dcq th{font-size:10.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:right;padding:4px 8px;white-space:nowrap}
.dbody.dcq td{padding:6px 8px;border-top:1px solid var(--rule);text-align:right;white-space:nowrap}
.dbody.dcq th:first-child,.dbody.dcq td:first-child{text-align:left}
.dbody.dcq tr.cqn td{color:var(--faint)}
.dbody.dcq .cqs span{display:inline-block;margin-left:4px;padding:0 4px;border-radius:3px;background:var(--rule);color:var(--text)}
.dbody.dcq .cqs span.at{background:var(--green);color:#fff}
.dbody.dcq .cqf{margin:8px 0 0;color:var(--faint);font-size:11.5px}
.dbody.dwc{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:10px 12px 8px}
.wcmp svg{display:block;width:100%;height:auto}
.wcmp path.wl{fill:none;stroke-width:1.6;opacity:.85}
.wcmp path.wl.dim,.wcmp path.wf.dim,.wcmp circle.wfp.dim{opacity:.13}
.wcmp path.wl.on{stroke-width:2.8;opacity:1}
.wcmp path.wf{fill:none;stroke-width:1.6;stroke-dasharray:4 4;opacity:.8}
.wcmp path.wf.dim{opacity:.16}
.wcmp path.hitl{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.wcmp circle.wd{stroke:none}
.wcmp circle.wfp{fill:var(--panel);stroke-width:1.8;stroke-dasharray:none}
.wcmp text.wcn{font-size:11.5px;cursor:pointer;fill:var(--text)}
.wcmp text.wcn.dim{opacity:.35}
.wcmp text.wcn.on{font-weight:700}
.wcmp line.wlead{stroke:var(--rule);stroke-width:1}
.wcmp rect.wbz{fill:var(--green);opacity:.07}
.wcmp text.wbz{font-size:11px;fill:var(--green);font-weight:600}
.wcmp .wch{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--dim);margin-top:6px}
.wcmp .wch button{font:inherit;font-size:12px;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:0 9px;cursor:pointer;color:var(--text)}
.dbody{margin:-4px 0 14px}
.dbody .smap{margin:0;border-radius:4px}
.dbody .smh{display:none}
.dbody .smbody{padding:12px}
.dmap .spr,.drsp .spl,.drsp .smnone{display:none}
.dmap .spwrap,.drsp .spwrap{grid-template-columns:minmax(0,1fr);border:0}
.dmap .spwrap>div+div,.drsp .spwrap>div+div{border-left:0}
.dbody .quad.qb{border:1px solid var(--rule);border-radius:4px;padding:8px 12px}
.dbody .quad.qb table,.dbody .quad.qb .ft{margin-left:0}
.dri .dls{display:none}
/* labels only (Simon, 16 Nov 2026): the one-line read beside each label is gone, the chip sized to its label; a quaddie to bet keeps
   its green edge. The summary text stays in the button's markup for the phone rules and the hover. */
.dri{flex:0 0 auto} .dri .ds{display:none}
/* phone: still side by side, each just its short name; the verdict shows as the green edge (Simon, 23 Oct 2026) */
@media(max-width:560px){.drill{flex-wrap:nowrap;gap:5px}.dri{flex:1 1 0;padding:8px 6px;justify-content:center;font-size:12.5px}
  .dri .dl,.dri .ds,.dri .dc{display:none}.dri .dls{display:inline;font-weight:500;color:var(--green);white-space:nowrap}
  .dri.n .dls{color:var(--dim)}}
/* your picks (Simon, 6 Nov 2026): a star on every runner and the picked row edged blue */
.pk{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin:-4px -4px -4px -6px;padding:0;border:0;background:none;
  cursor:pointer;color:var(--faint);border-radius:50%}
.pk svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.pk:hover{color:var(--green)} .pk:focus-visible{outline:2px solid var(--green);outline-offset:0}
.pk.on{color:var(--green)} .pk.on svg{fill:currentColor}
tbody tr.run.pkd td:first-child{box-shadow:inset 3px 0 0 var(--green)}
tbody tr.run.pkd td{background:rgba(var(--keyrgb),.06)}
.ppk{display:none}
/* the star to the left of the runner number (Simon, 16 Nov 2026), on the wide table; under 720 px the number rides on the silk and
   the star keeps its place by the name (or under the weight on a phone) */
.dpk{display:none}
@media(min-width:721px){.rtab:not(.hk) .dpk{display:inline-flex;margin:-4px 4px -4px -6px;vertical-align:middle} .rtab:not(.hk) .horse .pk{display:none} .rtab:not(.hk) td.tab{white-space:nowrap}}
nav button .pkn,.daytab .pkn{color:var(--green);font-style:normal;font-size:10px;margin-left:3px;vertical-align:1px}
@media(max-width:420px){.rtab:not(.hk) .horse .pk{display:none} .rtab:not(.hk) .ppk{display:flex;margin:6px auto 0}}
/* phone trim (Simon, 17 Nov 2026, "focussed on the mobile view"): no day title or long date in the header, $PM with the vision
   beside it and the switches on a row below; the vision logos as separate chips; the date picker beside the days, which lose
   their date number; Next to Go and the day's Best lose their second line; the status strip keeps Rated and TAB only */
.hbrk{display:none}
@media(max-width:720px){
  header{padding:9px 0 9px}
  header .meet{align-items:center;gap:7px 10px}
  header h1,header .date{display:none}
  header .conds{display:contents}
  header .hbrk{display:block;flex:0 0 100%;height:0}
  header .wgrp{background:none;gap:5px;flex-wrap:wrap}
  header .wgrp .wlive,header .wgrp .wlive:first-child,header .wgrp .wlive:last-child{background:#fff;border-color:#fff;border-radius:3px}
  .days{flex:1 1 0}
  .days button{padding:8px 12px 9px}
  .days button .dn{display:none}
  .hist{border-left:0;padding:4px 0 4px 6px}
  .mtabs button.ntg,.mtabs button.today{min-width:0;justify-content:center}
  .mtabs button.ntg .sb,.mtabs button.today .sb{display:none}
  .trs .m>span:not(.tg){display:none}
}
@media(max-width:400px){
  header .meet{gap:7px 7px} header .brand{padding-right:7px}
  header .wgrp{gap:4px} header .wgrp .wlive{padding:3px 5px}
  header .wgrp img.vlg{height:15px} header .wgrp img.vlg.tc{height:19px} header .wgrp img.vlg.rdc{height:10px}
}
.mtabs button.hk{border-color:var(--hk);background:var(--hkbg)} .mtabs button.hk .tk{color:var(--hk)}
.mtabs button.hk[aria-selected=true]{box-shadow:inset 0 0 0 1px var(--hk)}
.mtabs button.done{opacity:.6}
</style></head>

// 5 Nov 2026; the median BOOK gets there at 10-15 min, but every runner must have a back offer); the last such snapshot is kept

const bfMid=x=>(x.bfb>1&&x.bfl>1&&x.bfl<x.bfb*1.25)?(x.bfb+x.bfl)/2:x.bfb;

      <td class="r${top&&top.no===x.no?' b':''}">${x.plead!=null?pc(x.plead):'–'}</td><td class="r sx">${pc(x._front)}</td><td class="r sx">${pc(x._fence)}</td><td class="r sx${x._wide>=.25?' g':''}">${pc(x._wide)}</td><td class="r sx">${x._worth!=null?x._worth.toFixed(2)+'×':'–'}</td>`
      :`<td class="g1l dim">not mapped</td><td class="sx"></td><td></td><td class="sx"></td><td class="sx"></td><td class="sx"></td><td class="sx"></td>`;

      :`<td class="g2l dim sx" colspan="3"></td><td class="dim sx" colspan="3"></td><td class="dim">–</td>`;
    h+='</tr>'; });

// the panel body; left = the new map where the settle map ran, else the caller's old columns (leftHtml)
function spPanel(r,top,leftHtml,rival){
  const sc=r.runners.filter(x=>Array.isArray(x.sc)&&x.sc.length===24), key=stKey(r).replace(/'/g,"\\'");

    sc.forEach((x,i)=>{ const t=x.sc.reduce((p,q)=>p+q,0)||1, sum=f=>x.sc.reduce((p,v,j)=>p+(f(j)?v:0),0)/t;
      let k=0; x.sc.forEach((v,j)=>{ if(v>x.sc[k]) k=j; });
      x._k=k; x._fence=sum(j=>j%4===0); x._front=sum(j=>Math.floor(j/4)===0); x._wide=sum(j=>j%4===3);
      x._worth=rt?x.sc.reduce((p,v,j)=>p+v*rt[j],0)/t:null; alloc.set(x.no,a[i]); });

  const tb=(r.umap&&r.umap.tempo)||(sc.find(x=>x.stb)||{}).stb||null;   // his tempo when he set one (deploy_usermap4)
  const um=r.umap?`<div class="spu"><b>Your map</b> · saved ${new Date(r.umap.saved).toLocaleString('en-AU',{weekday:'short',hour:'numeric',minute:'2-digit'})} · race confidence ${r.umap.rconf}%${r.umap.tempo?` · your tempo: <b>${r.umap.tempo}</b> (the map's: ${r.umap.tempo_fc&&r.umap.tempo_fc!=='nan'?r.umap.tempo_fc:'none'})`:''} · brown edge: moved by you · the ratings and prices include it · <a href="settle.html">adjust</a></div>`:'';
  let h=`<div class="spwrap${pr?'':' one'}"><div class="spl"><div class="sph">Speed map${r.umap?'<span class="uadj">Adjusted</span>':''}${tb?`<span class="spt">${tb} tempo</span>`:''}</div>${map}${um}</div>`;
  if(pr) h+=`<div class="spr"><div class="sph">Race speed profile</div>${spProfSvg(r,pr,key,sel)}</div>`;

    if(SPTAB) h+=spTable(r,alloc.size?sc:[],alloc,top,pr,key,sel);

  return h;
}

function speedMap(r){
  const on=r.runners.filter(x=>x.rspos!=null);
  if(on.length<3) return '';
  const off=r.runners.filter(x=>x.rspos==null);
  const sl=spLead(r), rival=null;
  if(sl) sl.ldr._lf=sl.front;                                   // the map leader's chance of settling in the first two lengths
  const top=sl?sl.ldr:on.reduce((m,x)=>(x.plead!=null&&(m===null||x.plead>m.plead))?x:m,null);
  const hi=on.filter(x=>(x.shape??0)>=0.3).sort((a,b)=>b.shape-a.shape).slice(0,2);
  const lo=on.filter(x=>(x.shape??0)<=-0.3).sort((a,b)=>a.shape-b.shape).slice(0,2);
  const nm=a=>a.map(x=>`${x.no} ${x.name}`).join(', ');

  // the one-line read that sits on the page
  const bits=[];
  if(r.umap) bits.push('<b>your map</b>');
  if(r.ncont) bits.push(`${r.ncont} want the lead`);
  if(sl?(sl.front>=0.3):(top&&top.plead>=0.25)) bits.push(`likely leader <b>${top.no} ${top.name}</b>`+
    (sl?` · ${(100*sl.front).toFixed(0)}% to settle in the first two lengths`:` ${(100*top.plead).toFixed(0)}%`));
  if(hi.length) bits.push(`helps <u>${nm(hi)}</u>`);
  if(lo.length) bits.push(`hurts <s>${nm(lo)}</s>`);
  const head=`<button class="smh" onclick="toggleMap()" aria-expanded="${smap}"><b>Speed map</b>`+
    `${r.ctx?`<span class="ctx">${r.ctx}</span>`:''}<span class="sub">${bits.join(' &nbsp;·&nbsp; ')}</span>`+
    `<span class="tog">${smap?'hide map':'show map'}</span></button>`;
  if(!smap) return `<div class="smap">${head}</div>`;
  if(r.runners.filter(x=>Array.isArray(x.sc)&&x.sc.length===24).length>=3) return `<div class="smap open">${head}<div class="smbody">${spPanel(r,top,'',rival)}
    <div class="smnone">${SMCTX[r.ctx]||''}</div>
    ${off.length?`<div class="smnone">Not mapped (no settling history): ${off.map(x=>`${x.no} ${x.name}`).join(', ')}</div>`:''}</div></div>`;


  const cols=SMB.map(()=>[]);
  on.forEach(x=>{ const i=SMB.findIndex(b=>x.rspos<b[0]); cols[i<0?4:i].push(x); });
  const grid=cols.map((c,i)=>{
    // Stacked on the gate, inside at the foot. Not on where the horse will
    // actually be running: a projection of width from the draw and the map
    // orders a field 0.95 to 0.99 like the gate, while realised width at the
    // turn orders only 0.43 like it (NOTE_2026-09-11_caught_wide_tracking 4.6).
    // The re-sorting is real and we cannot forecast it, so do not imply we can.
    c.sort((a,b)=>(a.bar??99)-(b.bar??99));
    const chips=c.map(x=>{
      const sh=x.shape??0;
      const cls=(Math.abs(sh)<0.3?'':(sh>0?'p':'g'))+((top&&top.no===x.no&&top.plead>=0.25)?' led':'');
      const pl=(x.plead!=null&&x.plead>=0.20)?`<em>${(100*x.plead).toFixed(0)}%</em>`:'';
      const tip=`${x.name} — maps ${x.rslab}, gate ${x.bar??'?'}`+
                (x.plead!=null?`, ${(100*x.plead).toFixed(0)}% to lead`:'')+
                `, shape ${sh>0?'+':'−'}${Math.abs(sh).toFixed(2)}`;
      return `<div class="smc ${cls}" title="${tip.replace(/"/g,'&quot;')}"><b>${x.no}</b><span>${x.name}</span><i>${x.bar??'?'}</i>${pl}</div>`;
    }).join('');
    return `<div class="smcol${c.length?'':' empty'}"><div class="hd">${SMB[i][1]}</div><div class="smstack">${chips}</div></div>`;
  }).join('');
  const sgn=a=>a.map(x=>`${x.name} ${x.shape>0?'+':'−'}${Math.abs(x.shape).toFixed(2)}`).join(', ');
  return `<div class="smap open">${head}<div class="smbody">
    ${spPanel(r,top,`<div class="smgrid"><div class="smoff">gate, inside at the foot</div>${grid}</div><div class="smrail"><em>rail</em></div>`)}
    <div class="smnone">${SMCTX[r.ctx]||''}${(hi.length||lo.length)?`${SMCTX[r.ctx]?' · ':''}shape helps ${hi.length?sgn(hi):'nobody by 0.3'}${lo.length?`, hurts ${sgn(lo)}`:''}`:''}</div>
    ${off.length?`<div class="smnone">Not mapped (no settling history): ${off.map(x=>`${x.no} ${x.name}`).join(', ')}</div>`:''}</div></div>`;
}

// ---- the settle picture (Simon, 29 Sep 2026) -----------------------------------
// x.sc: the settle map's 24 chances in per-mille, cell = depth row x 4 + lane (row 0 the lead band, lane 0 the fence).
// x.sr: the race's raw win rate for each spot at today's track, trip, rail, going and tempo, as a multiple of an even
// share of the field (the same for every runner); each spot is tinted red (below) through amber (about 1.0x) to green.
// Click a horse: the board shows that horse's own chance of each spot beside the rate, and what it adds up to.
// Only where the settle map ran (tracked meetings for now); anywhere else the speed-map columns above stay.
const STD=[['Lead','0-2 L'],['Handy','2-4 L'],['Midfield','4-6 L'],['','6-8 L'],['Back','8-10 L'],['','10 L +']];
const STL=['Fence','1 off','2 off','3+ wide'];
const STSEL={};                                        // race key -> the clicked horse's number
function stKey(r){ return (r.runners[0]||{}).name+'|'+r.no; }
window.stPick=(ev,key,no)=>{ ev.stopPropagation(); STSEL[key]=(STSEL[key]===no?null:no); draw(); };
function stTint(rate){                                 // red < amber (1.0x) < green, strongest at 0.5x and 2x
  if(rate==null) return 'transparent';
  const t=Math.max(-1,Math.min(1,Math.log2(rate)));
  const R=[166,51,80], A=[184,116,26], G=[46,113,80];
  const [c0,c1,u]=t<0?[A,R,-t]:[A,G,t];
  const c=c0.map((v,i)=>Math.round(v+(c1[i]-v)*u));
  return `rgba(${c[0]},${c[1]},${c[2]},${(0.14+0.34*Math.abs(t)).toFixed(3)})`;
}
// ONE FIRM MAP PER RACE (Simon, 11 Oct 2026: "we put too many horses in the same box ... we don't make hard / fast decisions
// ... must use barrier as a key determining factor"). settle_allocate.py's rule, the same here: every horse gets one spot,
// the arrangement with the highest joint chance (an exact assignment), two horses to a box (one behind the other; the 10 L+
// row and the 3+ wide lane take any number), the draw pulling inside gates toward the fence and then dealing the lanes
// within each depth band in gate order. The chances themselves (the table, a clicked horse) are unchanged.
const ST_DRAW_W=1.0;
function stAssign(cost){                               // rectangular Hungarian (rows <= cols): row -> col, minimum total cost
  const n=cost.length, m=cost[0].length, INF=1e18;
  const u=new Array(n+1).fill(0), v=new Array(m+1).fill(0), p=new Array(m+1).fill(0), way=new Array(m+1).fill(0);
  for(let i=1;i<=n;i++){
    p[0]=i; let j0=0; const minv=new Array(m+1).fill(INF), used=new Array(m+1).fill(false);
    do{ used[j0]=true; const i0=p[j0]; let d=INF, j1=0;
      for(let j=1;j<=m;j++) if(!used[j]){ const cur=cost[i0-1][j-1]-u[i0]-v[j]; if(cur<minv[j]){minv[j]=cur; way[j]=j0;} if(minv[j]<d){d=minv[j]; j1=j;} }
      for(let j=0;j<=m;j++){ if(used[j]){u[p[j]]+=d; v[j]-=d;} else minv[j]-=d; }
      j0=j1; } while(p[j0]!==0);
    do{ const j1=way[j0]; p[j0]=p[j1]; j0=j1; } while(j0);
  }
  const ans=new Array(n).fill(-1); for(let j=1;j<=m;j++) if(p[j]) ans[p[j]-1]=j-1; return ans;
}
function stAllocate(on){                               // on: runners with x.sc (24 per-mille) -> each runner's allocated cell
  const n=on.length, slots=[];
  for(let c=0;c<24;c++){ const open=(Math.floor(c/4)===5||c%4===3); for(let k=0;k<(open?n:2);k++) slots.push(c); }
  const bars=on.map(x=>x.bar??99), ord=[...bars.keys()].sort((a,b)=>bars[a]-bars[b]||a-b), rel=new Array(n);
  ord.forEach((i,k)=>{ rel[i]=n>1?k/(n-1):0; });
  const cost=on.map((x,i)=>{ const t=x.sc.reduce((a,b)=>a+b,0)||1;
    return slots.map(c=>-Math.log(Math.max(x.sc[c]/t,1e-6))+ST_DRAW_W*Math.pow((c%4)/3-rel[i],2)); });
  const pick=stAssign(cost), cell=pick.map(j=>slots[j]);
  for(let d=0;d<6;d++){                                // the draw deals the lanes within each depth band
    const ii=cell.map((c,i)=>Math.floor(c/4)===d?i:-1).filter(i=>i>=0);
    if(ii.length>1){ const lanes=ii.map(i=>cell[i]%4).sort((a,b)=>a-b); const byBar=[...ii].sort((a,b)=>bars[a]-bars[b]||a-b);
      byBar.forEach((i,k)=>{ cell[i]=d*4+lanes[k]; }); }
  }
  // Simon's map on the speed map (deploy_usermap2, 23 Oct 2026): a horse he moved on settle.html sits where he put it
  if(on.some(x=>x.umv&&Number.isInteger(x.usp))) return cell.map((c,i)=>on[i].umv&&Number.isInteger(on[i].usp)&&on[i].usp>=0&&on[i].usp<24?on[i].usp:c);
  return cell;
}
function settleBoard(r){
  const on=r.runners.filter(x=>Array.isArray(x.sc)&&x.sc.length===24);
  if(on.length<3) return '';
  const key=stKey(r).replace(/'/g,"\\'");
  const rt=(on.find(x=>Array.isArray(x.sr)&&x.sr.length===24)||{}).sr||null;
  const sel=on.find(x=>x.no===STSEL[stKey(r)])||null;
  const top=r.runners.reduce((m,x)=>(x.plead!=null&&(m===null||x.plead>m.plead))?x:m,null);
  const cell=[...Array(24)].map(()=>[]);
  const alloc0=stAllocate(on), mine=on.some(x=>Number.isInteger(x.usp));   // the firm map: one spot each, the race decided as a whole
  const alloc=on.map((x,i)=>mine&&Number.isInteger(x.usp)&&x.usp>=0&&x.usp<24?x.usp:alloc0[i]);   // Simon's map when he has saved one (usermap.py, 23 Oct 2026)
  on.forEach((x,ix)=>{
    let k=0; x.sc.forEach((v,j)=>{ if(v>x.sc[k]) k=j; });
    const t=x.sc.reduce((a,b)=>a+b,0)||1;
    const sum=f=>x.sc.reduce((a,v,j)=>a+(f(j)?v:0),0)/t;
    x._k=k; x._fence=sum(j=>j%4===0); x._front=sum(j=>Math.floor(j/4)===0); x._wide=sum(j=>j%4===3);
    x._worth=rt?x.sc.reduce((a,v,j)=>a+v*rt[j],0)/t:null;
    x._a=alloc[ix];
    cell[x._a].push(x);
  });
  const chip=x=>{
    const led=top&&top.no===x.no&&top.plead>=0.25, wd=(x._a%4)>=3;
    const cls=(led?'led':'')+(wd?' wd':'')+(sel&&sel.no===x.no?' on':'')+(x.umv?' mv':'');
    const tip=`${x.name}, gate ${x.bar??'?'}: fence ${Math.round(100*x._fence)}%, front row ${Math.round(100*x._front)}%, three wide ${Math.round(100*x._wide)}%`+
              (x.plead!=null?`, ${(100*x.plead).toFixed(0)}% to lead`:'')+' · click for its chances';
    return `<div class="smc ${cls}" role="button" tabindex="0" onclick="stPick(event,'${key}',${x.no})" title="${tip.replace(/"/g,'&quot;')}"><b>${x.no}</b><span>${x.name}</span><i>${x.bar??'?'}</i>${led?`<em>${(100*x.plead).toFixed(0)}%</em>`:''}</div>`;
  };
  const tb=(on.find(x=>x.stb)||{}).stb||null;
  const TBW={fast:'fast',even:'even',slow:'slow'};
  let h=(rt&&tb)?`<div class="sttempo">Expected tempo: <b>${TBW[tb]||tb}</b> · the colours are today's win rates at that tempo</div>`:'';
  if(r.umap) h+=`<div class="sttempo"><b>Your map</b> · saved ${new Date(r.umap.saved).toLocaleString('en-AU',{weekday:'short',hour:'numeric',minute:'2-digit'})} · race confidence ${r.umap.rconf}% · a brown edge marks a horse you moved · the ratings and prices include it · <a href="settle.html">adjust</a></div>`;
  if(sel){
    h+=`<div class="stsel"><b>${sel.no} ${sel.name}</b> · gate ${sel.bar??'?'} · its chance of each spot`+
       (sel._worth!=null?` · worth <b>${sel._worth.toFixed(2)}×</b> an even share (each chance × that spot's rate, added up)`:'')+
       ` · <a href="javascript:void 0" onclick="stPick(event,'${key}',${sel.no})">show the field</a></div>`;
  }
  h+='<div class="stb" role="figure" aria-label="Settle picture: rail along the bottom, leader at the left, wider lanes above, lengths behind the leader across"><div></div>';
  STD.forEach(d=>{ h+=`<div class="hd">${d[0]||'&nbsp;'}<small>${d[1]}</small></div>`; });
  for(let l=3;l>=0;l--){
    h+=`<div class="ln">${STL[l]}</div>`;
    for(let d=0;d<6;d++){
      const j=d*4+l, rate=rt?rt[j]:null;
      const bg=`background:${stTint(rate)}`;
      const corner=rate!=null?`<span class="sr">${rate.toFixed(1)}×</span>`:'';
      if(sel){
        const t=sel.sc.reduce((a,b)=>a+b,0)||1, p=100*sel.sc[j]/t;
        h+=`<div class="cell pick${sel._k===j?' best':''}" style="${bg}">${corner}<div class="pp" style="opacity:${(0.35+0.65*Math.min(1,p/30)).toFixed(2)}">${p<0.5?'·':p.toFixed(0)+'%'}</div></div>`;
      } else {
        const c=cell[j].sort((a,b)=>(a.bar??99)-(b.bar??99));
        h+=`<div class="cell${l===0?' f':''}" style="${bg}">${corner}${c.map(chip).join('')}</div>`;
      }
    }
  }
  h+='<div class="strl">rail</div><div class="strail"></div></div>';
  const rows=[...on].sort((a,b)=>a._k-b._k||b._fence-a._fence).map(x=>
    `<tr class="${sel&&sel.no===x.no?'on':''}" onclick="stPick(event,'${key}',${x.no})"><td>${x.no}</td><td>${x.name}</td><td>${x.bar??'?'}</td><td>${Math.round(100*x._fence)}%</td><td>${Math.round(100*x._front)}%</td>`+
    `<td>${Math.round(100*x._wide)}%</td><td>${STL[x._k%4].toLowerCase()}, ${STD[Math.floor(x._k/4)][1]}</td><td>${x._worth!=null?x._worth.toFixed(2)+'×':'–'}</td></tr>`).join('');
  h+=`<table class="sttab"><thead><tr><th>No.</th><th>Runner</th><th>Bar</th><th>Fence</th><th>Front row</th><th>3 wide</th><th>Likeliest</th><th>Worth</th></tr></thead><tbody>${rows}</tbody></table>`;
  h+='<div class="smnone">Settle map: one spot for every horse, the race decided as a whole -- two to a box, the draw settling who gets the inside when horses want the same spot; a red edge marks a horse placed three wide or more. The table keeps each horse\'s own likeliest spot and its chances. '+
     (rt?'Each spot is coloured by how often a horse settling there wins at today\'s track, trip, rail, going and tempo, against an even share of the field: red below, amber about even (1.0×), green above; the figure in the corner is that multiple. ':'')+
     'Click a horse, or its row, for its chance of every spot and what it is worth.</div>';
  return h;
}

// item 47 (Simon, 17 Sep 2026): the two shortest-priced runners have met each other before.
// True in about one race in six. DISPLAY ONLY -- h2h_cue.py explains why it is not a rating input.
// `dw` is the swing against the meeting named in the sentence; `dwavg` is the mean across every
// meeting, which is what the rating factor uses. The sentence describes one meeting, so it shows dw.
function h2hCue(r){
  const f=r.h2h; if(!f) return '';
  // Name the favourite explicitly: the whole point of the cue is whether THE FAVOURITE was beaten,
  // and a bare pair of horse names does not say which one that is.
  const fv=n=>`${n}<span class="fv">fav</span>`;
  const cls=f.won?'beat':'upset';        // the favourite being beaten is the reading worth the colour
  const W=f.won?`<span class="beat">${fv(f.fav)}</span>`:`<span class="upset">${f.opp}</span>`;
  const L=f.won?f.opp:`<span class="upset">${fv(f.fav)}</span>`;
  let who=f.dead?`<span class="beat">${fv(f.fav)}</span> and <span class="beat">${f.opp}</span> dead-heated`
                :`${W} beat ${L} by ${Math.abs(f.mgn)}L`;
  let where=[f.days===0?'today':f.days===1?'yesterday':`${f.days} days ago`,
             f.track?`at ${f.track}`:'', f.dist?`over ${f.dist}m`:''].filter(Boolean).join(' ');
  if(f.dead) return `<p class="h2hc"><b class="lbl">Top two have met:</b> ${who} ${where}`
    +(f.n>1?` <span class="qual">(${f.n} meetings)</span>`:'')+`</p>`;
  let more=f.n>1?` <span class="qual">(${f.n} meetings, ${f.record[0]}\u2013${f.record[1]}`
      +(f.record[2]?`\u2013${f.record[2]}`:'')+' to the favourite)</span>':'';
  let sw=(f.dw!==null&&f.dw!==undefined&&Math.abs(f.dw)>=0.5)

// a smooth line through the points: a MONOTONE cubic (Fritsch-Butland tangents), so the line is eased but never swings
// past a value between two runs -- a plain spline overshot a 46-to-77 jump to 78. The dots stay on the values.
function wSmooth(p){
  const n=p.length; if(n<2) return '';

  for(let k=0;k<n-1;k++){ h[k]=p[k+1][0]-p[k][0]; dl[k]=(p[k+1][1]-p[k][1])/h[k]; }
  m[0]=dl[0]; m[n-1]=dl[n-2];
  for(let k=1;k<n-1;k++) m[k]=dl[k-1]*dl[k]<=0?0:3*(h[k-1]+h[k])/((2*h[k]+h[k-1])/dl[k-1]+(h[k]+2*h[k-1])/dl[k]);

}

function wetLine(r,x){

    if(legs.some(g=>!g.l)){ const my=myqBody(m,q); return {k,lab,sh,tip,y:false,sum:'<b>NO TICKET</b>'+my.sum,body:`<div class="quad no qb"><div class="sm ft">A leg is not rated, so there is no ticket.</div>${my.body}</div>`}; }
    const n=legs.reduce((a,g)=>a*g.l.pick.length,1), fx=100*QUAD_STAKE/n, ok=n<=cap, fxs=fx>=10?fx.toFixed(0):fx.toFixed(1);
    const qa=quadApprox(m,r,q,legs,fx), my=myqBody(m,q);

  });
}

// the HK adjustments as the Aus list (4 Nov 2026): Base -> SPM Rating, then one row per part of the HK model, biggest first,
// a second click (the Adjustments button and FXOPEN are the Aus rows' own); the card's lines (body weight, gear, level) close
// the list. x.fxg (hk_day.py) carries the parts in pounds; a day file from before the full model falls back to the five base parts.
function hkLedger(x,r){
  const sg=(v,d=2)=>v==null?'—':(Math.abs(v)<5/Math.pow(10,d+1)?(0).toFixed(d):(v>0?'+':'−')+Math.abs(v).toFixed(d));
  const f=x.fx||{}, fw=r.runners.reduce((a,y)=>a+(y.wt||0),0)/r.runners.length;
  const parts=x.fxg?x.fxg:[
    {g:'base',t:'Form against its mark',v:f.form,w:x.pvm==null?'no HK form yet · the field average':`has run ${sg(x.pvm,1)} lb against its mark, its last ${Math.min(x.starts||0,10)} HK runs weighted to recent, bad runs forgiven · against the field`},
    {g:'base',t:'The mark',v:f.mark,w:`rated ${x.mark??'—'}${x.mark_chg?` (${sg(x.mark_chg,0)} since its last start)`:''} · against the field`},
    {g:'adj',t:'Weight carried',v:f.wt,w:`carries ${x.wt} lb${x.claim?` after a ${x.claim} lb claim`:''}, the field ${fw.toFixed(1)}`},
    {g:'adj',t:'Days off',v:f.days,w:x.days==null?'first HK start':`${x.days} days since its last HK run`},
    {g:'adj',t:'HK starts',v:f.starts,w:`${x.starts} HK start${x.starts===1?'':'s'}`}];
  const net=(Math.round(x.rating*10)-Math.round(x.wprbase*10))/10, nc=Math.abs(net)<0.05?'f':(net>0?'p':'g');
  const sum=`<div class="adjsum"><span>Base</span><b>${x.wprbase.toFixed(1)}</b><span class="ar">&rarr;</span><span>SPM Rating</span><b class="tot">${x.rating.toFixed(1)}</b>`
    +`<span class="net ${nc}">${Math.abs(net)<0.05?'level':(net>0?'up':'down')+' '+Math.abs(net).toFixed(1)} on today's things</span>`
    +`<span class="ar">· handicap pounds · base from the field average mark, ${r.markmean!=null?r.markmean.toFixed(1):'—'}</span>`
    +`<button type="button" class="fxb" aria-expanded="${FXOPEN}" onclick="fxTog()">${FXOPEN?'Hide adjustments ▾':'Adjustments ▸'}</button></div>`;
  if(!FXOPEN) return sum;
  const rows=parts.filter(p=>p.v!=null).slice().sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
  const cells=rows.map(p=>{ const c=Math.abs(p.v)<0.005?'f':(p.v>0?'p':'g');
    return `<div class="${c==='f'?'zero':''}"><div class="an">${p.t}${p.g==='base'?' <small class="hkg">base</small>':''}</div><div class="av ${c}">${sg(p.v)}</div><div class="aw">${p.w||''}</div></div>`; }).join('');
  const info=(n,v,w)=>`<div class="zero"><div class="an">${n}</div><div class="av f">${v}</div><div class="aw">${w}</div></div>`;
  const card=info('Body weight',x.bodywt!=null?x.bodywt+' lb':'—',(x.bodywt_chg!=null?`${sg(x.bodywt_chg,0)} lb on its last declaration`:'no change shown')+' · on the card, not in the rating')
    +info('Gear',x.gear||'none','HKJC codes, as declared · on the card, not in the rating')
    +info('Level',x.level!=null?x.level.toFixed(1):'—','its mark plus its form against it · on the card, not in the rating');
  return sum+`<div class="adjl">${cells}${card}</div>`;
}

  return /\.github\.io$/.test(h)&&p?h.split('.')[0]+'/'+p:null; })();
const pkNm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const pkKey=(m,r,x)=>`${m.track}|${r.no}|${pkNm(x.name)}`;
const PKSVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>';

// GitHub token that GitHub confirms can push to the dash repo (GET /repos: permissions.push). Anywhere else: no star, no marked row,
// no race-tab star, nothing read from the repo. The check is remembered per token (spm.pkok holds a fingerprint, never the token),
// so the stars show at once and offline at the track; GitHub refusing the token (401/403/404) takes them away.
const PKOKL='spm.pkok';
const pkFp=t=>{ let h=5381; for(let i=0;i<t.length;i++) h=((h*33)^t.charCodeAt(i))>>>0; return 'v1:'+h.toString(36)+':'+t.length; };

async function pkAuth(){
  const t=pkTok(), was=PKOK;
  if(!t||!PKREPO) PKOK=false;

async function pkList(){

async function pkPush(date){

    for(let i=0;i<4;i++){

// ---- find a horse (Simon, 4 Nov 2026) --------------------------------------
// hidx/<L>.json: [[name, id, last run, trainer], ...] for every horse whose name starts with L (A-Z, 0 for the rest), fetched
// once per letter as the user types; h/<id>.json the horse's guide. Both from horsecard.py, nightly, every horse with a
// run since 2023. Enter opens the first match, Escape closes.
const HIDX={}, HREC={}; let HSEL=0, HOPEN=null;
function hsLetter(q){ const n=q.toUpperCase().replace(/[^A-Z0-9]/g,''); return n?(/[A-Z]/.test(n[0])?n[0]:'0'):null; }
function hsIndex(L){
  if(HIDX[L]!==undefined) return HIDX[L];
  HIDX[L]='…';
  fetch(`hidx/${L}.json`,{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{HIDX[L]=Array.isArray(j)?j:null;}).catch(()=>{HIDX[L]=null;}).finally(hsType);
  return '…';
}
function hsMatches(q){
  const L=hsLetter(q); if(!L) return [];
  const idx=hsIndex(L); if(idx==='…'||!idx) return idx;
  const n=q.toUpperCase().replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim(), nn=n.replace(/ /g,'');
  const pre=[], mid=[];
  for(const e of idx){ const u=String(e[0]).toUpperCase(), uu=u.replace(/[^A-Z0-9]/g,'');
    if(uu.startsWith(nn)) pre.push(e); else if(u.includes(n)) mid.push(e); if(pre.length>=12) break; }
  return pre.concat(mid).slice(0,12);
}
function hsType(){
  const q=($("hsq").value||'').trim(), box=$("hsres");
  if(q.length<2){ box.hidden=true; box.innerHTML=''; return; }
  const m=hsMatches(q); box.hidden=false; HSEL=Math.min(HSEL,Math.max(0,(Array.isArray(m)?m.length:0)-1));
  if(m==='…'){ box.innerHTML='<div class="hsmsg">Looking…</div>'; return; }
  if(!m){ box.innerHTML='<div class="hsmsg">The horse index is not on the dash yet.</div>'; return; }
  if(!m.length){ box.innerHTML=`<div class="hsmsg">No horse matching “${q.replace(/</g,'')}” (every horse raced or trialled since 2023).</div>`; return; }
  box.innerHTML=m.map((e,i)=>`<button type="button" class="${i===HSEL?'on':''}" onclick="openHorse(${e[1]},this)"><b>${e[0]}</b><span class="s">${e[3]||''}${e[2]?' · '+e[2].slice(8,10)+'/'+e[2].slice(5,7)+'/'+e[2].slice(2,4):''}</span></button>`).join('');
}
function hsKey(ev){
  const box=$("hsres"), items=box.hidden?[]:[...box.querySelectorAll('button')];
  if(ev.key==='Escape'){ box.hidden=true; $("hsq").blur(); return; }
  if(!items.length) return;
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ ev.preventDefault(); HSEL=(HSEL+(ev.key==='ArrowDown'?1:items.length-1))%items.length; items.forEach((b,i)=>b.classList.toggle('on',i===HSEL)); }
  else if(ev.key==='Enter'){ ev.preventDefault(); (items[HSEL]||items[0]).click(); }
}

// ---- replay dock: a replay plays on the page, not in a new tab -------------
// Two kinds of link land here. TAB's Sky replays (mediatabs.skyracing.com.au) are
// plain MP4s -- open Akamai files, no referer check -- and play in a <video>.
// racing.com jump-outs are Brightcove player pages, so they go in an iframe.
// Anything else returns false and the click falls through to the old new-tab
// behaviour, so an unrecognised link is never swallowed.
function playVid(url,label){
  const b=$("vdb"); if(!b||!url) return false;
  let inner;
  if(/\.mp4(\?|$)/i.test(url))
    inner=`<video src="${url}" controls autoplay playsinline preload="metadata"></video>`;
  else if(/^https:\/\/players\.brightcove\.net\//i.test(url))
    inner=`<iframe src="${url}${url.includes('?')?'&':'?'}autoplay=true" allowfullscreen
             allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  else if(/^https:\/\/racing\.hkjc\.com\/contentAsset\/videoplayer/i.test(url))      // HKJC's replay page, the one their results page frames (1 Nov 2026)
    inner=`<iframe src="${url}" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  else if(/^https:\/\/vimeo\.com\/\d+/i.test(url))                                     // RWWA's WA trials: the watch page refuses a frame, the player embeds (1 Nov 2026, Simon: in the window, like the live vision)
    inner=`<iframe src="https://player.vimeo.com/video/${url.match(/^https:\/\/vimeo\.com\/(\d+)/i)[1]}?autoplay=1" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  else return false;
  $("vdt").textContent=label||'Replay';
  b.innerHTML=fsTidy(inner);
  killHls();
  $("vdock").classList.remove('wide');
  $("vdock").hidden=false; vqDraw();
  return true;
}

      p.querySelectorAll('.fcsc tr').forEach(t=>{ if(t.children.length>cr+1) t.children[cr].remove(); })); }

function vfPlace(){

// ---- the quaddie under the vision (Simon, 16 Nov 2026: "I want to be able to see the quaddie numbers in / around the vision when
// i'm watching it ... if I haven't built one, then the recommended ones, if I have, then the ones I built") -------------------
// A strip at the foot of the dock, whatever is playing. ONE LEG at a time (Simon, 16 Nov 2026: "i only want to see the current leg
// - or be able to chose it ... and show the silks / names (can be abbreviated to save space)... silks most important"): the leg
// to run next unless he picks another (VQL, per track, cleared when the dock closes), each selection as silk, number and name
// (cut short with an ellipsis, the full name on hover). The picker lists the legs of the meeting's quaddies still running (all of
// them once the card is done): a dot on the next, grey once run, and with results shown green for a leg his ticket won, red for
// a miss (the winner then added in red). The ticket is HIS when every leg holds a star (myqLegs, the same stars as My ticket),
// else SPM Auto Generated Selections (quadLeg, as on the race page); combinations and flexi on his stake or QUAD_STAKE. The meeting is
// the one on screen when it has a quaddie today; otherwise (Next to Go, another day) the one where his ticket's next leg is
// soonest, else any quaddie's. The arrows step through today's quaddie meetings; Hide folds the strip to one line (spm.vq).
// Today is Melbourne's date; a past day's page uses its own day. Display only.
var VQM=null;      // the track the arrows chose; null follows the page
var VQL={};        // track -> the race no. he picked in the strip; absent = the leg to run next
var VQOFF=(()=>{ try{ return localStorage.getItem('spm.vq')==='0'; }catch(e){ return false; } })();
const melDate=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Melbourne'});
const vqDay=()=>(!PAST&&DATA.days.find(d=>d.date===melDate()))||D();
function vqRun(date,m,r){
  const lv=(LIVEBY[date]||{})[`${m.track}|${r.no}`];
  if(lv&&['Interim','Paying','Abandoned'].includes(lv.status)) return true;
  if(lv&&lv.status) return false;
  return !!r.start_utc&&(Date.now()-new Date(r.start_utc).getTime())>=1800000;
}
function vqTicket(d,m,q){   // {mine, legs:[{no, sel, scr, run, win, t}], n, stake, part}
  const ml=myqLegs(m,q,d.date), mine=ml.every(g=>g.sel.length);
  const legs=q.legs.map((no,i)=>{ const rr=m.races.find(x=>x.no===no); if(!rr) return null;
    let sel, scr=[];
    if(mine){ sel=ml[i].sel; scr=ml[i].scr; } else { const l=quadLeg(rr); if(!l) return null; sel=l.pick.map(x=>x.no).sort((a,b)=>a-b); }
    const lv=(LIVEBY[d.date]||{})[`${m.track}|${no}`], win=(!RESH&&lv&&lv.results&&lv.results[0])?lv.results[0].map(Number):null;
    sel=sel.map(Number); scr=scr.map(Number);
    return {no,sel,scr,run:vqRun(d.date,m,rr),win,t:rr.start_utc?new Date(rr.start_utc).getTime():0}; });
  if(legs.some(g=>!g)) return null;
  const n=legs.reduce((a,g)=>a*g.sel.length,1);
  return {mine,legs,n,stake:mine?myqStake():QUAD_STAKE,part:!mine&&ml.some(g=>g.sel.length)};
}
function vqMeets(d){   // the day's quaddie meetings, each with its tickets and when its next leg runs (Infinity once done)
  return d.meetings.filter(m=>(m.quads||[]).some(q=>q.legs&&q.legs.length===4)).map(m=>{
    const tk=m.quads.filter(q=>q.legs&&q.legs.length===4).map(q=>({q,t:vqTicket(d,m,q)})).filter(z=>z.t);
    const live=tk.filter(z=>!z.t.legs[3].run);
    const nxt=z=>{ const l=z.t.legs.find(x=>!x.run); return l?l.t:Infinity; };
    return {m,tk,live,next:Math.min(Infinity,...live.map(nxt)),mine:Math.min(Infinity,...live.filter(z=>z.t.mine).map(nxt))};
  }).filter(z=>z.tk.length);
}
function vqPick(d,ms){
  if(VQM){ const z=ms.find(x=>x.m.track===VQM); if(z) return z; }
  if(d===D()&&meet>=0){ const z=ms.find(x=>x.m.track===M().track); if(z) return z; }
  const by=k=>ms.filter(x=>x[k]<Infinity).sort((a,b)=>a[k]-b[k])[0];
  return by('mine')||by('next')||ms[0];
}
window.vqStep=k=>{ const d=vqDay(), ms=vqMeets(d); if(!ms.length) return;
  const i=ms.indexOf(vqPick(d,ms)); VQM=ms[(i+k+ms.length)%ms.length].m.track; vqDraw(); };

// Full screen with the quaddie on the picture (Simon, 16 Nov 2026: "any way to get that on full screen view?"). The browser's own
// full screen takes the video or the player frame ALONE, so the strip could never be in it: this button takes the whole dock
// full screen instead, the picture filling it and the strip laid over it (top left; the up-down button moves it to the foot,

// ---- the dock moved and sized by hand (Simon, 16 Nov 2026). Wider than a phone only (under 720 px it is the full-width strip at the
// foot). The title bar drags it anywhere on the screen, the grip at the bottom-right corner sizes it (the picture keeps 16:9, so the
// width sets the height); both are kept on this device (spm.vdock) and clamped to the window. Double-click the title bar: back to
// where it started. Full screen overrides both (CSS !important) and the dock comes back to them after.
(function(){
  const d=$("vdock"), h=d&&d.querySelector('.vh'), g=$("vgrip"); if(!d||!h||!g) return;
  const wide=()=>innerWidth>720;
  let st=(()=>{ try{ return JSON.parse(localStorage.getItem('spm.vdock')||'null'); }catch(e){ return null; } })(), lastTap=0;
  const save=()=>{ try{ st?localStorage.setItem('spm.vdock',JSON.stringify(st)):localStorage.removeItem('spm.vdock'); }catch(e){} };
  function apply(){
    if(!st||!wide()){ d.style.left=d.style.top=d.style.width=d.style.right=d.style.bottom=''; return; }
    const W=Math.max(300,Math.min(st.w||460,innerWidth-16,(innerHeight-90)*16/9));
    d.style.width=W+'px'; d.style.right='auto'; d.style.bottom='auto';
    const r=d.getBoundingClientRect(), H=r.height||W*9/16+40;
    d.style.left=Math.max(4,Math.min(st.x,innerWidth-W-4))+'px';
    d.style.top=Math.max(4,Math.min(st.y,innerHeight-Math.min(H,innerHeight-8)-4))+'px';
  }
  function grab(e,kind){
    if(!wide()||d.classList.contains('fs')||e.button>0) return;
    if(kind==='move'&&e.target.closest('button,a,input')) return;
    e.preventDefault();
    const r=d.getBoundingClientRect(), x0=e.clientX, y0=e.clientY;
    st={x:r.left,y:r.top,w:r.width}; apply();
    d.classList.add('drag'); const el=e.currentTarget; try{ el.setPointerCapture(e.pointerId); }catch(_){}
    const mv=ev=>{ if(kind==='move'){ st.x=r.left+ev.clientX-x0; st.y=r.top+ev.clientY-y0; } else { st.w=r.width+ev.clientX-x0; } apply(); };
    const up=ev=>{ d.classList.remove('drag'); el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up);
      const still=Math.abs(ev.clientX-x0)<4&&Math.abs(ev.clientY-y0)<4, now=Date.now();
      if(kind==='move'&&still&&now-lastTap<400){ lastTap=0; st=null; save(); apply(); return; }   // a double tap on the title bar: back to the start
      if(kind==='move'&&still) lastTap=now;
      const q=d.getBoundingClientRect(); st={x:q.left,y:q.top,w:q.width}; save(); };
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  }
  h.addEventListener('pointerdown',e=>grab(e,'move'));
  g.addEventListener('pointerdown',e=>grab(e,'size'));
  addEventListener('resize',apply);
  new MutationObserver(()=>{ if(!d.hidden) apply(); }).observe(d,{attributes:true,attributeFilter:['hidden','class']});
  window.vdockPlace=apply;
})();
document.addEventListener('fullscreenchange',()=>{ const d=$("vdock"); if(!d) return; const on=document.fullscreenElement===d;
  d.classList.toggle('fs',on); if(!on){ try{ screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock(); }catch(e){} }
  const f=$("vfs"); if(f) f.innerHTML=on?'&#10005;':'&#x26F6;'; vqDraw(); });

    if(v.canPlayType('application/vnd.apple.mpegurl')){ v.src=src; return; }
    b.innerHTML='<p class="vmsg">Live vision needs hls.js and it did not load. '+
            '<a href="'+c.url+'" target="_blank" rel="noopener">Open the stream</a></p>'; return;
  }
  // liveDurationInfinity TRUE is what gives us a scrubber, and 8 Nov 2026 took it out on exactly the
  // wrong theory. Only with it set does hls.js call MediaSource.setLiveSeekableRange(first fragment,
  // live edge) -- see buffer-controller.ts -- and over OUR 30-minute playlist that is a 30-minute
  // draggable bar. hls.js's own doc: "If you want to have a native Live UI in environments like iOS
  // Safari, Safari, Android Google Chrome, etc. set this value to true." With it false hls.js sets a
  // finite, growing duration and never marks a live seekable range at all, so there is no DVR bar.
  // The timeline was never the problem: over Sky's own 9-12 SECOND window there was nothing to drag.
  // backBufferLength:Infinity is hls.js's DEFAULT (the browser evicts anyway), so it was a no-op
  // yesterday; kept explicit only so a short rewind does not re-fetch what has just played.
  _hls=new Hls({liveDurationInfinity:true,backBufferLength:Infinity});
  _hls.loadSource(src);
  _hls.attachMedia(v);
  _hls.on(Hls.Events.ERROR,(_e,data)=>{
    if(!data.fatal) return;                              // hls.js retries these itself
    if(!_skyDirect&&data.type===Hls.ErrorTypes.NETWORK_ERROR){ skyLive(key,true); return; }   // our copy
    if(data.type===Hls.ErrorTypes.NETWORK_ERROR) _hls.startLoad();
    else if(data.type===Hls.ErrorTypes.MEDIA_ERROR) _hls.recoverMediaError();
    else { killHls(); b.innerHTML='<p class="vmsg">The Sky feed dropped out. Close and try again.</p>'; }
  });
};

// ---- status strip: reads status.json beside the page, polls every 60 s ----
(function(){
  const el=$("trs"); if(!el) return;
  let seen=null, pageStamp=null;   // pageStamp = 'Fri 04 Sep 23:21' from the injected banner
  const asDate=s=>{if(!s) return null; const d=new Date(s.length<=19?s+(s.includes('T')?'':'T00:00:00'):s); return isNaN(d)?null:d;};
  const hm=d=>d?d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:false}):'—';
  const wd=d=>d?d.toLocaleDateString('en-AU',{weekday:'short'}):'';
  const ago=d=>{if(!d) return ''; const m=Math.round((Date.now()-d)/60000);
    return m<1?'just now':m<60?`${m}m ago`:m<1440?`${Math.floor(m/60)}h ${m%60}m ago`:`${Math.floor(m/1440)}d ago`;};
  async function tick(){
    if(PAST) return;                                   // a past day's page keeps the Rated strip it was published with
    let j;
    try{const r=await fetch('status.json',{cache:'no-store'}); if(!r.ok) throw 0; j=await r.json();}
    catch(e){ return; }                                   // leave the injected banner as-is
    const old=document.getElementById('tr-updated');
    if(old){ pageStamp=(old.querySelector('b')||{}).textContent||null;
      if(old.nextElementSibling&&old.nextElementSibling.style.height) old.nextElementSibling.remove(); old.remove(); }
    const failed=j.status&&j.status!=='ok';
    const fin=asDate(j.finished||j.started), ext=asDate(j.extract);
    const rs=j.rider_share, prelim=!!j.preliminary||(rs!=null&&rs<0.6);
    const state=failed?'fail':(prelim?'prelim':'ok');
    const sameDay=fin&&new Date().toDateString()===fin.toDateString();
    const stamp=fin?`${wd(fin)} ${String(fin.getDate()).padStart(2,'0')} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][fin.getMonth()]} ${hm(fin)}`:null;
    let h=`<span class="dot"></span>
      <span class="t">${failed?'Last run <b>failed</b>':'Rated'} <b>${sameDay?'':wd(fin)+' '}${hm(fin)}</b> <span class="ago">${ago(fin)}</span>${j.reason?` · <span class="why">${j.reason}</span>`:''}</span>`;
    if(prelim&&!failed) h+=`<span class="tag" title="rider share below 60% — connections are unreliable until riders are declared">preliminary</span>`;
    if(failed) h+=`<span class="tag" title="${(j.error||'').replace(/"/g,'&quot;')}">${/publish/i.test(j.error||'')?'publish failed':'rating failed'}</span>`;
    const m=[];
    if(j.acceptors!=null) m.push(`<span><i>${j.acceptors}</i> acceptors</span>`);
    if(rs!=null) m.push(`<span>riders <i class="${rs<0.6?'bad':(rs<0.9?'warn':'')}">${Math.round(rs*100)}%</i></span>`);
    if(j.scratchings!=null) m.push(`<span><i>${j.scratchings}</i> scr</span>`);
    if(ext) m.push(`<span>extract <i>${hm(ext)}</i></span>`);
    m.push(`<span class="tg">TAB <i class="tab-age">—</i></span>`);
    h+=`<span class="m">${m.join('')}</span>`;
    // newer rating than this page?  (status.json changed since first poll, or page banner stamp differs from status)
    const stale=!failed&&((seen&&j.finished&&j.finished!==seen)||(pageStamp&&stamp&&pageStamp!==stamp&&fin>new Date(pageStamp.replace(/^[A-Za-z]+ /,'')+' '+fin.getFullYear())));
    if(stale) h+=`<button class="reload" onclick="location.reload()">Re-rated ${hm(fin)} — reload</button>`;
    if(!seen) seen=j.finished||null;
    el.className='trs '+state; el.innerHTML=h; el.hidden=false;
    refreshTabAge();
    document.body.style.paddingBottom=(el.offsetHeight+6)+'px';
  }
  function readBanner(){
    const old=document.getElementById('tr-updated'); if(!old) return;
    pageStamp=(old.querySelector('b')||{}).textContent||null;   // read for the stale check in tick()
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>{readBanner();tick();});
  else {readBanner();tick();}
  setInterval(tick,60000); window._trsTick=tick;
})();
