<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TopRate v2 — week</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161B21; --panel:#1E262E; --panel2:#243039; --rule:#2F3B45;
  --text:#E7EAE6; --dim:#8B959D; --faint:#5E6970;
  --pos:#79B89A; --neg:#B0697E; --brass:#DCBE68; --flat:#4A555E; --cond:#6E9FC4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.an{font-family:"Archivo Narrow",Arial Narrow,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
header{border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:10px}
.meet{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:34px;letter-spacing:-.01em;margin:0;line-height:1}
.date{color:var(--dim);font-size:14px}
.conds{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-self:center}
.chip{border:1px solid var(--rule);border-radius:3px;padding:4px 9px;display:flex;align-items:baseline;gap:7px;background:var(--panel)}
.chip b{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:14px}
.chip span{color:var(--dim);font-size:11.5px}
.chip.wet b{color:var(--cond)}

.days{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:14px;overflow-x:auto}
.days button{background:none;border:0;border-bottom:3px solid transparent;color:var(--dim);padding:8px 14px 9px;cursor:pointer;font-family:inherit;text-align:left;white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.days button .d{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:17px;color:inherit}
.days button .s{font-size:11px;color:var(--faint)}
.days button:hover{color:var(--text)}
.days button[aria-selected=true]{color:var(--text);border-bottom-color:var(--brass)}
.days button[aria-selected=true] .s{color:var(--dim)}
.days button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}

.mtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.mtabs button{background:var(--panel);border:1px solid var(--rule);border-radius:3px;color:var(--dim);padding:8px 13px;cursor:pointer;white-space:nowrap;text-align:left;font-family:inherit;font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:118px}
.mtabs button:hover{border-color:var(--dim);color:var(--text)}
.mtabs button[aria-selected=true]{border-color:var(--brass);background:var(--panel2);color:var(--text)}
.mtabs button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.mtabs .tk{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:14.5px}
.mtabs .sb{color:var(--faint);font-size:10.5px;display:flex;gap:7px}
.mtabs .sb .w{color:var(--cond)}

nav{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--rule)}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:8px 13px 7px;cursor:pointer;font-family:"Archivo Narrow",sans-serif;font-size:15px;font-weight:600;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
nav button .rt{font-size:11.5px;font-weight:500;color:var(--faint)}
nav button[aria-selected=true] .rt{color:var(--brass)}
nav button .cd{font-size:11px;font-weight:600;color:var(--pos);font-variant-numeric:tabular-nums}
nav button .cd.soon{color:var(--brass)}
nav button .cd.gone{color:var(--faint);font-weight:500}
nav button:hover{color:var(--text)}
nav button[aria-selected=true]{color:var(--text);border-bottom-color:var(--brass)}
nav button.sum{color:var(--brass)}
nav button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}

.mnote{margin:0 0 14px;padding:9px 13px;border-left:3px solid var(--cond);background:var(--panel);color:var(--dim);font-size:12.5px;line-height:1.5}
.surf{background:var(--panel2);color:var(--text);border:1px solid var(--brass);border-radius:3px;padding:2px 6px;font:inherit;font-size:12.5px}
.surfall{background:none;color:var(--dim);border:1px solid var(--rule);border-radius:3px;padding:2px 8px;font:inherit;font-size:12px;cursor:pointer;margin-left:4px}
.surfall:hover{color:var(--text);border-color:var(--brass)}
.rerated{color:var(--cond);font-size:12px;margin-left:6px}
.rnote{margin:0 0 14px;padding:10px 13px;border-left:3px solid var(--brass);background:var(--panel);color:var(--text);font-size:13px;line-height:1.5}
.rnote b{color:var(--brass);font-family:"Archivo Narrow",sans-serif;font-size:14px}



.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font-weight:500;font-size:11.5px;color:var(--faint);padding:0 8px 7px;border-bottom:1px solid var(--rule);line-height:1.25;vertical-align:bottom}
th.r{text-align:right}
tbody tr{border-bottom:1px solid var(--panel2)}
td{padding:9px 8px;vertical-align:middle}
tbody tr.run,tbody tr.srow{cursor:pointer}
tbody tr.run:hover,tbody tr.srow:hover{background:var(--panel)}
tbody tr.run:focus-visible,tbody tr.srow:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.tab{font-family:"Archivo Narrow",sans-serif;font-weight:600;color:var(--dim);font-size:15px;width:30px}
.silk{width:26px;height:26px;border-radius:2px;background:var(--panel2);flex:0 0 26px;object-fit:contain}
.silk.ph{display:inline-block}
.horse{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:9px}
.jock{color:var(--dim);font-size:12.5px;margin-top:1px;padding-left:35px}
.res{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:10.5px;border-radius:2px;padding:1px 5px;letter-spacing:.03em;white-space:nowrap;line-height:1.3}
.res.r1{background:var(--brass);color:var(--ink)}
.res.r2,.res.r3,.res.r4{border:1px solid var(--dim);color:var(--dim)}
.replay{color:var(--cond);text-decoration:none;font-weight:500}
.replay:hover{text-decoration:underline}
nav button .cd.st{text-transform:uppercase;letter-spacing:.04em;font-size:10px}
.tagu{border:1px solid var(--brass);color:var(--brass);border-radius:2px;font-size:9.5px;font-family:"Archivo Narrow",sans-serif;font-weight:600;padding:1px 4px;letter-spacing:.03em;white-space:nowrap}
.tagv.gold{border-color:var(--brass);color:var(--brass)}
.tagv{border:1px solid var(--pos);color:var(--pos);border-radius:2px;font-size:9.5px;font-family:"Archivo Narrow",sans-serif;font-weight:600;padding:1px 4px;white-space:nowrap}
.bar{color:var(--dim);font-size:13px;width:44px}
.l5{font-family:"Archivo Narrow",sans-serif;font-size:15px;letter-spacing:.14em;color:var(--dim);white-space:nowrap;width:86px;font-variant-numeric:tabular-nums}
.l5 b{color:var(--text);font-weight:600}
.l5 i{font-style:normal;color:var(--faint)}
.l5 .none{color:var(--faint);letter-spacing:0}
.mtabs .sb .ts{color:var(--faint);margin-left:auto;padding-left:6px}
.abil{font-family:"Archivo Narrow",sans-serif;font-size:17px;text-align:right;width:56px;color:var(--dim)}
.abil.est{color:var(--faint);font-style:italic}
.cx{width:104px}
.cxin{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.cxn{font-family:"Archivo Narrow",sans-serif;font-size:14.5px;width:40px;text-align:right}
.cxn.p{color:var(--pos)} .cxn.g{color:var(--neg)} .cxn.f{color:var(--faint)}
.cxb{position:relative;height:16px;background:var(--panel2);border-radius:1px;flex:0 0 auto}
.cxb u{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--flat);text-decoration:none}
.cxb i{position:absolute;top:3px;bottom:3px;border-radius:1px}
.rate{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:23px;text-align:right;width:64px;letter-spacing:-.01em}
tbody tr.run.top .rate{color:var(--brass)}
.pct{font-family:"Archivo Narrow",sans-serif;font-size:15px;width:52px;text-align:right;color:var(--dim)}
/* key column: adjusted rating */
/* key band: adjusted + lengths */
td.key,th.key,td.key2,th.key2{background:rgba(220,190,104,.075)}
td.key,th.key{box-shadow:inset 1px 0 0 rgba(220,190,104,.18)}
td.key2,th.key2{box-shadow:inset -1px 0 0 rgba(220,190,104,.18)}
th.key,th.key2{color:var(--brass)}
tbody tr.run:hover td.key,tbody tr.run:hover td.key2{background:rgba(220,190,104,.11)}
tbody tr.run.top td.key,tbody tr.run.top td.key2{background:rgba(220,190,104,.14)}
.lens{font-family:"Archivo Narrow",sans-serif;font-size:17px;font-weight:600;width:66px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums;padding-left:10px;padding-right:12px}
/* adjustments mini chart */
.fx{width:250px;padding-top:4px;padding-bottom:4px}
.fxin{position:relative;display:flex;gap:16px;align-items:flex-start;height:44px;width:194px;margin:0 auto}
.fxin u{position:absolute;left:0;right:0;top:22px;height:1px;background:var(--flat);text-decoration:none}
.fxb{position:relative;width:26px;height:44px;flex:0 0 26px}
.fxb i{position:absolute;left:0;right:0;border-radius:1px}
.fxb.clip i::after{content:'';position:absolute;left:0;right:0;height:2px;background:var(--ink)}
.fxb.clip i[style*="top:0px"]::after{top:2px} .fxb.clip i:not([style*="top:0px"])::after{bottom:2px}
th.fxh{text-align:center;padding-left:0;padding-right:0}
th.fxh small{display:block;font-size:10px;color:var(--faint);letter-spacing:.02em;white-space:nowrap}
.price{font-family:"Archivo Narrow",sans-serif;font-size:15px;width:56px;text-align:right;color:var(--cond)}
.price.mk{color:var(--faint)}
th.bk small{display:block;font-size:10px;color:var(--faint);font-family:"Archivo Narrow",sans-serif;font-variant-numeric:tabular-nums;line-height:1.2}
.price.mk.up{color:var(--pos)} .price.mk.dn{color:var(--neg)}
.price .arw{font-size:10px;margin-right:2px;vertical-align:1px}
.fxl{height:auto;align-items:flex-end}
.fxl span{width:26px;flex:0 0 26px;text-align:center;font-size:9.5px;color:var(--faint);white-space:nowrap;letter-spacing:0}
th.fxh{padding-left:0;padding-right:0;vertical-align:bottom}
.edge{font-family:"Archivo Narrow",sans-serif;font-size:14px;text-align:right;width:52px;color:var(--faint)}
.edge.p{color:var(--pos)} .edge.g{color:var(--neg)}
.detail td{background:var(--panel);padding:14px 16px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px}
.fac{border-top:1px solid var(--rule);padding-top:8px}
.fac .n{color:var(--dim);font-size:11.5px}
.fac .v{font-family:"Archivo Narrow",sans-serif;font-size:20px;font-weight:600;margin-top:1px}
.fac .v.p{color:var(--pos)} .fac .v.g{color:var(--neg)} .fac .v.f{color:var(--faint)} .fac .v.b{color:var(--brass)}
.fac .w{color:var(--faint);font-size:11px}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:4px}
.rhead h2{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:23px;margin:0}
.rhead .meta{color:var(--dim);font-size:13px}
.flag{margin:0 0 14px;padding:10px 13px;background:var(--panel);border-left:2px solid var(--brass);border-radius:0 3px 3px 0;font-size:12.5px;color:var(--dim)}
.flag b{color:var(--brass);font-family:"Archivo Narrow",sans-serif;font-size:14px}
.stop{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:14.5px}
.sname{color:var(--dim);font-size:12px}
.stime{font-family:"Archivo Narrow",sans-serif;font-weight:500;color:var(--brass);font-size:13px;margin-left:4px}
.rhead .meta b.stime{font-size:14px;margin-left:0}
.srow.look td:first-child{box-shadow:inset 3px 0 0 var(--pos)}
.legend{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);color:var(--faint);font-size:12px;display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:1px;margin-right:6px;vertical-align:-1px}
._off{margin-top:20px;color:var(--faint);font-size:12.5px;line-height:1.75;max-width:80ch}
._off b{color:var(--dim);font-weight:600}
._off h3{font-family:"Archivo Narrow",sans-serif;font-size:16px;color:var(--text);margin:18px 0 4px;font-weight:600}
@media(max-width:720px){h1{font-size:28px}.conds{margin-left:0;width:100%}.chip.aux{display:none}.rate{font-size:21px}.fx{width:168px}.fxin{width:135px;gap:10px}.fxb{width:19px;flex-basis:19px}.fxl span{width:19px;flex-basis:19px;font-size:8.5px}.jock{padding-left:0}}
@media(prefers-reduced-motion:no-preference){tbody tr.run,tbody tr.srow{transition:background .12s ease}}
/* status strip */
body{padding-bottom:38px}
.trs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:6px 20px;background:var(--panel);border-top:1px solid var(--rule);color:var(--dim);font-size:12.5px;line-height:1.4}
.trs .dot{width:8px;height:8px;border-radius:50%;background:var(--flat);flex:0 0 8px}
.trs.ok .dot{background:var(--pos)} .trs.prelim .dot{background:var(--brass)} .trs.fail .dot{background:var(--neg)}
.trs b{color:var(--text);font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:13.5px}
.trs .ago{color:var(--faint)}
.trs .m{color:var(--faint);margin-left:auto;display:flex;gap:12px;flex-wrap:wrap}
.trs .m span{white-space:nowrap}
.trs .m i{font-style:normal;color:var(--dim);font-family:"Archivo Narrow",sans-serif;font-variant-numeric:tabular-nums}
.trs .why{color:var(--dim)}
.trs .m i.warn{color:var(--brass)} .trs .m i.bad{color:var(--neg)}
.trs .tag{border:1px solid var(--brass);color:var(--brass);border-radius:2px;font-size:9.5px;font-family:"Archivo Narrow",sans-serif;
  font-weight:600;padding:1px 5px;letter-spacing:.04em;text-transform:uppercase}
.trs.fail .tag{border-color:var(--neg);color:var(--neg)}
.trs .reload{background:var(--brass);color:var(--ink);border:0;border-radius:3px;padding:3px 10px;font:inherit;font-weight:600;
  font-size:12px;cursor:pointer}
.trs .reload:hover{filter:brightness(1.1)}
.trs[hidden]{display:none}
/* pipeline's own banner: shown only if status.json is unreachable, restyled to the page */
#tr-updated{position:fixed!important;left:0!important;right:0!important;bottom:0!important;z-index:50!important;
  font:12.5px/1.4 Inter,system-ui,sans-serif!important;padding:8px 20px!important;background:var(--panel)!important;
  color:var(--dim)!important;border-top:1px solid var(--rule)!important;text-align:left!important}
#tr-updated b{color:var(--text);font-family:"Archivo Narrow",sans-serif;font-weight:600}
#tr-updated+div{display:none}
@media(max-width:720px){.trs{padding:6px 12px;gap:8px 10px}.trs .t{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trs .m{margin-left:0;width:100%;gap:10px}.trs .reload{width:100%}body{padding-bottom:64px}}
</style></head>

  const topR=r.runners[0].rating, lv=liveOf(r);
  r.runners.forEach((x,i)=>{
    const q=mq[x.no], e=q?(x.pct/100)/q:null;
    const lens=(topR-x.rating)/2;
    const ov=x.sp?(x.sp>=x.fair*1.15?' up':(x.sp<=x.fair/1.15?' dn':'')):'';   // overlay: market vs fair
    const isBest=a.best&&a.best.x.no===x.no&&a.best.edge>=1.3;
    h+=`<tr class="run${i===0?' top':''}" tabindex="0" data-i="${i}">
      <td class="tab">${x.no}</td>
      <td><div class="horse">${silk(x)}${x.name}${(()=>{const p=placeOf(lv,x.no);return p===null?'':` <span class="res r${p+1}">${ORD[p]}</span>`;})()}${x.unrated?' <span class="tagu">NO WPR</span>':''}${isBest?' <span class="tagv">VALUE</span>':''}</div>
        <div class="jock">${x.jockey||'jockey TBA'} &nbsp;·&nbsp; ${x.trainer}</div></td>
      <td class="bar an">${x.bar??'—'}</td>
      <td class="l5">${last5(x.last5)}</td>
      <td class="abil${x.unrated?' est':''}">${x.wprbase.toFixed(1)}</td>
      ${fxCell([x.form-(x.cdist||0),x.cdist||0,x.firstup,x.conn,x.cond])}
      <td class="rate key">${x.rating.toFixed(1)}</td>
      <td class="lens key2${i===0?' top':''}">${i===0?'':'−'+lens.toFixed(1)+'L'}</td>
      <td class="price">$${x.fair.toFixed(2)}</td>
      <td class="price mk${ov}">${x.sp?(ov?`<span class="arw">${ov===' up'?'▲':'▼'}</span>`:'')+'$'+x.sp.toFixed(2):'—'}</td></tr>`;
    if(open===i){
      const f=[
        ['WPR baseline', x.wprbase.toFixed(1), x.unrated?'f':'', x.unrated?'field average — no history':'wpr_nett'],
        ['Rated runs', (x.cruns>0?'+':'')+x.cruns.toFixed(2), x.cruns>0?'p':'g', 'exposure'],
        ['Distance', (x.cdist>0?'+':'')+x.cdist.toFixed(2), x.cdist>0?'p':'g', 'shrunk by starts at trip'],
        ['Recent form', (x.crec>0?'+':'')+x.crec.toFixed(2), x.crec>0?'p':'g', x.days===null?'no last start':`last ran ${x.days}d ago`],
        ['Status', x.seg, x.seg==='debut'?'g':(x.seg==='in work'?'':'f'), x.tapply?`trial ${x.tpos} of ${x.tfield}, ${x.tdays}d ago`:'no recent trial used'],
        ['First-up', (x.firstup>0?'+':'')+x.firstup.toFixed(2), Math.abs(x.firstup)<0.03?'f':(x.firstup>0?'p':'g'), x.seg==='debut'?'debut mark-down + trial':'trial result'],
        ['Jockey 180d', x.jsr===null?'—':x.jsr.toFixed(1)+'%', x.jsr===null?'f':(x.jsr>12.2?'p':'g'), 'vs 12.2% average'],
        ['Trainer 180d', x.tsr===null?'—':x.tsr.toFixed(1)+'%', x.tsr===null?'f':(x.tsr>12.8?'p':'g'), 'vs 12.8% average'],
        ['Conditions', ((x.cond??0)>0?'+':'')+(x.cond??0).toFixed(2), Math.abs(x.cond??0)<0.03?'f':((x.cond??0)>0?'p':'g'),
          x.condc?`on ${SURF[r.surf_now||r.surf]||'—'}: dry ${x.condc.dry>0?'+':''}${x.condc.dry.toFixed(1)} · soft ${x.condc.soft>0?'+':''}${x.condc.soft.toFixed(1)} · wet ${x.condc.wet>0?'+':''}${x.condc.wet.toFixed(1)} · synth ${x.condc.synth>0?'+':''}${x.condc.synth.toFixed(1)}`:'no surface history'],
        ['Adjusted', x.rating.toFixed(1), 'b', `${x.wprbase.toFixed(1)} ${x.form>0?'+':'−'}${Math.abs(x.form).toFixed(2)} ${x.firstup>0?'+':'−'}${Math.abs(x.firstup).toFixed(2)} ${x.conn>0?'+':'−'}${Math.abs(x.conn).toFixed(2)} ${(x.cond??0)>0?'+':'−'}${Math.abs(x.cond??0).toFixed(2)}`]
      ];
      h+=`<tr class="detail"><td colspan="10"><div class="grid">`+f.map(([n,v,c,w])=>`<div class="fac"><div class="n">${n}</div><div class="v ${c}">${v}</div><div class="w">${w}</div></div>`).join("")+`</div></td></tr>`;
    }
  });
  $("race").innerHTML=h+"</tbody></table></div>";
  document.querySelectorAll("tr.run").forEach(tr=>{
    const go=()=>{const i=+tr.dataset.i; open=open===i?null:i; draw();};
    tr.onclick=go; tr.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};
  });
}

function draw(){
  drawDays(); drawMeets();
  const races=M().races;
  $("tabs").innerHTML=`<button role="tab" class="sum" aria-selected="${active===-1}" onclick="pick(-1)"><span class="rn">Summary</span><span class="rt">&nbsp;</span><span class="cd">&nbsp;</span></button>`+
    races.map((r,i)=>`<button role="tab" aria-selected="${i===active}" onclick="pick(${i})"><span class="rn">R${r.no}</span><span class="rt">${r.time||'&nbsp;'}</span><span class="cd" data-t="${r.start_utc||''}" data-k="${M().track}|${r.no}">&nbsp;</span></button>`).join("");
  if(active===-1) drawSummary(); else drawRace();
  countdown();
}

function countdown(){
  const now=Date.now();
  document.querySelectorAll("nav .cd[data-t]").forEach(el=>{
    const lv=LIVE[el.dataset.k]; const st=lv&&lv.status;
    if(st&&st!=='Normal'){ const m={Closed:['closed','soon'],Interim:['interim','soon'],Paying:['paying','gone'],Abandoned:['abnd','gone']}[st];
      if(m){el.textContent=m[0]; el.className='cd '+m[1]+' st'; return;} }
    const t=el.dataset.t; if(!t){el.innerHTML="&nbsp;";return;}
    let s=Math.round((new Date(t).getTime()-now)/1000), cls="";
    let txt;
    if(s<=-1800){txt="ran";cls="gone";}
    else if(s<=0){txt="jumping";cls="soon";}
    else if(s>=86400){txt=Math.floor(s/86400)+"d";}
    else if(s>=3600){txt=Math.floor(s/3600)+"h "+Math.floor((s%3600)/60)+"m";}
    else{txt=Math.max(1,Math.ceil(s/60))+"m";cls="soon";}
    el.textContent=txt; el.className="cd"+(cls?" "+cls:"");
  });
}
setInterval(countdown,30000);
window.pick=i=>{active=i;open=null;draw();};
window.pickMeet=i=>{meet=i;active=-1;open=null;draw();$("tabs").scrollIntoView({behavior:'smooth',block:'nearest'});};
window.pickDay=i=>{day=i;meet=0;active=-1;open=null;draw();};
draw();

// ---- live overlay: reads live.json beside the page, polls every 60 s -------
(function(){
  let last='';
  async function tick(){
    let j; try{const r=await fetch('live.json',{cache:'no-store'}); if(!r.ok) throw 0; j=await r.json();}catch(e){return;}
    const races=j&&j.races||{}; const sig=JSON.stringify(races); if(sig===last) return;
    last=sig; window.LIVE=races; draw();
  }
  tick(); setInterval(tick,60000); window._liveTick=tick;
})();

// ---- status strip: reads status.json beside the page, polls every 60 s ----
(function(){
  const el=$("trs"); if(!el) return;
  let seen=null, pageStamp=null;   // pageStamp = 'Fri 04 Sep 23:21' from the injected banner
  const asDate=s=>{if(!s) return null; const d=new Date(s.length<=19?s+(s.includes('T')?'':'T00:00:00'):s); return isNaN(d)?null:d;};
  const hm=d=>d?d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:false}):'—';
  const wd=d=>d?d.toLocaleDateString('en-AU',{weekday:'short'}):'';
  const ago=d=>{if(!d) return ''; const m=Math.round((Date.now()-d)/60000);
    return m<1?'just now':m<60?`${m}m ago`:m<1440?`${Math.floor(m/60)}h ${m%60}m ago`:`${Math.floor(m/1440)}d ago`;};
  async function tick(){
    let j;
    try{const r=await fetch('status.json',{cache:'no-store'}); if(!r.ok) throw 0; j=await r.json();}
    catch(e){ return; }                                   // leave the injected banner as-is
    const old=document.getElementById('tr-updated');
    if(old){ pageStamp=(old.querySelector('b')||{}).textContent||null;
      if(old.nextElementSibling&&old.nextElementSibling.style.height) old.nextElementSibling.remove(); old.remove(); }
    const failed=j.status&&j.status!=='ok';
    const fin=asDate(j.finished||j.started), ext=asDate(j.extract);
    if(!RATED&&fin&&!failed){ RATED=fin; drawMeets(); }
    const rs=j.rider_share, prelim=!!j.preliminary||(rs!=null&&rs<0.6);
    const state=failed?'fail':(prelim?'prelim':'ok');
    const sameDay=fin&&new Date().toDateString()===fin.toDateString();
    const stamp=fin?`${wd(fin)} ${String(fin.getDate()).padStart(2,'0')} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][fin.getMonth()]} ${hm(fin)}`:null;
    let h=`<span class="dot"></span>
      <span class="t">${failed?'Last run <b>failed</b>':'Rated'} <b>${sameDay?'':wd(fin)+' '}${hm(fin)}</b> <span class="ago">${ago(fin)}</span>${j.reason?` · <span class="why">${j.reason}</span>`:''}</span>`;
    if(prelim&&!failed) h+=`<span class="tag" title="rider share below 60% — connections are unreliable until riders are declared">preliminary</span>`;
    if(failed) h+=`<span class="tag" title="${(j.error||'').replace(/"/g,'&quot;')}">${/publish/i.test(j.error||'')?'publish failed':'rating failed'}</span>`;
    const m=[];
    if(j.acceptors!=null) m.push(`<span><i>${j.acceptors}</i> acceptors</span>`);
    if(rs!=null) m.push(`<span>riders <i class="${rs<0.6?'bad':(rs<0.9?'warn':'')}">${Math.round(rs*100)}%</i></span>`);
    if(j.scratchings!=null) m.push(`<span><i>${j.scratchings}</i> scr</span>`);
    if(ext) m.push(`<span>extract <i>${hm(ext)}</i></span>`);
    h+=`<span class="m">${m.join('')}</span>`;
    // newer rating than this page?  (status.json changed since first poll, or page banner stamp differs from status)
    const stale=!failed&&((seen&&j.finished&&j.finished!==seen)||(pageStamp&&stamp&&pageStamp!==stamp&&fin>new Date(pageStamp.replace(/^[A-Za-z]+ /,'')+' '+fin.getFullYear())));
    if(stale) h+=`<button class="reload" onclick="location.reload()">Re-rated ${hm(fin)} — reload</button>`;
    if(!seen) seen=j.finished||null;
    el.className='trs '+state; el.innerHTML=h; el.hidden=false;
    document.body.style.paddingBottom=(el.offsetHeight+6)+'px';
  }
  function readBanner(){
    const old=document.getElementById('tr-updated'); if(!old) return;
    pageStamp=(old.querySelector('b')||{}).textContent||null;
    if(pageStamp){ const y=(DATA.days&&DATA.days[0]&&DATA.days[0].date||'').slice(0,4)||new Date().getFullYear();
      const d=new Date(pageStamp.replace(/^[A-Za-z]+ /,'')+' '+y); if(!isNaN(d)){ RATED=d; drawMeets(); } }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>{readBanner();tick();});
  else {readBanner();tick();}
  setInterval(tick,60000); window._trsTick=tick;
})();
</script><div id="tr-updated" style="position:fixed;left:0;right:0;bottom:0;z-index:9999;font:12.5px/1.4 system-ui,sans-serif;padding:6px 12px;background:#111;color:#ddd;border-top:2px solid #2e7d32;text-align:center">Rated <b>Sat 05 Sep 15:49</b> AEST &middot; Hawkesbury scratched R6 #8/11</div><div style="height:34px"></div></body></html>
