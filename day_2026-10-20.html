<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- the home-screen tile and the browser tab: SPM, Simon's Punting Model.  Built and pushed
     by dash_icon.py; without the manifest Chrome can only make a badged bookmark shortcut. -->
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#006DA6">
<meta name="application-name" content="SPM">
<meta name="apple-mobile-web-app-title" content="SPM">
<title>SPM — week</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  /* SPM palette, blue (Simon, 3 Nov 2026: "more blue ... blue, light blue, grey ... no pink or purple", from the
     Racing Victoria style guide: RV blue #006DA6, process blue #0085CA, cool grey #6D6E71). The token names keep
     their old colour words so nothing else moves: --green is the brand blue, --brass the deep blue-grey accent,
     --warm the cool grey fill. Red stays for negatives only. Before 3 Nov: dark green #005C42 / brown #592414. */
  --green:#006DA6; --green2:#0085CA; --brown:#2E5570; --warm:#D9DCE0; --brick:#A52210;
  --sblue:#9CD3F0; --dblue:#003F6B; --syellow:#FCE070; --teal:#4FA3D1; --porange:#8FA3B5;
  --keyrgb:0,133,202;   /* the rating column's tint, rgba(var(--keyrgb),a) */
  --ink:#F2F4F6; --panel:#FFFFFF; --panel2:#E4E7EA; --rule:#D0D4D8;
  --text:#1A2733; --dim:#4E5A66; --faint:#868C92;
  --hk:#4E5A66; --hkbg:#EEF1F4;
  --pos:#006DA6; --neg:#A52210; --amber:#B8741A; --brass:#2E5570; --flat:#D9DCE0; --cond:#003F6B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:Gotham,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.an{font-family:"Archivo Narrow",Arial Narrow,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1480px;margin:0 auto;padding:18px 20px 60px}
header{border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:10px}
.meet{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:34px;letter-spacing:-.01em;margin:0;line-height:1}
.brand{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:21px;line-height:1;color:var(--text);align-self:baseline;padding-right:11px;border-right:1px solid var(--rule);white-space:nowrap}
.brand .d{color:var(--brass)}
.date{color:var(--dim);font-size:14px}
.conds{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-self:center}

.daysrow{display:flex;align-items:stretch;border-bottom:1px solid var(--rule);margin-bottom:14px}
.days{display:flex;gap:0;overflow-x:auto;flex:1 1 auto;min-width:0}
.days button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:var(--dim);padding:8px 14px 9px;cursor:pointer;font-family:inherit;text-align:left;white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.days button .d{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:17px;color:inherit}
.days button .s{font-size:11px;color:var(--faint)}
.days button:hover{color:var(--text)}
.days button[aria-selected=true]{color:var(--text);border-bottom-color:var(--brass)}
.days button[aria-selected=true] .s{color:var(--dim)}
.days button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
/* earlier days (Simon, 4 Nov 2026): a date picker on the right of the days bar opens that day's page, day_<date>.html, the
   page as it was last rated that day with the day's closing prices and results frozen beside it (dash_history.py) */
.hist{display:flex;align-items:center;gap:8px;padding:4px 0 4px 12px;margin-left:auto;flex:0 0 auto;white-space:nowrap}
.hist label{color:var(--dim);font-size:11.5px}
.hist input{font-family:inherit;font-size:12.5px;color:var(--text);background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:3px 6px}
.hist .hmsg{color:var(--brick);font-size:11.5px}
.hist a{color:var(--green);font-size:12.5px;font-weight:600;text-decoration:none}.hist a:hover{text-decoration:underline}
.pastbar{background:#FFF4D6;border:1px solid #E8C96A;border-radius:4px;padding:8px 12px;margin:0 0 12px;font-size:13px;color:#5a4a1a;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.pastbar b{font-weight:700}.pastbar a{color:var(--green);font-weight:600;text-decoration:none;margin-left:auto}.pastbar a:hover{text-decoration:underline}
/* find a horse (Simon, 4 Nov 2026): the search box in the header reads hidx/<letter>.json as the name is typed and opens
   h/<id>.json, the same form guide as the runner's panel, built for every horse in the archive (horsecard.py) */
.hs{position:relative;flex:0 1 240px;min-width:150px}
.hs input{width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:5px 9px}
.hs input::placeholder{color:var(--faint)}
.hsres{position:absolute;top:calc(100% + 3px);left:0;width:max(100%,340px);z-index:65;background:var(--panel);border:1px solid var(--rule);border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-height:min(60vh,420px);overflow:auto;min-width:260px}
.hsres button{display:block;width:100%;background:none;border:0;border-top:1px solid var(--panel2);color:var(--text);font-family:inherit;font-size:13px;text-align:left;padding:6px 10px;cursor:pointer}
.hsres button:first-child{border-top:0}.hsres button:hover,.hsres button.on{background:var(--warm)}
.hsres button b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hsres button .s{display:block;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsres .hsmsg{color:var(--faint);font-size:12.5px;padding:8px 10px}
.hpan{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45);overflow:auto;padding:28px 12px 60px}
.hpan .hpi{background:var(--bg,#fff);max-width:1400px;margin:0 auto;border-radius:6px;padding:12px 14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.hpan .hph{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:8px}
.hpan .hph h2{font-family:Gotham,"Archivo Narrow",sans-serif;font-size:22px;font-weight:600;margin:0}
.hpan .hph .m{color:var(--dim);font-size:12.5px}.hpan .hph .l20{font-family:"Archivo Narrow",sans-serif;letter-spacing:.08em;font-size:13px}
.hpan .hph .l20 b{color:var(--green)}.hpan .hph .l20 i{color:var(--faint);font-style:normal}
.hpan .hpx{margin-left:auto;background:none;border:0;color:var(--faint);cursor:pointer;font-family:inherit;font-size:18px;line-height:1;padding:2px 6px}.hpan .hpx:hover{color:var(--text)}
.hpan .fcp{width:auto;min-width:0}
@media(max-width:720px){.hs{flex:1 1 100%;order:-1}.hpan{padding:10px 6px 60px}.hpan .hpi{padding:10px 8px 14px}.hist{padding-left:8px}.hist label{display:none}}

.mtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.mtabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--rule);border-radius:3px;color:var(--dim);padding:8px 13px;cursor:pointer;white-space:nowrap;text-align:left;font-family:inherit;font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:118px}
.mtabs button:hover{border-color:var(--dim);color:var(--text)}
.mtabs button[aria-selected=true]{border-color:var(--brass);background:var(--panel2);color:var(--text)}
.mtabs button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.mtabs .tk{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:14.5px}
.mtabs .sb{color:var(--faint);font-size:10.5px;display:flex;gap:7px}
.mtabs .sb .w{color:var(--cond)}

nav{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--rule)}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:8px 13px 7px;cursor:pointer;font-family:"Archivo Narrow",sans-serif;font-size:15px;font-weight:600;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
nav button .rt{font-size:11.5px;font-weight:500;color:var(--faint)}
nav button[aria-selected=true] .rt{color:var(--brass)}
nav button .cd{font-size:11px;font-weight:600;color:var(--pos);font-variant-numeric:tabular-nums}
nav button .cd.soon{color:var(--brass)}
nav button .cd.gone{color:var(--faint);font-weight:500}
nav button:hover{color:var(--text)}
nav button[aria-selected=true]{color:var(--text);border-bottom-color:var(--brass)}
nav button.sum{color:var(--brass)}
nav button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}

.mnote{margin:0 0 14px;padding:9px 13px;border-left:3px solid var(--cond);background:var(--panel);color:var(--dim);font-size:12.5px;line-height:1.5}
.surf{background:var(--panel2);color:var(--text);border:1px solid var(--brass);border-radius:3px;padding:2px 6px;font:inherit;font-size:12.5px}
.surfall{background:none;color:var(--dim);border:1px solid var(--rule);border-radius:3px;padding:2px 8px;font:inherit;font-size:12px;cursor:pointer;margin-left:4px}
.surfall:hover{color:var(--text);border-color:var(--brass)}
.rerated{color:var(--cond);font-size:12px;margin-left:6px}
.mgo{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:-8px 0 14px;font-size:12.5px}
.mgo label{display:flex;align-items:center;gap:6px}.mgo .lbl{color:var(--faint);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.mwx{color:var(--dim);gap:2px 10px}.mgo+.mwx{margin-top:-10px}.mwx b{color:var(--text);font-weight:600}.mwx .src{color:var(--faint);font-size:11px}
.rhead .meta .wxr{white-space:nowrap;cursor:pointer;text-decoration:underline dotted var(--faint);text-underline-offset:3px}
.mwx{cursor:pointer;border-radius:4px}.mwx:hover,.mwx:focus-visible{background:var(--panel2);outline:none}.mwx .more{color:var(--green);font-weight:600;font-size:12px}
dialog.wxpop{border:0;border-radius:8px;padding:0;width:min(720px,96vw);max-height:92vh;overflow:hidden;background:var(--panel);color:var(--text);box-shadow:0 12px 40px rgba(0,0,0,.35)}
dialog.wxpop::backdrop{background:rgba(22,33,28,.45)}
.wxpop .wxh{display:flex;align-items:baseline;gap:10px;padding:14px 16px 6px;border-bottom:1px solid var(--rule)}
.wxpop .wxh h3{margin:0;font-size:18px;text-transform:uppercase;letter-spacing:.03em;color:var(--green)}
.wxpop .wxh .sub{color:var(--faint);font-size:11.5px;flex:1}
.wxpop .wxx{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--dim);padding:0 4px}
.wxpop .wxb{padding:10px 16px 14px;overflow:auto;max-height:calc(92vh - 52px)}
.wxpop table{border-collapse:collapse;width:100%;font-size:12.5px;margin-bottom:12px}
.wxpop th{color:var(--faint);font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:3px 6px;border-bottom:1px solid var(--rule)}
.wxpop td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel2);white-space:nowrap}
.wxpop th:first-child,.wxpop td:first-child,.wxpop th:nth-child(2),.wxpop td:nth-child(2){text-align:left}
.wxpop tr.nx td{background:rgba(var(--keyrgb),.14);font-weight:600}.wxpop tr.gone td{color:var(--faint)}
.wxpop .arr{display:inline-block;width:12px;text-align:center;color:var(--green)}
.wxpop .hd{color:var(--neg)}.wxpop .tl{color:var(--pos)}
.wxpop .seg{display:flex;gap:4px;margin:4px 0 6px;flex-wrap:wrap}
.wxpop .seg button{border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text)}
.wxpop .seg button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.wxpop iframe{width:100%;height:min(420px,55vh);border:0;border-radius:6px;background:var(--panel2)}
.wxpop .lnk{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:8px}.wxpop .lnk a{color:var(--green)}
.wxpop .note{color:var(--faint);font-size:11px;margin-top:8px}
@media(max-width:560px){.wxpop .wxh{padding:12px 12px 6px}.wxpop .wxb{padding:8px 10px 12px}.wxpop td,.wxpop th{padding:3px 3px}.wxpop .c-st{display:none}}
.mgo .rerated{margin-left:0}.mgo .surfall{margin-left:0}.mgo .gonote{color:var(--faint);font-size:11.5px;flex-basis:100%}
.rnote{margin:0 0 14px;padding:10px 13px;border-left:3px solid var(--brass);background:var(--panel);color:var(--text);font-size:13px;line-height:1.5}
.rnote b{color:var(--brass);font-family:"Archivo Narrow",sans-serif;font-size:14px}
/* item 47, the head-to-head cue: the market's top two have met each other before. Display only --
   gating the RATING to these races was tested 17 Sep and is worse on all five tests. */
.h2hc{margin:0 0 14px;padding:10px 13px;border-left:3px solid var(--cond);background:var(--panel);color:var(--text);font-size:13px;line-height:1.5}
.h2hc b.lbl{color:var(--cond);font-family:"Archivo Narrow",sans-serif;font-size:14px}
.h2hc .beat{font-weight:600}
.h2hc .upset{color:var(--neg);font-weight:600}
.h2hc .swing{color:var(--brass)}   /* not .sw: that is the legend's 10px swatch, and the swing wrapped one word a line inside it (20 Sep 2026) */
.h2hc .fv{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:400;vertical-align:.35em;margin-left:2px}
.h2hc .qual{color:var(--dim)}
/* the quaddie selector (19 Oct 2026): on each leg's race page, one line for each quaddie it is in, opening to
   the ticket; green edge for a bet, grey for a sit-out */
.quads{margin:0 0 14px}
.quad{padding:7px 13px;border-left:3px solid var(--pos);background:var(--panel);color:var(--text);font-size:13px;line-height:1.5}
.quad+.quad{margin-top:4px}
.quad.no{border-left-color:var(--flat)}
.quad summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.quad summary::-webkit-details-marker{display:none}
.quad summary::before{content:"\25B8";color:var(--faint);font-size:11px;width:9px}
.quad[open] summary::before{content:"\25BE"}
.quad b.lbl{font-family:"Archivo Narrow",sans-serif;font-size:14px}
.quad .vd{margin-left:auto;font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em}   /* the verdict at the bar's right-hand end (Simon) */
.quad .vd.y{color:var(--pos)} .quad .vd.n{color:var(--faint)}
.quad table{width:auto;min-width:0;border-collapse:collapse;margin:6px 0 4px 19px;font-variant-numeric:tabular-nums}
.quad tr,.quad td{border:0} .quad td{padding:1px 12px 1px 0;vertical-align:top}
.quad td.lg{color:var(--dim);white-space:nowrap} .quad td.cv{color:var(--faint);white-space:nowrap}
.quad tr.here td{color:var(--text)} .quad tr.here td.lg{font-weight:600}
.quad .sm{color:var(--dim);font-size:12px} .quad .ft{margin-left:19px}
.quad .tie{color:var(--brass);font-weight:600}   /* runners in by the tie rule (19 Oct 2026) */



.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font-weight:500;font-size:11.5px;color:var(--faint);padding:0 8px 7px;border-bottom:1px solid var(--rule);line-height:1.25;vertical-align:bottom}
th.r{text-align:right}
tbody tr{border-bottom:1px solid var(--panel2)}
td{padding:9px 8px;vertical-align:middle}
tbody tr.run,tbody tr.srow{cursor:pointer}
tbody tr.run:hover,tbody tr.srow:hover{background:var(--panel)}
tbody tr.run:focus-visible,tbody tr.srow:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.tab{font-family:"Archivo Narrow",sans-serif;font-weight:600;color:var(--dim);font-size:15px;width:30px}
.silk{width:26px;height:26px;border-radius:2px;background:var(--panel2);flex:0 0 26px;object-fit:contain}
.silk.ph{display:inline-block}
.horse{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:9px}
.jock{color:var(--dim);font-size:12.5px;margin-top:1px;padding-left:35px}
.res{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:10.5px;border-radius:2px;padding:1px 5px;letter-spacing:.03em;white-space:nowrap;line-height:1.3}
.res.r1{background:var(--brass);color:var(--ink)}
.res.r2,.res.r3,.res.r4{border:1px solid var(--dim);color:var(--dim)}
.replay{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--cond);color:var(--cond);
  border-radius:3px;padding:4px 11px;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.replay span{font-size:10px}
.replay:hover{background:var(--cond);color:var(--ink)}
@media(max-width:720px){.replay{margin-left:0}}
nav button .cd.st{text-transform:uppercase;letter-spacing:.04em;font-size:10px}
/* the first-starter chips (Simon, 20 Sep 2026): the spelled-out tag was too wide for the
   last-5 cell and spilled over the Adjusted column on a phone. Two circles instead -- T for
   the trial read, $ for the market. No word alongside them: the last-five tokens already show
   a horse with no starts, and anything spelled out next to finishing positions was read as one
   (Simon, 20 Sep 2026). A circle with nothing behind it is left off entirely. */
.dcir{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;box-sizing:border-box;
  font-family:"Archivo Narrow",sans-serif;font-size:10.5px;font-weight:700;line-height:1;color:var(--panel)}
.dcir.g{background:var(--pos)} .dcir.o{background:var(--amber)} .dcir.r{background:var(--neg)}
.l5:has(.dcir){flex-wrap:wrap;display:flex;letter-spacing:0;gap:3px 5px;align-items:center}
.tagu{border:1px solid var(--brass);color:var(--brass);border-radius:2px;font-size:9.5px;font-family:"Archivo Narrow",sans-serif;font-weight:600;padding:1px 4px;letter-spacing:.03em;white-space:nowrap}
.tagv.gold{border-color:var(--brass);color:var(--brass)}
.tagv{border:1px solid var(--pos);color:var(--pos);border-radius:2px;font-size:9.5px;font-family:"Archivo Narrow",sans-serif;font-weight:600;padding:1px 4px;white-space:nowrap}
.bar{color:var(--dim);font-size:13px;width:44px}
.wtc{color:var(--dim);font-size:13px;width:40px;white-space:nowrap;cursor:default} .wth{white-space:nowrap}   /* the Wt column, 2 Nov 2026 */
.slh,.slc{text-align:center;width:30px;padding-left:2px;padding-right:2px}
.slm{display:inline-block;width:19px;height:19px;line-height:19px;border-radius:50%;font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:13px;text-align:center;cursor:help}
.slm.red{background:var(--neg);color:#fff}
.slm.green{background:var(--pos);color:#fff}
.slnote{margin:0 0 10px;font-size:12.5px;color:var(--dim);display:flex;gap:8px;align-items:flex-start}
.slnote .slm{flex:0 0 auto;cursor:default}
.slin{display:none;margin-left:5px;vertical-align:1px}
.l5{font-family:"Archivo Narrow",sans-serif;font-size:15px;letter-spacing:.14em;color:var(--dim);white-space:nowrap;width:86px;font-variant-numeric:tabular-nums}
.l5 b{color:var(--text);font-weight:600}
.l5 i{font-style:normal;color:var(--faint)}
.l5 .none{color:var(--faint);letter-spacing:0}
.l5{width:136px}
.l5:has(.l5b){letter-spacing:0;display:flex;flex-wrap:nowrap;align-items:flex-start;gap:2px 5px}
/* last-5 tokens: bare numbers, no box. A small play mark sits under any start that
   has a replay. Colour says one thing only: --text for a real race, --dim for a trial
   or jump-out. A win is not singled out here -- the placing digit already says it, and
   .w stays on the element as a hook if that ever changes. */
.l5b{display:inline-flex;flex-direction:column;align-items:center;flex:0 0 auto;
  color:var(--text);font-size:14.5px;font-weight:600;line-height:1.05;text-decoration:none;
  font-variant-numeric:tabular-nums}
.l5b.jo{color:var(--dim);font-weight:500}
/* the mark reserves its box on every token, so the numbers stay on one baseline
   whether or not there is a replay; only a link paints the triangle in */
.l5b:after{content:"";display:block;margin-top:3px;width:0;height:0;
  border-left:5px solid transparent;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
a.l5b:after{border-left-color:currentColor;opacity:.7}
a.l5b:hover,a.l5b:focus{color:var(--brass);outline:none}
a.l5b:hover:after,a.l5b:focus:after{opacity:1}
.l5 em{font-style:normal;color:var(--faint);font-size:12px;line-height:1.05;align-self:flex-start}
.mtabs button.today{border-color:var(--brass);border-style:dashed}
.mtabs button.today[aria-selected=true]{border-style:solid}

/* the settle picture (Simon, 29 Sep 2026; the Manikato mock-up he signed off): the race seen from the stand, the rail
   along the bottom, the leader at the left, each column two lengths further back, each row up one lane wider. A horse
   sits in its single likeliest spot; the table under it gives the chances. */
.stb{display:grid;grid-template-columns:52px repeat(6,minmax(0,1fr));gap:0;position:relative}
.stb .hd{font-family:"Archivo Narrow",sans-serif;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
         text-align:center;padding-bottom:5px;border-bottom:1px solid var(--rule);margin-bottom:4px;line-height:1.2}

.stb .ln{font-family:"Archivo Narrow",sans-serif;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
         display:flex;align-items:center;justify-content:flex-end;padding-right:7px;text-align:right;line-height:1.15}
.stb .cell{border-left:1px dashed var(--rule);padding:3px 3px;display:flex;flex-direction:column;gap:3px;justify-content:flex-end;min-height:30px}
.stb .cell.f{background:rgba(var(--keyrgb),.06)}
.stb .smc{padding:2px 4px 2px 3px}
.stb .smc.wd{border-left-color:var(--neg)}
.stb .smc.mv{box-shadow:inset 0 0 0 2px var(--brass)}   /* moved by Simon on settle.html (usermap.py) */
.strail{grid-column:2 / span 6;height:6px;margin-top:3px;background:linear-gradient(90deg,var(--brass),rgba(var(--keyrgb),.28));border-radius:1px}
.strl{grid-column:1;font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;text-align:right;padding-right:7px;align-self:center}
.sttab{width:100%;border-collapse:collapse;margin-top:12px;font-size:11.5px;font-variant-numeric:tabular-nums}
.sttab th{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
          text-align:right;padding:3px 6px;border-bottom:1px solid var(--rule)}
.sttab th:nth-child(2),.sttab td:nth-child(2){text-align:left}
.sttab td{padding:3px 6px;text-align:right;color:var(--dim);border-bottom:1px solid var(--rule)}
.sttab td:nth-child(2){color:var(--text)}

.stb .smc{cursor:pointer} .stb .smc.on{outline:2px solid var(--text);outline-offset:-1px}

.stsel{margin:0 0 8px;font-size:12px;color:var(--dim)} .stsel b{color:var(--text)} .stsel a{color:var(--brass)}

/* Inline replay dock.  Sky race replays are plain MP4s on mediatabs.skyracing.com.au
   and play in a <video>; racing.com jump-outs are Brightcove player pages and need the
   iframe.  The dock sits outside #race on purpose: the live feed rebuilds that element

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- narrow screens -------------------------------------------------------
   The field table IS the page: reading a race means comparing a column straight
   down the field, so a phone drops columns rather than re-flowing each runner
   into a card. Nothing dropped is lost -- base, every adjustment and the total
   are all in the opened row, one tap away. Order of sacrifice, least useful
   first: the barrier, then the silks (Base and the net Adjust left the table
   at every width on 19 Oct 2026; both are in the opened row). Tab number, runner, last 5, adjusted rating,
   LENGTHS, our price and the market survive to the narrowest width.
   Simon, 19 Sep 2026, on the phone: "just the adjusted and Lengths is most
   important" -- so Lengths keeps its place beside Adjusted and Base gives way
   instead, and the gold key band still closes around the pair. */

  table{min-width:640px}

}

  .sumtab th:nth-child(2),.sumtab td:nth-child(2),
  .sumtab th:nth-child(8),.sumtab td:nth-child(8){display:none}
  .daytab th:nth-child(1),.daytab td:nth-child(1){display:none}
  .horse{flex-wrap:wrap;gap:3px 8px;min-width:0}
  .detail td{padding:12px 10px 14px}
  .rhead h2{font-size:20px}

     narrow strip and left the rest of the row blank. Under the name instead, full width. */
  .rhead{gap:4px 12px}
  .rhead .meta{flex:1 1 100%}
  .adjsum b{font-size:16px}

  .rtab th.key2,.rtab td.key2{display:none}

  .rtab td.key,.rtab th.key{box-shadow:inset 1px 0 0 rgba(var(--keyrgb),.42),inset -1px 0 0 rgba(var(--keyrgb),.42)}

const ADJ=['lrn','form','firstup','conn','cfm','ven','cond','bar_adj','shape','settle','spell','arc','track','speed','boost','plc','best','stab','sire','pxm','debmkt','cons','pz3'];   // 'boost' = the factors combined, item 59, 14 Oct 2026   // 'settle' = the settle map, 27 Sep 2026
function reprice(r,k){

  priceAt(r,k);
}
function priceAt(r,k){                               // the chances and fair prices off the ratings as they stand
  const mean=r.runners.reduce((a,x)=>a+x.rating,0)/r.runners.length;
  const e=r.runners.map(x=>Math.exp(k*(x.pslope??1)*(x.rating-mean))); const z=e.reduce((a,b)=>a+b,0);
  r.runners.forEach((x,i)=>{x.pct=+(100*e[i]/z).toFixed(1); x.fair=+(z/e[i]).toFixed(2);});
  r.runners.sort((a,b)=>b.rating-a.rating);
}
// Debutants take the market into the rating (Simon 15 Sep 2026, items 17 and 18). A debutant with a TAB price, in a race three
// quarters priced, adds debut.with_price.mk_pts per unit of -log price against the priced runners' mean, and its debut point and
// stable weight switch to the priced set; otherwise the unpriced set. live.json lists priced runners only, so a scratched runner
// simply drops out of the mean. Re-read on every live.json poll, the same rule rate_day.py applies at 03:00.
// First starters: what a debutant's estimate is made of, as two circles (Simon, 18 Sep 2026 for
// the reads themselves, 20 Sep for the chips -- the words did not fit the cell).
//   T  the most recent trial or jump-out inside the window, the same event the rating's trial term
//      reads (tpos of tfield). Green = won it, or ran second in a field of five or more; amber =
//      the front half; red = the back half.
//   $  debmkt is the debutant price term, re-read on every live poll: positive when the horse is
//      shorter than the priced field's mean price. Green needs two points of it, about a fifth
//      shorter than that mean, so a debutant priced with the pack is not called supported.
// A circle with nothing behind it is left off rather than drawn in a third colour (Simon, 20 Sep):
// no trial in the window, or a race not yet priced, is an absence, not a mark against the horse.
function debutChips(x){
  let h='';

    const rf=(x.tpos-1)/(x.tfield-1);
    h+=`<span class="dcir ${rf<=0.25?'g':rf<=0.6?'o':'r'}">T</span>`;
  }
  if(x.sp>1&&x.debmkt!==0) h+=`<span class="dcir ${x.debmkt>=2?'g':'r'}">$</span>`;
  return h;
}
function debutPrice(r,d){
  if(!d.debut||!r.runners.some(x=>x.dfu)) return;
  const pr=r.runners.filter(x=>x.sp>1); const ok=pr.length>=0.75*r.runners.length;
  const mean=ok?pr.reduce((a,x)=>a-Math.log(x.sp),0)/pr.length:0;
  // Only what moved goes onto the box's rating (25 Oct 2026). Re-summing ADJ put the settle map in twice (a saved map's change
  // rides in settle and rating alike), and the card's firstup is not dfu's value as it stands, so the swap is made as a shift
  // off the box's own figures: dfu / dcx's priced-less-unpriced gap, only when the runner has crossed between the two sets.
  r.runners.forEach(x=>{ if(!x.dfu) return; const on=ok&&x.sp>1, was=(x.firstup||0)+(x.conn||0)+(x.debmkt||0);
    if(!x._d0) x._d0={fu:x.firstup||0, cn:x.conn||0, on:(x.debmkt||0)!==0};   // as rated: a debmkt means the priced set
    const sw=(on?1:0)-(x._d0.on?1:0);
    x.firstup=+(x._d0.fu+sw*(x.dfu.wp-x.dfu.np)).toFixed(2); x.conn=+(x._d0.cn+sw*(x.dcx.wp-x.dcx.np)).toFixed(2);
    x.debmkt=on?+(d.debut.with_price.mk_pts*(-Math.log(x.sp)-mean)).toFixed(2):0;
    x.rating=+(x.rating+x.firstup+x.conn+x.debmkt-was).toFixed(2); });
  priceAt(r,d.k);
}

// The learned base and the settle map also read going and stay as rated on the posted going until the box re-rates.

function goCls(g){

  if(/^(good|firm|fast)/i.test(g)) return 'dry';

function goBack(r){ if(!r._g0) return;

  return {T:x.T[i],ws:x.ws[i],wd:x.wd[i],wg:x.wg[i],past:rain(f-2,f),next:rain(f+1,f+3),hd,tw:x.tw};

// the clock columns (30 Oct 2026, Simon: "the merit of the performance against the clock, early, middle, late, vs standard

// meeting's clock taken out (formcard.py, from the nightly IVR table), the number in the cell; q.cf = the same three sections
// against the field average in that race, which only colours the cell (a length or more either way) and sits in the hover
// with the field's own figure against standard. Blank on trials and untimed runs.
const CKT='The clock on the class scale, in lengths: the run against the standard for the track and trip (the clock of the day taken out), less the par a winner posts in the race grade, plus the grade rung on the ladder fitted from horses that ran in two grades. Zero on a BM60 is a winning run there; a BM78 run reads about three lengths higher for the same clock. Early to the 800, mid 800-400, late 400-post, Net the whole run. Green: a length or more quicker than the field average in that section; red: a length or more slower. Grey italic: a race type with no grade par, the raw clock.';
const CKL=['early, to the 800','mid, 800-400','late, 400-post','the whole run'];
function ckCells(q){
  if(!Array.isArray(q.ck)||q.ck.length!==4) return '<td></td><td></td><td></td><td></td>';
  const sg=v=>(v>0?'+':'')+v.toFixed(1), cs=Array.isArray(q.cs)&&q.cs.length===4?q.cs:null;
  return q.ck.map((v,i)=>{
    const f=(i<3&&Array.isArray(q.cf))?q.cf[i]:null, cls=(f==null?'':(f>=1?' up':f<=-1?' dn':''))+(cs?'':' raw');
    const fld=f==null?'':` · ${sg(f)} L against the field average (the field ran ${sg(v-f)} L against the standard)`;
    const tip=cs?`${CKL[i]}: ${sg(cs[i])} L on the class scale (${q.cg}): ${sg(v)} L against the standard, less the par for a ${q.cg} winner, plus the rung${fld}`
      :`${CKL[i]}: ${sg(v)} L against the standard (no grade par for this race type)${fld}`;
    return `<td class="n ck${cls}" title="${tip}">${sg(cs?cs[i]:v)}</td>`; }).join('');
}
function formPanel(m,r,x){

// market chance with the book removed.
// Until 12 Sep 2026 this divided every runner by the book, which assumes the
// bookmaker's margin is spread evenly across the field. It is not: it sits on the
// long prices. Measured against ten years of Betfair SP, that assumption made the
// market chance 40% too high on a 1-in-50 shot and 8% too low on a favourite
// (docs/NOTE_2026-09-12_calibration_bsp.md).
// MKT_K is the power-method exponent, fitted on 2019-23 by log loss and confirmed
// on 2024-25, and it lands between 1.11 and 1.14 at every field size, so one number
// does the job. k=1 is the old behaviour. Betfair SP cannot be used here: it does
// not exist until the race has been run.
// Since 1b7ef1c took the value rule off the page this flags nothing, and since 19 Sep 2026
// (the Why column replaced by Rating and Gap) it has no caller. It stays correct anyway, and
// in step with ledger.py's MKT_K, so that a value rule coming back finds them agreeing.
const MKT_K=1.12;

  const sgn=a=>a.map(x=>`${x.name} ${x.shape>0?'+':'−'}${Math.abs(x.shape).toFixed(2)}`).join(', ');
  return `<div class="smap open">${head}<div class="smbody">

// ---- the settle picture (Simon, 29 Sep 2026) -----------------------------------
// x.sc: the settle map's 24 chances in per-mille, cell = depth row x 4 + lane (row 0 the lead band, lane 0 the fence).
// x.sr: the race's raw win rate for each spot at today's track, trip, rail, going and tempo, as a multiple of an even
// share of the field (the same for every runner); each spot is tinted red (below) through amber (about 1.0x) to green.
// Click a horse: the board shows that horse's own chance of each spot beside the rate, and what it adds up to.
// Only where the settle map ran (tracked meetings for now); anywhere else the speed-map columns above stay.
const STD=[['Lead','0-2 L'],['Handy','2-4 L'],['Midfield','4-6 L'],['','6-8 L'],['Back','8-10 L'],['','10 L +']];
const STL=['Fence','1 off','2 off','3+ wide'];
const STSEL={};                                        // race key -> the clicked horse's number
function stKey(r){ return (r.runners[0]||{}).name+'|'+r.no; }
window.stPick=(ev,key,no)=>{ ev.stopPropagation(); STSEL[key]=(STSEL[key]===no?null:no); draw(); };
function stTint(rate){                                 // red < amber (1.0x) < green, strongest at 0.5x and 2x
  if(rate==null) return 'transparent';
  const t=Math.max(-1,Math.min(1,Math.log2(rate)));
  const R=[166,51,80], A=[184,116,26], G=[46,113,80];
  const [c0,c1,u]=t<0?[A,R,-t]:[A,G,t];
  const c=c0.map((v,i)=>Math.round(v+(c1[i]-v)*u));
  return `rgba(${c[0]},${c[1]},${c[2]},${(0.14+0.34*Math.abs(t)).toFixed(3)})`;
}
// ONE FIRM MAP PER RACE (Simon, 11 Oct 2026: "we put too many horses in the same box ... we don't make hard / fast decisions
// ... must use barrier as a key determining factor"). settle_allocate.py's rule, the same here: every horse gets one spot,
// the arrangement with the highest joint chance (an exact assignment), two horses to a box (one behind the other; the 10 L+
// row and the 3+ wide lane take any number), the draw pulling inside gates toward the fence and then dealing the lanes
// within each depth band in gate order. The chances themselves (the table, a clicked horse) are unchanged.
const ST_DRAW_W=1.0;
function stAssign(cost){                               // rectangular Hungarian (rows <= cols): row -> col, minimum total cost
  const n=cost.length, m=cost[0].length, INF=1e18;
  const u=new Array(n+1).fill(0), v=new Array(m+1).fill(0), p=new Array(m+1).fill(0), way=new Array(m+1).fill(0);
  for(let i=1;i<=n;i++){
    p[0]=i; let j0=0; const minv=new Array(m+1).fill(INF), used=new Array(m+1).fill(false);
    do{ used[j0]=true; const i0=p[j0]; let d=INF, j1=0;
      for(let j=1;j<=m;j++) if(!used[j]){ const cur=cost[i0-1][j-1]-u[i0]-v[j]; if(cur<minv[j]){minv[j]=cur; way[j]=j0;} if(minv[j]<d){d=minv[j]; j1=j;} }
      for(let j=0;j<=m;j++){ if(used[j]){u[p[j]]+=d; v[j]-=d;} else minv[j]-=d; }
      j0=j1; } while(p[j0]!==0);
    do{ const j1=way[j0]; p[j0]=p[j1]; j0=j1; } while(j0);
  }
  const ans=new Array(n).fill(-1); for(let j=1;j<=m;j++) if(p[j]) ans[p[j]-1]=j-1; return ans;
}
function stAllocate(on){                               // on: runners with x.sc (24 per-mille) -> each runner's allocated cell
  const n=on.length, slots=[];
  for(let c=0;c<24;c++){ const open=(Math.floor(c/4)===5||c%4===3); for(let k=0;k<(open?n:2);k++) slots.push(c); }
  const bars=on.map(x=>x.bar??99), ord=[...bars.keys()].sort((a,b)=>bars[a]-bars[b]||a-b), rel=new Array(n);
  ord.forEach((i,k)=>{ rel[i]=n>1?k/(n-1):0; });
  const cost=on.map((x,i)=>{ const t=x.sc.reduce((a,b)=>a+b,0)||1;
    return slots.map(c=>-Math.log(Math.max(x.sc[c]/t,1e-6))+ST_DRAW_W*Math.pow((c%4)/3-rel[i],2)); });
  const pick=stAssign(cost), cell=pick.map(j=>slots[j]);
  for(let d=0;d<6;d++){                                // the draw deals the lanes within each depth band
    const ii=cell.map((c,i)=>Math.floor(c/4)===d?i:-1).filter(i=>i>=0);
    if(ii.length>1){ const lanes=ii.map(i=>cell[i]%4).sort((a,b)=>a-b); const byBar=[...ii].sort((a,b)=>bars[a]-bars[b]||a-b);
      byBar.forEach((i,k)=>{ cell[i]=d*4+lanes[k]; }); }
  }
  // Simon's map on the speed map (deploy_usermap2, 23 Oct 2026): a horse he moved on settle.html sits where he put it
  if(on.some(x=>x.umv&&Number.isInteger(x.usp))) return cell.map((c,i)=>on[i].umv&&Number.isInteger(on[i].usp)&&on[i].usp>=0&&on[i].usp<24?on[i].usp:c);
  return cell;
}
function settleBoard(r){
  const on=r.runners.filter(x=>Array.isArray(x.sc)&&x.sc.length===24);
  if(on.length<3) return '';
  const key=stKey(r).replace(/'/g,"\\'");
  const rt=(on.find(x=>Array.isArray(x.sr)&&x.sr.length===24)||{}).sr||null;
  const sel=on.find(x=>x.no===STSEL[stKey(r)])||null;
  const top=r.runners.reduce((m,x)=>(x.plead!=null&&(m===null||x.plead>m.plead))?x:m,null);
  const cell=[...Array(24)].map(()=>[]);
  const alloc0=stAllocate(on), mine=on.some(x=>Number.isInteger(x.usp));   // the firm map: one spot each, the race decided as a whole
  const alloc=on.map((x,i)=>mine&&Number.isInteger(x.usp)&&x.usp>=0&&x.usp<24?x.usp:alloc0[i]);   // Simon's map when he has saved one (usermap.py, 23 Oct 2026)
  on.forEach((x,ix)=>{
    let k=0; x.sc.forEach((v,j)=>{ if(v>x.sc[k]) k=j; });
    const t=x.sc.reduce((a,b)=>a+b,0)||1;
    const sum=f=>x.sc.reduce((a,v,j)=>a+(f(j)?v:0),0)/t;
    x._k=k; x._fence=sum(j=>j%4===0); x._front=sum(j=>Math.floor(j/4)===0); x._wide=sum(j=>j%4===3);
    x._worth=rt?x.sc.reduce((a,v,j)=>a+v*rt[j],0)/t:null;
    x._a=alloc[ix];
    cell[x._a].push(x);
  });
  const chip=x=>{
    const led=top&&top.no===x.no&&top.plead>=0.25, wd=(x._a%4)>=3;
    const cls=(led?'led':'')+(wd?' wd':'')+(sel&&sel.no===x.no?' on':'')+(x.umv?' mv':'');
    const tip=`${x.name}, gate ${x.bar??'?'}: fence ${Math.round(100*x._fence)}%, front row ${Math.round(100*x._front)}%, three wide ${Math.round(100*x._wide)}%`+
              (x.plead!=null?`, ${(100*x.plead).toFixed(0)}% to lead`:'')+' · click for its chances';
    return `<div class="smc ${cls}" role="button" tabindex="0" onclick="stPick(event,'${key}',${x.no})" title="${tip.replace(/"/g,'&quot;')}"><b>${x.no}</b><span>${x.name}</span><i>${x.bar??'?'}</i>${led?`<em>${(100*x.plead).toFixed(0)}%</em>`:''}</div>`;
  };
  const tb=(on.find(x=>x.stb)||{}).stb||null;
  const TBW={fast:'fast',even:'even',slow:'slow'};
  let h=(rt&&tb)?`<div class="sttempo">Expected tempo: <b>${TBW[tb]||tb}</b> · the colours are today's win rates at that tempo</div>`:'';
  if(r.umap) h+=`<div class="sttempo"><b>Your map</b> · saved ${new Date(r.umap.saved).toLocaleString('en-AU',{weekday:'short',hour:'numeric',minute:'2-digit'})} · race confidence ${r.umap.rconf}% · a brown edge marks a horse you moved · the ratings and prices include it · <a href="settle.html">adjust</a></div>`;
  if(sel){
    h+=`<div class="stsel"><b>${sel.no} ${sel.name}</b> · gate ${sel.bar??'?'} · its chance of each spot`+
       (sel._worth!=null?` · worth <b>${sel._worth.toFixed(2)}×</b> an even share (each chance × that spot's rate, added up)`:'')+
       ` · <a href="javascript:void 0" onclick="stPick(event,'${key}',${sel.no})">show the field</a></div>`;
  }
  h+='<div class="stb" role="figure" aria-label="Settle picture: rail along the bottom, leader at the left, wider lanes above, lengths behind the leader across"><div></div>';
  STD.forEach(d=>{ h+=`<div class="hd">${d[0]||'&nbsp;'}<small>${d[1]}</small></div>`; });
  for(let l=3;l>=0;l--){
    h+=`<div class="ln">${STL[l]}</div>`;
    for(let d=0;d<6;d++){
      const j=d*4+l, rate=rt?rt[j]:null;
      const bg=`background:${stTint(rate)}`;
      const corner=rate!=null?`<span class="sr">${rate.toFixed(1)}×</span>`:'';
      if(sel){
        const t=sel.sc.reduce((a,b)=>a+b,0)||1, p=100*sel.sc[j]/t;
        h+=`<div class="cell pick${sel._k===j?' best':''}" style="${bg}">${corner}<div class="pp" style="opacity:${(0.35+0.65*Math.min(1,p/30)).toFixed(2)}">${p<0.5?'·':p.toFixed(0)+'%'}</div></div>`;
      } else {
        const c=cell[j].sort((a,b)=>(a.bar??99)-(b.bar??99));
        h+=`<div class="cell${l===0?' f':''}" style="${bg}">${corner}${c.map(chip).join('')}</div>`;
      }
    }
  }
  h+='<div class="strl">rail</div><div class="strail"></div></div>';
  const rows=[...on].sort((a,b)=>a._k-b._k||b._fence-a._fence).map(x=>
    `<tr class="${sel&&sel.no===x.no?'on':''}" onclick="stPick(event,'${key}',${x.no})"><td>${x.no}</td><td>${x.name}</td><td>${x.bar??'?'}</td><td>${Math.round(100*x._fence)}%</td><td>${Math.round(100*x._front)}%</td>`+
    `<td>${Math.round(100*x._wide)}%</td><td>${STL[x._k%4].toLowerCase()}, ${STD[Math.floor(x._k/4)][1]}</td><td>${x._worth!=null?x._worth.toFixed(2)+'×':'–'}</td></tr>`).join('');
  h+=`<table class="sttab"><thead><tr><th>No.</th><th>Runner</th><th>Bar</th><th>Fence</th><th>Front row</th><th>3 wide</th><th>Likeliest</th><th>Worth</th></tr></thead><tbody>${rows}</tbody></table>`;
  h+='<div class="smnone">Settle map: one spot for every horse, the race decided as a whole -- two to a box, the draw settling who gets the inside when horses want the same spot; a red edge marks a horse placed three wide or more. The table keeps each horse\'s own likeliest spot and its chances. '+
     (rt?'Each spot is coloured by how often a horse settling there wins at today\'s track, trip, rail, going and tempo, against an even share of the field: red below, amber about even (1.0×), green above; the figure in the corner is that multiple. ':'')+
     'Click a horse, or its row, for its chance of every spot and what it is worth.</div>';
  return h;
}

// item 47 (Simon, 17 Sep 2026): the two shortest-priced runners have met each other before.
// True in about one race in six. DISPLAY ONLY -- h2h_cue.py explains why it is not a rating input.
// `dw` is the swing against the meeting named in the sentence; `dwavg` is the mean across every
// meeting, which is what the rating factor uses. The sentence describes one meeting, so it shows dw.
function h2hCue(r){
  const f=r.h2h; if(!f) return '';
  // Name the favourite explicitly: the whole point of the cue is whether THE FAVOURITE was beaten,
  // and a bare pair of horse names does not say which one that is.
  const fv=n=>`${n}<span class="fv">fav</span>`;
  const cls=f.won?'beat':'upset';        // the favourite being beaten is the reading worth the colour
  const W=f.won?`<span class="beat">${fv(f.fav)}</span>`:`<span class="upset">${f.opp}</span>`;
  const L=f.won?f.opp:`<span class="upset">${fv(f.fav)}</span>`;
  let who=f.dead?`<span class="beat">${fv(f.fav)}</span> and <span class="beat">${f.opp}</span> dead-heated`
                :`${W} beat ${L} by ${Math.abs(f.mgn)}L`;
  let where=[f.days===0?'today':f.days===1?'yesterday':`${f.days} days ago`,
             f.track?`at ${f.track}`:'', f.dist?`over ${f.dist}m`:''].filter(Boolean).join(' ');
  if(f.dead) return `<p class="h2hc"><b class="lbl">Top two have met:</b> ${who} ${where}`
    +(f.n>1?` <span class="qual">(${f.n} meetings)</span>`:'')+`</p>`;
  let more=f.n>1?` <span class="qual">(${f.n} meetings, ${f.record[0]}\u2013${f.record[1]}`
      +(f.record[2]?`\u2013${f.record[2]}`:'')+' to the favourite)</span>':'';
  let sw=(f.dw!==null&&f.dw!==undefined&&Math.abs(f.dw)>=0.5)
      ?` &nbsp;·&nbsp; <span class="swing">favourite ${Math.abs(f.dw)}kg ${f.dw>0?'worse':'better'} off today</span>`:'';
  return `<p class="h2hc"><b class="lbl">Top two have met:</b> ${who}, ${where}${more}${sw}</p>`;
}
// ---- the worm (Simon, 16 Oct 2026) ---------------------------------------------------------------------------------
// x.runs (worm.py): the last ten real starts, oldest first, each [days before today, track, metres, surface d/s/w/y,
// finish, field, figure, spell]. The figures are the vendor's per-run ratings from the form rows under today's
// nomination, the rows the Base reads, so the line sits on the Base / Adjusted scale. The row's icon opens the worm
// under the row; a click anywhere else on the row opens the rating detail as before. One open at a time. Display only.
let wormKey=null, wormN=10, wormDist=null;           // wormDist: [lo, hi] metres, reset to today's trip +-200 per race
const WSURF={d:'Good',s:'Soft',w:'Heavy',y:'Synthetic'};
const wkey=(r,x)=>`${M().track}|${r.no}|${x.no}`;

// the winning standard (winbar.py, 28 Oct 2026, display only): the form figure this race's winner likely runs, from the
// class and the field's recent bests (the best two of each runner's last five inside a year), and who has run it lately.
// It is on the worm's scale, the vendor's figures, not the Base / Rating columns' points. Nothing on the page rates off it.
const WBT="Likely Winning Rating: the rating the winner of this race is likely to run -- usually above every runner's average, since winners tend to run above theirs. SPM rating points, from the class and the field's recent best runs (each runner's best two of its last five inside a year).";
function wbChip(r){ const w=r.wb; if(!w||w.w==null) return '';
  return ` &nbsp;·&nbsp; <span class="wbchip" title="${WBT}">Likely Winning Rating ${Math.round(w.w)}</span>`; }

  return `<span class="wbm" title="recent best ${x.wbr.toFixed(1)} reaches the Likely Winning Rating of ${Math.round(w.w)}">${Math.round(x.wbr)}</span>`; }
// a smooth line through the points: a MONOTONE cubic (Fritsch-Butland tangents), so the line is eased but never swings
// past a value between two runs -- a plain spline overshot a 46-to-77 jump to 78. The dots stay on the values.
function wSmooth(p){
  const n=p.length; if(n<2) return '';
  const f=v=>v.toFixed(1), h=[], dl=[], m=new Array(n);
  for(let k=0;k<n-1;k++){ h[k]=p[k+1][0]-p[k][0]; dl[k]=(p[k+1][1]-p[k][1])/h[k]; }
  m[0]=dl[0]; m[n-1]=dl[n-2];
  for(let k=1;k<n-1;k++) m[k]=dl[k-1]*dl[k]<=0?0:3*(h[k-1]+h[k])/((2*h[k]+h[k-1])/dl[k-1]+(h[k]+2*h[k-1])/dl[k]);
  if(n>2){ m[0]=dl[0]*dl[1]<=0?0:dl[0]; m[n-1]=dl[n-2]*dl[n-3]<=0?0:dl[n-2]; }
  let d=`M${f(p[0][0])},${f(p[0][1])}`;
  for(let k=0;k<n-1;k++) d+=` C${f(p[k][0]+h[k]/3)},${f(p[k][1]+m[k]*h[k]/3)} ${f(p[k+1][0]-h[k]/3)},${f(p[k+1][1]-m[k+1]*h[k]/3)} ${f(p[k+1][0])},${f(p[k+1][1])}`;

}
function wDate(age){ const d=new Date(D().date+'T00:00:00'); d.setDate(d.getDate()-age);

// The worm's today (28 Oct 2026, Simon: "they need to match"): an Australian runner's expected figure is its SPM rating, the

function wormRow(r,x){

  if(r.wb&&r.wb.w!=null){ const yw=ys(r.wb.w);     // the winning zone: everything at or above the bar, lightly shaded
    s+=`<rect class="wbz" x="${L}" y="${T}" width="${W-R-L}" height="${Math.max(0,yw-T)}"/><text class="wbz" x="${L+6}" y="${T+13}">Likely Winning Rating · ${Math.round(r.wb.w)}</text>`; }
  if(!FC) s+=`<line class="today" x1="${L}" x2="${W-R}" y1="${ys(td)}" y2="${ys(td)}"/><text class="tl" x="${W-R-4}" y="${ys(td)-5}" text-anchor="end">expected today ${td.toFixed(1)}</text>`;
  all.forEach((z,i)=>{ if(i&&z[7]) s+=`<line class="spell" x1="${xs(i-1)}" x2="${xs(i)}" y1="${H-B+6}" y2="${H-B+6}"/>`; });
  const yc=v=>ys(Math.max(v,y0));   // a run under the floor sits on it

// the wet line (Simon, 17 Oct 2026): rated as Soft 7 or heavier, each runner shows its wet record (starts: wins-seconds-

function wetLine(r,x){
  if(!wetOn(r)||!('wet' in x)||x.unrated&&!x.wet) return null;             // no 'wet' key: a day file from before wet.py

  const adj=a==null||!w||!w[0]?'':`<b class="${!w||!w[0]?'f':a>=0.5?'p':a<=-0.5?'g':'f'}">${a>0?'+':a<0?'−':''}${Math.abs(a).toFixed(1)}</b>`;

// the quaddie selector (Simon, 19 Oct 2026): on each leg's race page, one line for each quaddie that race is in -- BET or SIT OUT,
// the combinations and the flexi -- that opens to the ticket: every leg's runners in order of the model's chance until they
// reach QUAD_COVER (the runner that crosses it is in), and QUAD_STAKE as a flexi; a bet only at QUAD_MAX combinations or fewer.
// The legs are TAB's own (m.quads, quadlegs.py). Tested on 10,088 VIC-pool quaddies 2022-25 (quaddie_cover_skip.py): on the
// model's chances this rule got back about 85c a dollar; on Betfair SP's, about $1.10. QOPEN keeps a line open across redraws.
// Hong Kong takes a wider ticket (Simon, 19 Oct 2026: "slightly bigger fields ... more value ... say 150 or 200 combos"): 150.
const QUAD_COVER=60, QUAD_STAKE=40, QUAD_MAX=100, QUAD_MAX_HK=150;
// Simon, 19 Oct 2026: the tie rule (Sha Tin R8, 9.1% in and 8.5% out): past the cover, a runner within QUAD_TIE of the LAST runner in
// comes in too, against that one runner, not chained; the near miss (Muswellbrook R4, Costa Del Sol 58.9% alone): a leg within
// QUAD_NEAR points of the cover stops there
const QUAD_TIE=0, QUAD_NEAR=2;
window.QOPEN={};
function quadLeg(r){
  const c=x=>x.pct!=null?x.pct:(x.fair>0?100/x.fair:0);
  const rs=r.runners.filter(x=>c(x)>0).slice().sort((a,b)=>c(b)-c(a)), z=rs.reduce((a,x)=>a+c(x),0);
  if(!rs.length||!(z>0)) return null;
  const pick=[]; let cum=0;
  for(const x of rs){ pick.push(x); cum+=100*c(x)/z; if(cum>=QUAD_COVER-QUAD_NEAR-1e-9) break; }
  const n0=pick.length, edge=c(pick[n0-1])*(1-QUAD_TIE);

  return {pick,cum,n0};

function drillRow(m,r){

function hkLedger(x,r){

  const fw=r.runners.reduce((a,y)=>a+(y.wt||0),0)/r.runners.length;

  const cell=(n,v,w)=>`<div><div class="n">${n}</div><div class="v ${vc(v)}">${sg(v)}</div><div class="w">${w}</div></div>`;
  const info=(n,v,w)=>`<div><div class="n">${n}</div><div class="v">${v}</div><div class="w">${w}</div></div>`;
  return `<div class="adjsum"><span>Base</span><b>${x.wprbase.toFixed(1)}</b><span class="ar">&rarr;</span><span>SPM Rating</span><b class="tot">${x.rating.toFixed(1)}</b>`
    +`<span class="net ${nc}">${Math.abs(net)<0.05?'level':(net>0?'up':'down')+' '+Math.abs(net).toFixed(1)} on today's things</span>`
    +`<span class="ar">· in handicap pounds · base starts at the field average mark, ${r.markmean!=null?r.markmean.toFixed(1):'—'}</span></div>`
    +(x.fxg?(`<div class="hkgrp">Base · ability</div><div class="adjr">`+x.fxg.filter(g=>g.g==='base').map(g=>cell(g.t,g.v,g.w)).join('')
      +`</div><div class="hkgrp">Adjust · today and the HK model's factors</div><div class="adjr">`+x.fxg.filter(g=>g.g!=='base').map(g=>cell(g.t,g.v,g.w)).join(''))
    :(`<div class="hkgrp">Base · ability</div><div class="adjr">`
    +cell('Form against its mark',f.form,x.pvm==null?'no HK form yet · the field average'
        :`has run ${sg(x.pvm,1)} lb against its mark, its last ${Math.min(x.starts||0,10)} HK runs weighted to recent, bad runs forgiven · against the field`)
    +cell('The mark',f.mark,`rated ${x.mark??'—'}${x.mark_chg?` (${sg(x.mark_chg,0)} since its last start)`:''} · against the field`)
    +`</div><div class="hkgrp">Adjust · today</div><div class="adjr">`
    +cell('Weight carried',f.wt,`carries ${x.wt} lb${x.claim?` after a ${x.claim} lb claim`:''}, the field ${fw.toFixed(1)}`)
    +cell('Days off',f.days,x.days==null?'first HK start':`${x.days} days since its last HK run`)
    +cell('HK starts',f.starts,`${x.starts} HK start${x.starts===1?'':'s'}`)))
    +`</div><div class="hkgrp">On the card · not in the rating</div><div class="adjr hkinfo">`
    +info('Body weight',x.bodywt!=null?x.bodywt+' lb':'—',x.bodywt_chg!=null?`${sg(x.bodywt_chg,0)} lb on its last declaration`:'no change shown')
    +info('Gear',x.gear||'none','HKJC codes, as declared')
    +info('Level',x.level!=null?x.level.toFixed(1):'—','its mark plus its form against it')
    +`</div>`;
}

function countdown(){
  const now=Date.now();
  document.querySelectorAll("nav .cd[data-t],.daytab .cd[data-t]").forEach(el=>{
    const lv=LIVE[el.dataset.k]; const st=lv&&lv.status, tr=el.closest('.daytab tr');
    if(tr) tr.classList.toggle('near',!(st&&st!=='Normal')&&!!el.dataset.t&&(new Date(el.dataset.t).getTime()-now)>0&&(new Date(el.dataset.t).getTime()-now)<=600000);   // inside 10 minutes (23 Oct 2026)
    if(st&&st!=='Normal'){ const m={Closed:['closed','soon'],Interim:['interim','soon'],Paying:['paying','gone'],Abandoned:['abnd','gone']}[st];
      if(m){el.textContent=m[0]; el.className='cd '+m[1]+' st'; return;} }
    const t=el.dataset.t; if(!t){el.innerHTML="&nbsp;";return;}
    let s=Math.round((new Date(t).getTime()-now)/1000), cls="";
    let txt;
    if(s<=-1800){txt="ran";cls="gone";}
    else if(s<=0){txt="jumping";cls="soon";}
    else if(s>=86400){txt=Math.floor(s/86400)+"d";}
    else if(s>=3600){txt=Math.floor(s/3600)+"h "+Math.floor((s%3600)/60)+"m";}
    else{txt=Math.max(1,Math.ceil(s/60))+"m";cls="soon";}
    el.textContent=txt; el.className="cd"+(cls?" "+cls:"");
  });
}

// ---- swipe between races (Simon, 19 Sep 2026, on the phone): inside a meeting, a swipe left on the race
// panel moves to the next race, a swipe right to the previous one (and back to the Summary before R1).
// Mostly sideways, at least 60px, finished within a second; never from inside something that scrolls
// sideways itself (the speed map, a wide table), where the finger is scrolling that instead.
(function(){
  let t0=null;
  // the innermost thing under the finger that scrolls sideways, or null: the field table once
  // Lengths pushes it past a narrow phone, and the speed map at any width
  const sideways=el=>{ for(;el&&el.id!=='race';el=el.parentElement){ if(el.scrollWidth>el.clientWidth+1&&/auto|scroll/.test(getComputedStyle(el).overflowX)) return el; } return null; };
  const race=$("race");
  race.addEventListener('touchstart',e=>{ if(e.touches.length!==1){t0=null;return;}
    const t=e.touches[0]; t0={x:t.clientX,y:t.clientY,at:Date.now(),box:sideways(e.target)}; },{passive:true});
  race.addEventListener('touchend',e=>{
    if(!t0||meet<0||e.changedTouches.length!==1) {t0=null;return;}
    const t=e.changedTouches[0], dx=t.clientX-t0.x, dy=t.clientY-t0.y, s=t0; t0=null;
    if(Date.now()-s.at>1000||Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*0.6) return;
    // started inside something that scrolls sideways: that drag is the table's while it has
    // room left in the direction of travel, and ours once it is against the end
    if(s.box&&(dx<0 ? s.box.scrollWidth-s.box.clientWidth-s.box.scrollLeft : s.box.scrollLeft)>1) return;
    const n=M().races.length, to=dx<0?Math.min(active+1,n-1):Math.max(active-1,-1);
    if(to===active) return;
    active=to; open=null; draw(); $("tabs").scrollIntoView({behavior:'smooth',block:'nearest'});
  },{passive:true});
})();

function tabAgeInfo(){
  if(!window.TAB_GENERATED) return null;
  const gen=new Date(window.TAB_GENERATED); if(isNaN(gen)) return null;
  const mins=Math.round((Date.now()-gen)/60000);
  const now=new Date(), mod=now.getHours()*60+now.getMinutes();
  const inWindow=mod>=480&&mod<=1350;
  let cls='';
  if(inWindow){ if(mins>=45) cls='bad'; else if(mins>=16) cls='warn'; }
  const txt=mins<1?'just now':mins<60?`${mins}m ago`:`${Math.floor(mins/60)}h ${mins%60}m ago`;
  return {txt,cls};
}

    if(PAST) pastNote(true);
    window.TAB_GENERATED=PAST?null:(j&&j.generated||null); refreshTabAge();
    window.WX=j&&j.wx||null;
    const races=j&&j.races||{}, nx=(j&&j.next&&j.next.date&&j.next.date!==j.date)?j.next:null;
    const sig=JSON.stringify(races)+(j&&j.wx&&j.wx.at||'')+(nx?nx.generated||'':''); if(sig===last) return;
    last=sig; window.LIVE=races; window.LIVEBY={[j.date]:races}; if(nx) LIVEBY[nx.date]=nx.races||{};
    applyLivePrices(races,j.date); if(nx) applyLivePrices(nx.races||{},nx.date); draw();   // tomorrow's early markets on its tab
  }
  tick(); if(!PAST) setInterval(tick,60000); window._liveTick=tick;
})();

// ---- earlier days (Simon, 4 Nov 2026) --------------------------------------
// The picker opens day_<date>.html: every rating publishes the page under that name as well as index.html, so the page of a
// past day is the one that was live, and dash_history.py freezes the day's closing prices and results beside it after the
// day. A date with no page (before the dash, or a day with no racing) says so instead of landing on a 404.
(function(){
  const el=$("histd"); if(!el) return;
  const y=new Date(TODAY+'T00:00:00'); y.setDate(y.getDate()-1);
  el.max=y.toLocaleDateString('en-CA'); el.min='2026-09-05';
  if(PAST){ el.value=DATA.days[0].date; $("hist").insertAdjacentHTML('beforeend','<a href="index.html">Today ›</a>'); }
})();
async function histGo(d){
  const msg=$("hmsg"); if(!d) return;
  if(d>=TODAY){ location.href='index.html'; return; }
  msg.textContent='…';
  let ok=false; try{ const r=await fetch(`day_${d}.html`,{method:'HEAD',cache:'no-cache'}); ok=r.ok; }catch(e){ ok=false; }
  if(!ok){ msg.textContent=`no page for ${fmtDate(d,{day:'numeric',month:'short'})}`; return; }
  msg.textContent=''; location.href=`day_${d}.html`;
}
function pastNote(frozen){
  if(!PAST||$("pastbar")) return;
  const d=DATA.days[0].date, when=fmtDate(d,{weekday:'long',day:'numeric',month:'long'});
  document.querySelector('.wrap').insertAdjacentHTML('afterbegin',`<div class="pastbar" id="pastbar"><span>Reviewing <b>${when}</b>: the ratings as last published that day`
    +(frozen?', with TAB\'s closing prices, the scratchings and the results.':'. The closing prices and results for this day are not on file.')+`</span><a href="index.html">Back to today ›</a></div>`);
}
// ---- find a horse (Simon, 4 Nov 2026) --------------------------------------
// hidx/<L>.json: [[name, id, last run, trainer], ...] for every horse whose name starts with L (A-Z, 0 for the rest), fetched
// once per letter as the user types; h/<id>.json the horse's guide. Both from horsecard.py, nightly, every horse with a
// run since 2023. Enter opens the first match, Escape closes.
const HIDX={}, HREC={}; let HSEL=0, HOPEN=null;
function hsLetter(q){ const n=q.toUpperCase().replace(/[^A-Z0-9]/g,''); return n?(/[A-Z]/.test(n[0])?n[0]:'0'):null; }
function hsIndex(L){
  if(HIDX[L]!==undefined) return HIDX[L];
  HIDX[L]='…';
  fetch(`hidx/${L}.json`,{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{HIDX[L]=Array.isArray(j)?j:null;}).catch(()=>{HIDX[L]=null;}).finally(hsType);
  return '…';
}
function hsMatches(q){
  const L=hsLetter(q); if(!L) return [];
  const idx=hsIndex(L); if(idx==='…'||!idx) return idx;
  const n=q.toUpperCase().replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim(), nn=n.replace(/ /g,'');
  const pre=[], mid=[];
  for(const e of idx){ const u=String(e[0]).toUpperCase(), uu=u.replace(/[^A-Z0-9]/g,'');
    if(uu.startsWith(nn)) pre.push(e); else if(u.includes(n)) mid.push(e); if(pre.length>=12) break; }
  return pre.concat(mid).slice(0,12);
}
function hsType(){
  const q=($("hsq").value||'').trim(), box=$("hsres");
  if(q.length<2){ box.hidden=true; box.innerHTML=''; return; }
  const m=hsMatches(q); box.hidden=false; HSEL=Math.min(HSEL,Math.max(0,(Array.isArray(m)?m.length:0)-1));
  if(m==='…'){ box.innerHTML='<div class="hsmsg">Looking…</div>'; return; }
  if(!m){ box.innerHTML='<div class="hsmsg">The horse index is not on the dash yet.</div>'; return; }
  if(!m.length){ box.innerHTML=`<div class="hsmsg">No horse matching “${q.replace(/</g,'')}” (every horse raced or trialled since 2023).</div>`; return; }
  box.innerHTML=m.map((e,i)=>`<button type="button" class="${i===HSEL?'on':''}" onclick="openHorse(${e[1]},this)"><b>${e[0]}</b><span class="s">${e[3]||''}${e[2]?' · '+e[2].slice(8,10)+'/'+e[2].slice(5,7)+'/'+e[2].slice(2,4):''}</span></button>`).join('');
}
function hsKey(ev){
  const box=$("hsres"), items=box.hidden?[]:[...box.querySelectorAll('button')];
  if(ev.key==='Escape'){ box.hidden=true; $("hsq").blur(); return; }
  if(!items.length) return;
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ ev.preventDefault(); HSEL=(HSEL+(ev.key==='ArrowDown'?1:items.length-1))%items.length; items.forEach((b,i)=>b.classList.toggle('on',i===HSEL)); }
  else if(ev.key==='Enter'){ ev.preventDefault(); (items[HSEL]||items[0]).click(); }
}
document.addEventListener('click',e=>{ if(!e.target.closest('.hs')) { const b=$("hsres"); if(b) b.hidden=true; } });
function openHorse(id){
  $("hsres").hidden=true; HOPEN=id;
  if(HREC[id]===undefined){ HREC[id]='…';
    fetch(`h/${id}.json`,{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{HREC[id]=j&&j.h?j:null;}).catch(()=>{HREC[id]=null;}).finally(drawHorse); }
  drawHorse();
}
function closeHorse(){ HOPEN=null; $("hpan").hidden=true; $("hpi").innerHTML=''; }
window.hsAll=k=>{ if(FCALL.has(k)) FCALL.delete(k); else FCALL.add(k); drawHorse(); };
function drawHorse(){
  if(HOPEN==null) return;
  const f=HREC[HOPEN], p=$("hpan"), c=$("hpi"); p.hidden=false;
  const x=`<button type="button" class="hpx" onclick="closeHorse()" title="close (Esc)" aria-label="close">&#10005;</button>`;
  if(f==='…'){ c.innerHTML=`<div class="hph"><h2>Loading…</h2>${x}</div>`; return; }
  if(!f){ c.innerHTML=`<div class="hph"><h2>No record on the dash for this horse</h2>${x}</div>`; return; }
  const h=f.h||{}, dd=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(2,4)}`:'';
  const meta=[h.type,h.tr?`Trainer ${h.tr}`:null,h.lastrun?`Last start ${dd(h.lastrun)}`:(h.last?`Last trial ${dd(h.last)}`:null),h.won?`Won at ${h.won}`:null].filter(Boolean).map(s=>`<span class="m">${s}</span>`).join('');
  c.innerHTML=`<div class="hph"><h2>${h.name||''}</h2>${meta}${h.l20?`<span class="l20" title="the last twenty starts, oldest first; x a spell">${last5(h.l20)}</span>`:''}${x}</div>`
    +formBody(f,'h:'+HOPEN,true).replace(/fcAll\(/g,'hsAll(');
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&HOPEN!=null) closeHorse(); });

// ---- replay dock: a replay plays on the page, not in a new tab -------------
// Two kinds of link land here. TAB's Sky replays (mediatabs.skyracing.com.au) are
// plain MP4s -- open Akamai files, no referer check -- and play in a <video>.
// racing.com jump-outs are Brightcove player pages, so they go in an iframe.
// Anything else returns false and the click falls through to the old new-tab
// behaviour, so an unrecognised link is never swallowed.
function playVid(url,label){
  const b=$("vdb"); if(!b||!url) return false;
  let inner;
  if(/\.mp4(\?|$)/i.test(url))
    inner=`<video src="${url}" controls autoplay playsinline preload="metadata"></video>`;
  else if(/^https:\/\/players\.brightcove\.net\//i.test(url))
    inner=`<iframe src="${url}${url.includes('?')?'&':'?'}autoplay=true" allowfullscreen
             allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  else if(/^https:\/\/racing\.hkjc\.com\/contentAsset\/videoplayer/i.test(url))      // HKJC's replay page, the one their results page frames (1 Nov 2026)
    inner=`<iframe src="${url}" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  else if(/^https:\/\/vimeo\.com\/\d+/i.test(url))                                     // RWWA's WA trials: the watch page refuses a frame, the player embeds (1 Nov 2026, Simon: in the window, like the live vision)
    inner=`<iframe src="https://player.vimeo.com/video/${url.match(/^https:\/\/vimeo\.com\/(\d+)/i)[1]}?autoplay=1" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  else return false;
  $("vdt").textContent=label||'Replay';
  b.innerHTML=inner;
  killHls();
  $("vdock").classList.remove('wide');
  $("vdock").hidden=false;
  return true;
}
window.closeVid=()=>{ killHls(); const b=$("vdb"); if(b) b.innerHTML='';
  const d=$("vdock"); if(d){ d.hidden=true; d.classList.remove('wide'); } };
// Delegated: the live feed rebuilds #race under us every time a price moves, so a
// handler bound to the links themselves would not survive the first redraw.
document.addEventListener('click',e=>{
  if(e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;   // ctrl/cmd-click still opens a tab
  const a=e.target.closest('a.l5b[href], a.replay[href], a.frp[href]');   // .frp: the form panel's run table (1 Nov 2026)
  if(!a) return;
  const label=a.dataset.vlabel||(a.getAttribute('title')||'').trim()||'Replay';
  if(playVid(a.href,label)) e.preventDefault();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeVid(); });

// ---- watch live: racing.com's own player, in the dock ------------------------
// Their Watch Live page mounts a standard Brightcove iframe
// (players.brightcove.net/<account>/<player>/index.html?videoId=<id>) and that
// embed plays in a plain tab with no login: Simon tested it on 19 Sep 2026, after
// the probe (rcom_stream_probe.py) read the ids out of their page data. So the dock
// frames the bare player, nothing of their page around it. The ids arrive from the
// build in DATA.watch_live.embed (rcom_live.py re-reads them weekly); the built-in
// ones are what the page carried on 19 Sep. "pop out" opens the same player in its
// own window; "racing.com page" opens their Watch Live page. Free vision is
// Victorian, SA and some WA racing and the stream is Australia-only, both checked
// against whoever is viewing this page, not against the box that built it.
const WL=DATA.watch_live||{};
const WATCH_LIVE=WL.url||"https://www.racing.com/videos/watch-live";    // their page, for the link
const EMBED=Object.assign({account:"3461375237001",player:"sNYVJfSom_default",video:"6371333751112",
                           title:"Watch Live",trials_video:"6367463974112",trials_title:"Live trials"},WL.embed||{});
const embedUrl=v=>`https://players.brightcove.net/${EMBED.account}/${EMBED.player}/index.html?videoId=${v}&autoplay=true`;
window.watchLive=(which)=>{
  const b=$("vdb"), d=$("vdock"); if(!b||!d) return;
  killHls();
  const trials=which==='trials'&&EMBED.trials_video;
  const v=trials?EMBED.trials_video:EMBED.video;
  const links=[`<a href="${embedUrl(v)}" target="rcomlive" rel="noopener">pop out &#8599;</a>`,
               `<a href="${WATCH_LIVE}" target="_blank" rel="noopener">their page &#8599;</a>`,
               '<a href="#" onclick="skyLive(\'sky1\');return false;">Sky 1</a>',
               '<a href="#" onclick="skyLive(\'stc\');return false;">Sky TC</a>'];
  if(EMBED.trials_video) links.splice(1,0,trials
    ? '<a href="#" onclick="watchLive();return false;">live racing</a>'
    : `<a href="#" onclick="watchLive('trials');return false;">live trials</a>`);
  $("vdt").innerHTML=`Racing.com ${trials?'live trials':'live'} &nbsp;\u00b7&nbsp; `+links.join(' &nbsp;\u00b7&nbsp; ');
  b.innerHTML=`<iframe src="${embedUrl(v)}" allowfullscreen
                 allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  d.classList.add('wide');
  d.hidden=false;
};

// ---- Sky, straight off the HLS: Thoroughbred Central and Sky 1 --------------
// Racing NSW publish this channel on their own homepage as a plain JW Player
// with an unauthenticated Akamai URL: no login, no token, no EXT-X-KEY. Five
// bitrates to 1280x720, 3-second segments. It is the channel feed, thoroughbreds
// nationally -- whatever is jumping next -- not the vision for the meeting on
// screen, which is why its button does not wait for a meeting to be picked.
// Sky 1 (7 Oct 2026, Simon): the TAB's own channel on the same Akamai service,
// open the same way (no token, CORS *), six bitrates to 1280x720, 3-second
// segments. All three codes, so it carries harness and greyhounds too.
const SKY={stc:{name:"Sky TC",url:"https://skylivernsw.akamaized.net/hls/live/2036965/stc/index.m3u8"},
           sky1:{name:"Sky 1",url:"https://skylivetab-new.akamaized.net/hls/live/2038780/sky1/index.m3u8"}};
const HLSJS="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.6.15/hls.min.js";
const HLSJS_SRI="sha512-CSVqc4a7tn+tizDNt+eDoVn2fXYAwMDpCLrwGlWrOktNfZQ9gp4dKKScElMeRlrIifhliXs0a06BLaUgmMlCUw==";
let _hls=null;

// 150 KB, fetched the first time live vision is asked for and never on a plain
// page load. Safari plays HLS natively and skips this entirely.
function loadHls(){
  if(window.Hls) return Promise.resolve();
  if(!loadHls._p) loadHls._p=new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src=HLSJS; el.integrity=HLSJS_SRI; el.crossOrigin="anonymous";
    el.onload=res; el.onerror=()=>{ loadHls._p=null; rej(new Error('hls.js did not load')); };
    document.head.appendChild(el);
  });
  return loadHls._p;
}
function killHls(){ if(_hls){ try{ _hls.destroy(); }catch(e){} _hls=null; } }

window.skyLive=async (ch)=>{
  const c=SKY[ch]||SKY.stc, other=c===SKY.stc?'sky1':'stc';
  const b=$("vdb"), d=$("vdock"); if(!b||!d) return;
  killHls();
  $("vdt").innerHTML=c.name+' &nbsp;\u00b7&nbsp; live &nbsp;\u00b7&nbsp; '+
    `<a href="#" onclick="skyLive('${other}');return false;">${SKY[other].name}</a>`+
    ' &nbsp;\u00b7&nbsp; <a href="#" onclick="watchLive();return false;">Racing.com</a>';
  b.innerHTML='<video id="skyv" controls autoplay playsinline></video>';
  d.classList.add('wide'); d.hidden=false;
  const v=document.getElementById("skyv");
  if(v.canPlayType('application/vnd.apple.mpegurl')){ v.src=c.url; return; }
  try{ await loadHls(); }
  catch(e){ b.innerHTML='<p class="vmsg">Live vision needs hls.js and it did not load. '+
            '<a href="'+c.url+'" target="_blank" rel="noopener">Open the stream</a></p>'; return; }
  if(!document.getElementById("skyv")) return;           // closed while the script loaded
  _hls=new Hls({liveDurationInfinity:true});
  _hls.loadSource(c.url);
  _hls.attachMedia(v);
  _hls.on(Hls.Events.ERROR,(_e,data)=>{
    if(!data.fatal) return;                              // hls.js retries these itself
    if(data.type===Hls.ErrorTypes.NETWORK_ERROR) _hls.startLoad();
    else if(data.type===Hls.ErrorTypes.MEDIA_ERROR) _hls.recoverMediaError();
    else { killHls(); b.innerHTML='<p class="vmsg">The Sky feed dropped out. Close and try again.</p>'; }
  });
};

// ---- status strip: reads status.json beside the page, polls every 60 s ----
(function(){
  const el=$("trs"); if(!el) return;
  let seen=null, pageStamp=null;   // pageStamp = 'Fri 04 Sep 23:21' from the injected banner
  const asDate=s=>{if(!s) return null; const d=new Date(s.length<=19?s+(s.includes('T')?'':'T00:00:00'):s); return isNaN(d)?null:d;};
  const hm=d=>d?d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:false}):'—';
  const wd=d=>d?d.toLocaleDateString('en-AU',{weekday:'short'}):'';
  const ago=d=>{if(!d) return ''; const m=Math.round((Date.now()-d)/60000);
    return m<1?'just now':m<60?`${m}m ago`:m<1440?`${Math.floor(m/60)}h ${m%60}m ago`:`${Math.floor(m/1440)}d ago`;};
  async function tick(){
    if(PAST) return;                                   // a past day's page keeps the Rated strip it was published with
    let j;
    try{const r=await fetch('status.json',{cache:'no-store'}); if(!r.ok) throw 0; j=await r.json();}
    catch(e){ return; }                                   // leave the injected banner as-is
    const old=document.getElementById('tr-updated');
    if(old){ pageStamp=(old.querySelector('b')||{}).textContent||null;
      if(old.nextElementSibling&&old.nextElementSibling.style.height) old.nextElementSibling.remove(); old.remove(); }
    const failed=j.status&&j.status!=='ok';
    const fin=asDate(j.finished||j.started), ext=asDate(j.extract);
    const rs=j.rider_share, prelim=!!j.preliminary||(rs!=null&&rs<0.6);
    const state=failed?'fail':(prelim?'prelim':'ok');
    const sameDay=fin&&new Date().toDateString()===fin.toDateString();
    const stamp=fin?`${wd(fin)} ${String(fin.getDate()).padStart(2,'0')} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][fin.getMonth()]} ${hm(fin)}`:null;
    let h=`<span class="dot"></span>
      <span class="t">${failed?'Last run <b>failed</b>':'Rated'} <b>${sameDay?'':wd(fin)+' '}${hm(fin)}</b> <span class="ago">${ago(fin)}</span>${j.reason?` · <span class="why">${j.reason}</span>`:''}</span>`;
    if(prelim&&!failed) h+=`<span class="tag" title="rider share below 60% — connections are unreliable until riders are declared">preliminary</span>`;
    if(failed) h+=`<span class="tag" title="${(j.error||'').replace(/"/g,'&quot;')}">${/publish/i.test(j.error||'')?'publish failed':'rating failed'}</span>`;
    const m=[];
    if(j.acceptors!=null) m.push(`<span><i>${j.acceptors}</i> acceptors</span>`);
    if(rs!=null) m.push(`<span>riders <i class="${rs<0.6?'bad':(rs<0.9?'warn':'')}">${Math.round(rs*100)}%</i></span>`);
    if(j.scratchings!=null) m.push(`<span><i>${j.scratchings}</i> scr</span>`);
    if(ext) m.push(`<span>extract <i>${hm(ext)}</i></span>`);
    m.push(`<span>TAB <i class="tab-age">—</i></span>`);
    h+=`<span class="m">${m.join('')}</span>`;
    // newer rating than this page?  (status.json changed since first poll, or page banner stamp differs from status)
    const stale=!failed&&((seen&&j.finished&&j.finished!==seen)||(pageStamp&&stamp&&pageStamp!==stamp&&fin>new Date(pageStamp.replace(/^[A-Za-z]+ /,'')+' '+fin.getFullYear())));
    if(stale) h+=`<button class="reload" onclick="location.reload()">Re-rated ${hm(fin)} — reload</button>`;
    if(!seen) seen=j.finished||null;
    el.className='trs '+state; el.innerHTML=h; el.hidden=false;
    refreshTabAge();
    document.body.style.paddingBottom=(el.offsetHeight+6)+'px';
  }
  function readBanner(){
    const old=document.getElementById('tr-updated'); if(!old) return;
    pageStamp=(old.querySelector('b')||{}).textContent||null;   // read for the stale check in tick()
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>{readBanner();tick();});
  else {readBanner();tick();}
  setInterval(tick,60000); window._trsTick=tick;
})();
